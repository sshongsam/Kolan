  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b0f19;
      color: #e5e7eb;
      overflow-x: hidden;

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f59e0b;
    }

    /* Glassmorphism utility */
    .glass-panel {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 158, 11, 0.15); /* Amber border */
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    
    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f3f4f6;
      transition: all 0.2s ease-in-out;
    }
    
    .glass-input:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
      outline: none;
    }

    .neon-text-glow {
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
    }

    .neon-border-glow:hover {
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
      border-color: rgba(245, 158, 11, 0.4);
    }

    /* Scanline Animation */
    @keyframes scan {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }
    .scan-line {
      position: absolute;
      width: 100%;
      height: 4px;
      background: linear-gradient(180deg, transparent, rgba(245, 158, 11, 0.8), transparent);
      animation: scan 4.5s linear infinite;
      pointer-events: none;
    }

    /* Radar sweeping animation */
    @keyframes sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .radar-sweep {
      transform-origin: 50% 50%;
      animation: sweep 4s linear infinite;
    }

    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        font-family: 'Batang', 'Times New Roman', serif !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        display: block !important;
      }
    }
  </style>
</head>
<body>

  <!-- React root mount point -->
  <div id="root"></div>

  <!-- Core App Code in Babel JSX -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- ACTIVE CASES DATABASE (1단계 신고접수 시스템 및 법정 사전등록과 연동되는 기본 실종 사건 데이터) ---
    const ACTIVE_CASES = [
      {
        id: "2026-MP-098234",
        name: "김민우",
        age: 7,
        gender: "남",
        type: "아동 (가목)",
        missingTime: "2026-05-27T03:30", // 3시간 전 실종
        missingLoc: "서울 강남역 3번출구 놀이터",
        height: 118,
        weight: 22,
        build: "보통",
        faceShape: "계란형",
        hairStyle: "단발생머리",
        hairColor: "검은색",
        clothingUpper: "노란색 티셔츠",
        clothingLower: "청바지",
        clothingShoes: "흰색 운동화",
        clothingHat: "뽀로로 캡모자",
        otherFeatures: "오른쪽 뺨에 옅은 흉터, 뽀로로 캐릭터를 매우 좋아함."
      },
      {
        id: "2026-MP-154930",
        name: "이하은",
        age: 11,
        gender: "여",
        type: "아동 (가목)",
        missingTime: "2026-05-27T01:30", // 5시간 전 실종
        missingLoc: "부산 해운대 해수욕장 입구 광장",
        height: 132,
        weight: 28,
        build: "야윔",
        faceShape: "계란형",
        hairStyle: "어깨선 단발머리",
        hairColor: "갈색",
        clothingUpper: "흰색 블라우스",
        clothingLower: "핑크색 치마",
        clothingShoes: "빨간색 샌들",
        clothingHat: "분홍색 백팩",
        otherFeatures: "발음이 부정확하며 왼손잡이임."
      },
      {
        id: "2026-MP-982134",
        name: "박진우",
        age: 30,
        gender: "남",
        type: "지적장애인 (나목)",
        missingTime: "2026-05-26T18:30", // 12시간 전 실종
        missingLoc: "인천 구월동 빌라 골목",
        height: 172,
        weight: 68,
        build: "보통",
        faceShape: "둥근형",
        hairStyle: "스포츠형 숏컷",
        hairColor: "검은색",
        clothingUpper: "검은색 트레이닝 집업",
        clothingLower: "검은색 추리닝 바지",
        clothingShoes: "검은색 슬리퍼",
        clothingHat: "검은색 캡모자",
        otherFeatures: "중증 지적장애. 자기 이름을 크게 반복하는 습관이 있음. 다리를 약간 절뚝임."
      },
      {
        id: "2026-MP-445832",
        name: "최순임",
        age: 81,
        gender: "여",
        type: "치매환자 (다목)",
        missingTime: "2026-05-26T06:30", // 24시간 전 실종
        missingLoc: "경기 수원역 동측 광장 버스정류장",
        height: 154,
        weight: 48,
        build: "야윔",
        faceShape: "계란형",
        hairStyle: "흰색 뽀글파마 단발",
        hairColor: "흰색",
        clothingUpper: "자주색 카디건",
        clothingLower: "꽃무늬 몸배바지",
        clothingShoes: "자주색 고무신",
        clothingHat: "분홍색 스카프 목에 두름",
        otherFeatures: "중기 치매 환자. 집 주소를 기억하지 못하고 고향인 경북 안동을 가야 한다며 자꾸 버스를 타려고 함."
      }
    ];

    function SightingApp() {
      // --- STATE MANAGEMENT ---
      const [tipId, setTipId] = useState(`TIP-${Math.floor(100000 + Math.random() * 900000)}`);
      const [receiptTime, setReceiptTime] = useState(new Date().toISOString().slice(0, 16));

      // 제보자 정보
      const [tipsterName, setTipsterName] = useState("");
      const [isAnonymous, setIsAnonymous] = useState(false);
      const [tipsterContact, setTipsterContact] = useState("");

      // 목격 상세 정보
      const [sightingTime, setSightingTime] = useState(new Date().toISOString().slice(0, 16));
      const [sightingLoc, setSightingLoc] = useState(""); // 목격 장소
      const [sightingLocDetail, setSightingLocDetail] = useState(""); // 상세 목격 위치 정보 (예: 강남역 지하상가 지하 1층 커피숍 내부)

      // 목격 대상자 인상착의 및 특징
      const [sightGender, setSightGender] = useState("미상");
      const [sightAgeGroup, setSightAgeGroup] = useState("미상"); // 아동, 어린이, 청소년, 성인, 고령층
      const [sightHeight, setSightHeight] = useState("미상"); // 작음, 보통, 큼
      const [sightHair, setSightHair] = useState("");
      const [sightUpperColor, setSightUpperColor] = useState("");
      const [sightLowerColor, setSightLowerColor] = useState("");
      const [sightShoes, setSightShoes] = useState("");
      const [sightAcc, setSightAcc] = useState(""); // 소지품 (모자, 가방 등)
      
      const [sightBehavior, setSightBehavior] = useState([]); // 대상 행동 목록
      const [sightDetail, setSightDetail] = useState(""); // 상세 목격 내용 정황 기술
      const [photoUrl, setPhotoUrl] = useState("");
      const [isScanning, setIsScanning] = useState(false);

      // 과학적 분석 엔진 상태
      const [matchedCase, setMatchedCase] = useState(null);
      const [matchingScore, setMatchingScore] = useState(0);
      const [matchingDetails, setMatchingDetails] = useState([]);
      const [feasibilityScore, setFeasibilityScore] = useState(0);
      const [feasibilityMessage, setFeasibilityMessage] = useState("");
      const [credibilityScore, setCredibilityScore] = useState(0);
      const [credibilityGrade, setCredibilityGrade] = useState("대기중");

      // 실종경보(CBS) 발령 관련 상태 (법 제9조의3)
      const [alertType, setAlertType] = useState("실종경보"); // 실종경보 vs 유괴경보
      const [cbsConsent, setCbsConsent] = useState(false); // 전기통신사업자용 송출 동의 (법 제9조의3 제2항)
      const [boardConsent, setBoardConsent] = useState(false); // 협약기관 전광판용 송출 동의 (시행령 제4조의6 제8항)
      const [cbsMessage, setCbsMessage] = useState("");
      const [isCbsSent, setIsCbsSent] = useState(false);

      // 대안 수색 조치 의사결정 매트릭스
      const [selectedTactic, setSelectedTactic] = useState("");
      const [tacticJustification, setTacticJustification] = useState("");

      // 제보 처리 로그 이력 목록 (종결 이력 보관용)
      const [processedTips, setProcessedTips] = useState([]);

      // --- LOGIC: 제보 분석 및 실시간 매칭 엔진 ---
      useEffect(() => {
        if (!sightUpperColor && !sightLowerColor && !sightGender && !sightAgeGroup) {
          setMatchedCase(null);
          setMatchingScore(0);
          setMatchingDetails([]);
          return;
        }

        let bestMatch = null;
        let highestScore = 0;
        let bestDetails = [];

        ACTIVE_CASES.forEach((caseItem) => {
          let score = 0;
          let details = [];

          // 1. 성별 대조
          if (sightGender !== "미상") {
            if (sightGender === caseItem.gender) {
              score += 15;
              details.push("성별 일치 (+15%)");
            } else {
              score -= 10;
            }
          }

          // 2. 연령대 대조
          if (sightAgeGroup !== "미상") {
            const age = caseItem.age;
            let caseAgeGroup = "성인";
            if (age < 5) caseAgeGroup = "아동";
            else if (age < 13) caseAgeGroup = "어린이";
            else if (age < 19) caseAgeGroup = "청소년";
            else if (age >= 65) caseAgeGroup = "고령층";

            if (sightAgeGroup === caseAgeGroup) {
              score += 20;
              details.push("연령대 일치 (+20%)");
            } else {
              score -= 10;
            }
          }

          // 3. 의복 색상/특징 대조 (상의)
          if (sightUpperColor) {
            const cleanedUpperInput = sightUpperColor.replace(/\s+/g, '');
            const cleanedUpperCase = caseItem.clothingUpper.replace(/\s+/g, '');
            if (cleanedUpperCase.includes(cleanedUpperInput) || cleanedUpperInput.includes(cleanedUpperCase)) {
              score += 25;
              details.push(`상의 인상착의 일치 [${caseItem.clothingUpper}] (+25%)`);
            } else {
              // 부분 키워드 매칭 (예: 노란색)
              const colors = ["노란", "흰", "검은", "자주", "빨간", "핑크"];
              const matchedColor = colors.find(c => cleanedUpperInput.includes(c) && cleanedUpperCase.includes(c));
              if (matchedColor) {
                score += 15;
                details.push(`상의 색상 유사 [${matchedColor}색 계열] (+15%)`);
              }
            }
          }

          // 4. 의복 색상/특징 대조 (하의)
          if (sightLowerColor) {
            const cleanedLowerInput = sightLowerColor.replace(/\s+/g, '');
            const cleanedLowerCase = caseItem.clothingLower.replace(/\s+/g, '');
            if (cleanedLowerCase.includes(cleanedLowerInput) || cleanedLowerInput.includes(cleanedLowerCase)) {
              score += 20;
              details.push(`하의 인상착의 일치 [${caseItem.clothingLower}] (+20%)`);
            } else {
              const colors = ["청바지", "몸배", "추리닝", "트레이닝", "핑크"];
              const matchedColor = colors.find(c => cleanedLowerInput.includes(c) && cleanedLowerCase.includes(c));
              if (matchedColor) {
                score += 12;
                details.push(`하의 의복 형태 유사 [${matchedColor} 계열] (+12%)`);
              }
            }
          }

          // 5. 헤어 스타일/색상 대조
          if (sightHair) {
            if (caseItem.hairStyle.includes(sightHair) || caseItem.hairColor.includes(sightHair)) {
              score += 10;
              details.push("두발 형태/색상 일치 (+10%)");
            }
          }

          // 6. 기타 소지품/장신구 대조
          if (sightAcc) {
            if (caseItem.clothingHat.includes(sightAcc) || caseItem.otherFeatures.includes(sightAcc)) {
              score += 10;
              details.push("소지품/장신구 또는 특이점 매칭 (+10%)");
            }
          }

          // 최대점수 100점 보정
          score = Math.max(0, Math.min(100, score));

          if (score > highestScore) {
            highestScore = score;
            bestMatch = caseItem;
            bestDetails = details;
          }
        });

        setMatchedCase(bestMatch);
        setMatchingScore(highestScore);
        setMatchingDetails(bestDetails);

      }, [sightGender, sightAgeGroup, sightUpperColor, sightLowerColor, sightHair, sightAcc]);

      // --- LOGIC: 지리적 실현가능성 (Geographical Feasibility) 분석 ---
      useEffect(() => {
        if (!matchedCase || !sightingLoc) {
          setFeasibilityScore(0);
          setFeasibilityMessage("목격지와 매칭될 실종사건을 선택하거나 입력하십시오.");
          return;
        }

        // 목격 장소 텍스트 기반 모의 지리 연산
        // 실무에서는 대중교통 거점 조회, 지도 API 연동 좌표 거리 계산
        let distanceKm = 1.5; // 디폴트 거리
        
        // 목격지 텍스트 힌트 매핑으로 모의 거리 산출
        const locUpper = sightingLoc.toUpperCase();
        const caseLocUpper = matchedCase.missingLoc.toUpperCase();

        if (locUpper.includes("역삼") || locUpper.includes("강남") || locUpper.includes("선릉")) {
          if (caseLocUpper.includes("강남")) distanceKm = 1.2; // 매우 근접
          else if (caseLocUpper.includes("수원")) distanceKm = 35.0; // 중거리
          else if (caseLocUpper.includes("구월")) distanceKm = 40.0; 
          else distanceKm = 320.0; // 부산 해운대
        } else if (locUpper.includes("수원") || locUpper.includes("경기")) {
          if (caseLocUpper.includes("수원")) distanceKm = 2.5;
          else distanceKm = 35.0;
        } else if (locUpper.includes("인천") || locUpper.includes("구월")) {
          if (caseLocUpper.includes("구월")) distanceKm = 1.0;
          else distanceKm = 40.0;
        } else if (locUpper.includes("부산") || locUpper.includes("해운대") || locUpper.includes("광안리")) {
          if (caseLocUpper.includes("해운대")) distanceKm = 3.0;
          else distanceKm = 320.0;
        } else {
          // 기타 지명
          distanceKm = 15.0;
        }

        // 실종 발생 시각과 제보 목격 시각 차이 (시간 단위)
        const missingTimeObj = new Date(matchedCase.missingTime);
        const sightTimeObj = new Date(sightingTime);
        let timeDiffHours = (sightTimeObj - missingTimeObj) / (1000 * 60 * 60);

        if (timeDiffHours <= 0) {
          // 목격 시간이 실종 시간보다 이전인 논리적 오류
          setFeasibilityScore(0);
          setFeasibilityMessage("🚨 오류: 목격 일시가 실종 발생 일시보다 과거입니다. 시간 설정을 확인해 주십시오.");
          return;
        }

        // 필요 이동 속력 (km/h) = 거리 / 시간
        const requiredSpeed = distanceKm / timeDiffHours;
        
        let score = 90;
        let msg = "";

        // 실효 속력에 따른 현실성 검증
        // 도보 이동 한계는 4.5km/h, 치매 노인/어린이는 2.0km/h
        const maxWalkSpeed = (matchedCase.name === "최순임" || matchedCase.age < 8) ? 2.0 : 4.0;

        if (requiredSpeed <= maxWalkSpeed) {
          score = 95;
          msg = `✅ 지리적 실현가능성 최상 (요구 속력 시속 ${requiredSpeed.toFixed(1)}km). 실종 대상자가 도보로도 충분히 이동할 수 있는 반경(${distanceKm}km) 및 시간 내에 위치하고 있습니다.`;
        } else if (requiredSpeed <= 25.0) {
          // 지하철이나 버스 등 대중교통 이용 시 충분히 가능
          score = 80;
          msg = `ℹ️ 대중교통 이동 가능성 높음 (시속 ${requiredSpeed.toFixed(1)}km 필요, 이동거리 ${distanceKm}km). 버스, 지하철 등 대중교통 수단을 이용해 이동했을 확률이 있습니다.`;
        } else if (requiredSpeed <= 100.0) {
          // 차량/고속 이동 시 가능
          score = 50;
          msg = `⚠️ 차량 이동 필요 (시속 ${requiredSpeed.toFixed(1)}km 필요). 일반 도보 및 지하철망을 벗어난 고속 이동입니다. 차량(자차, 납치 차량 등)을 통한 이동일 수 있으므로 동행 차량 조사가 요구됩니다.`;
        } else {
          // 시속 100km 초과 - 물리적 불가능 (예: 1시간 만에 서울에서 부산)
          score = 5;
          msg = `❌ 지리적 불가능 제보 (시속 ${requiredSpeed.toFixed(1)}km 불가능). 물리적 시간의 한계를 크게 벗어납니다. 단순 오인 신고이거나 동명이인의 다른 대상 제보일 확률이 극도로 높습니다.`;
        }

        setFeasibilityScore(score);
        setFeasibilityMessage(msg);

      }, [matchedCase, sightingLoc, sightingTime]);

      // --- LOGIC: 제보 신뢰 등급(Credibility Score) 종합 산정 ---
      useEffect(() => {
        if (!matchedCase) {
          setCredibilityScore(0);
          setCredibilityGrade("분석 대기중");
          return;
        }

        // 신뢰 점수 = (매칭 점수 * 0.6) + (지리 실현가능성 점수 * 0.4)
        let total = (matchingScore * 0.6) + (feasibilityScore * 0.4);

        // 사진 증거물이 첨부된 경우 신뢰도 보너스 부여
        if (photoUrl) {
          total = Math.min(100, total + 15);
        }

        const finalScore = Math.round(total);
        setCredibilityScore(finalScore);

        if (finalScore >= 80) setCredibilityGrade("🚨 1순위 긴급 (즉각 수색대 파견 및 검문 검색)");
        else if (finalScore >= 60) setCredibilityGrade("⚠️ 2순위 유효 (주변 CCTV 확보 및 탐문 지시)");
        else if (finalScore >= 45) setCredibilityGrade("🔍 3순위 참고 (순찰 노선 내 모니터링 배치)");
        else setCredibilityGrade("❌ 4순위 불일치 (허위/오인 가능성 높음, 아카이브 보관)");

      }, [matchingScore, feasibilityScore, photoUrl]);

      // --- LOGIC: 실종경보(CBS) 문자 규격 자동 제안 (법 제9조의3 제2항 및 시행령 제4조의6 제7항 4대 공개정보 만족) ---
      useEffect(() => {
        if (!matchedCase) {
          setCbsMessage("사건 매칭이 완료되면 법정 4대 공개정보 원칙에 맞는 경보 문자 초안이 여기에 자동 구성됩니다.");
          return;
        }

        // 법정 4대 필수정보: 1.신상정보, 2.실종경위, 3.발령사실, 4.협조요청
        const sexWord = matchedCase.gender === "남" ? "남아" : "여아";
        const ageWord = `만 ${matchedCase.age}세`;
        const physicalInfo = `${matchedCase.height}cm, ${matchedCase.build}체격, ${matchedCase.hairStyle}`;
        const clothingInfo = `${sightUpperColor || matchedCase.clothingUpper}, ${sightLowerColor || matchedCase.clothingLower}`;

        const smsText = `[경찰청] 실종경보 발령. ${matchedCase.name}(${sexWord}, ${ageWord}, ${physicalInfo}, ${clothingInfo})를 목격하신 분은 182 또는 경찰청 실종센터로 긴급 제보 바랍니다.`;
        
        setCbsMessage(smsText);

          setSightDetail("지하철 강남역 개찰구 인근에서 뽀로로 모자를 쓴 어린아이가 노란 티셔츠 차림으로 두리번거리며 서럽게 울고 있는 것을 목격하여 즉시 112 제보함.");
          alert("🤖 AI 비전 이미지 분석 성공!\n제보 사진 속 인물의 인상착의(노란색 상의, 청바지, 모자 등)와 행동 특징이 입력란에 자동 적용되었습니다.");
        }, 2000);
      };

      // --- 실종경보(CBS) 송출 명령 집행 (법적 의무 동의 검증) ---
      const handleSendCbs = () => {

          alert("경보를 송출할 실종사건 매칭이 완료되지 않았습니다.");
          return;
        }

        // 법 제9조의3 제2항 및 시행령 제4조의6 제8항에 따른 엄격한 동의 절차 체크
        if (!cbsConsent) {

      };

        }
      };

      return (

                {matchedCase ? (
                  <div className="space-y-4">
                    {/* 매치 결과 헤더 */}
                    <div className="flex justify-between items-center bg-police-blue/30 border border-police-neon/50 p-3 rounded-lg">
                      <div>
                        <div className="text-[10px] text-slate-400">최대 일치 실종사건 식별</div>
                        <div className="text-sm font-black text-white flex items-center gap-1.5">
                          👤 {matchedCase.name} ({matchedCase.gender}, 만 {matchedCase.age}세) - {matchedCase.id}
                        </div>
                      </div>
                      <div className="text-right">
                        <div className="text-[10px] text-slate-400">인상착의 일치율</div>
                        <div className="text-2xl font-black text-police-accent font-mono animate-pulse">{matchingScore}%</div>
                      </div>
                    </div>

                    {/* 지리적 검증 (최초 실종지 vs 목격지 시간 대비 속력) */}
                    <div className="border border-slate-700/50 p-3 rounded bg-slate-900/60 text-xs">
                      <div className="flex justify-between items-center mb-1">
                        <span className="font-bold text-police-accent flex items-center gap-1">
                          <span>🧭</span> 이동 실현가능성 검증 (Time & Distance Grid)
                        </span>
                        <span className={`px-2 py-0.5 rounded text-[9px] font-bold ${feasibilityScore >= 70 ? 'bg-emerald-600 text-white' : feasibilityScore >= 40 ? 'bg-amber-500 text-slate-950' : 'bg-red-600 text-white animate-pulse'}`}>
                          실현도: {feasibilityScore >= 70 ? '최상' : feasibilityScore >= 40 ? '의심' : '불가능'}
                        </span>
                      </div>
                      <p className="text-[11px] text-slate-300 leading-relaxed font-sans">{feasibilityMessage}</p>
                    </div>

                    {/* 신뢰도 및 수사 등급 종합 산출 */}
                    <div className="border border-slate-700/50 p-3 rounded bg-slate-900/40 text-xs flex justify-between items-center gap-4">
                      <div>
                        <div className="text-[10px] text-slate-400">종합 제보 신뢰 점수</div>
                        <div className="text-base font-black text-white font-mono">{credibilityScore} / 100점</div>
                      </div>
                      <div className="text-right">
                        <div className="text-[10px] text-slate-400">수사 초동조치 우선순위</div>
                        <div className="text-xs font-black text-police-accent tracking-tighter">{credibilityGrade}</div>
                      </div>
                    </div>

                    {/* 일치 디테일 리스트 */}
                    <div className="text-[11px] bg-slate-900/80 p-2.5 rounded border border-slate-800 space-y-1">
                      <span className="text-slate-500 font-bold block mb-1">📊 일치 세부 정보</span>
                      {matchingDetails.map((det, index) => (
                        <div key={index} className="text-emerald-400 font-semibold flex items-center gap-1">
                          <span>✓</span> {det}
                        </div>
                      ))}
                    </div>

                  </div>
                ) : (
                  <div className="text-center py-10 text-xs text-slate-500">
                    <span>💡</span> 왼쪽 폼에 제보받은 인상착의 및 특징을 입력하시면,<br/>
                    활성 실종사건 데이터베이스(ACTIVE CASES)와의 과학적 대조 분석이 시작됩니다.
                  </div>
                )}
              </div>

              {/* 4. 실종경보 및 유괴경보 관리 (법 제9조의3) */}
              <div className="glass-panel rounded-xl p-5 border-t-4 border-amber-500">
                <h2 className="text-base font-bold text-amber-400 mb-3 flex items-center gap-2">
                  <span>📡</span> 4. 법정 실종경보·유괴경보 전송 통제 모듈
                </h2>

                <p className="text-xs text-slate-300 mb-3 leading-relaxed">
                  매치된 대상자의 위치를 찾기 위해 전기통신사업자(CBS 문자 등) 및 방송 전광판을 통해 공개수색(실종경보)을 발령하는 프로세스입니다.
                </p>

                {/* 경보 발령 요건 이원화 체크 (수험생 출제포인트 반영) */}
                <div className="grid grid-cols-2 gap-2 text-xs mb-3">
                  <button 
                    onClick={() => setAlertType("실종경보")}
                    className={`py-1.5 px-3 rounded font-bold border transition ${alertType === "실종경보" ? 'bg-police-neon text-police-900 border-police-neon font-black' : 'bg-slate-800 border-slate-700 text-slate-400'}`}
                  >
                    🔔 실종경보 (단순방황/가출이력無)
                  </button>
                  <button 
                    onClick={() => {
                      setAlertType("유괴경보");
                      alert("⚠️ 유괴경보는 유괴·납치의 명확한 증거 및 단서가 발견된 즉시 발령되어야 합니다! 강력 수사팀 합동 조치가 자동 동반됩니다.");
                    }}
                    className={`py-1.5 px-3 rounded font-bold border transition ${alertType === "유괴경보" ? 'bg-red-600 text-white border-red-500 font-black animate-pulse' : 'bg-slate-800 border-slate-700 text-slate-400'}`}
                  >
                    🚨 유괴경보 (Amber Alert / 범죄의심)
                  </button>
                </div>

                {/* 보호자 2단계 분리 동의 검증 모듈 */}
                <div className="bg-slate-900/60 p-3 border border-slate-800 rounded text-xs space-y-2 mb-4">
                  <span className="text-slate-400 font-bold block mb-1">⚖️ 법정 보호자 동의 증적 서류 관리</span>
                  
                  <label className="flex items-start gap-2 text-[11px] text-slate-300 cursor-pointer">
                    <input type="checkbox" className="mt-0.5" checked={cbsConsent} onChange={(e) => setCbsConsent(e.target.checked)} />
                    <div>
                      <strong>이동통신사 CBS 재난문자 등 송출 동의 획득 (법 제9조의3 제2항)</strong>
                      <p className="text-[10px] text-slate-500 mt-0.5">보호자로부터 전기통신매체 송출에 대한 서면/전자적 동의를 받았습니다.</p>
                    </div>
                  </label>

                  <label className="flex items-start gap-2 text-[11px] text-slate-300 cursor-pointer border-t border-slate-800 pt-2">
                    <input type="checkbox" className="mt-0.5" checked={boardConsent} onChange={(e) => setBoardConsent(e.target.checked)} />
                    <div>
                      <strong>주요 협약기관 전광판 및 방송 송출 동의 획득 (시행령 제4조의6 제8항)</strong>
                      <p className="text-[10px] text-slate-500 mt-0.5">전광판, 교통방송, 전철 모니터 게시를 위한 추가 보호자 동의를 별도 확보했습니다.</p>
                    </div>
                  </label>
                </div>

                {/* AI 법정 4대 공개정보 CBS 문자 구성 */}
                <div className="bg-slate-900 p-3 rounded border border-slate-700 text-xs text-slate-300">
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-police-accent font-bold flex items-center gap-1.5">
                      <span>🤖</span> AI 법정 4대 공개정보 CBS 문자 제안 (90자 표준)
                    </span>
                    <span className="text-[9px] text-slate-500">시행령 제4조의6제7항 준수</span>
                  </div>
                  <textarea 
                    className="w-full p-2 mt-1 rounded glass-input text-xs font-mono leading-normal h-16"
                    value={cbsMessage}
                    onChange={(e) => setCbsMessage(e.target.value)}
                  />
                  <div className="flex justify-between items-center mt-2 text-[9px] text-slate-500">
                    <span>* 공개항목: 신상, 경위, 발령사실, 협조안내 (초과 제한)</span>
                    <span className={`${cbsMessage.length > 90 ? 'text-red-500 font-bold' : 'text-slate-500'}`}>{cbsMessage.length}자</span>
                  </div>
                </div>

                {/* 송출 및 해제 액션 */}
                <div className="mt-4 flex gap-2">
                  {!isCbsSent ? (
                    <button 
                      onClick={handleSendCbs}
                      className="w-full py-2.5 bg-police-neon text-police-900 font-black rounded text-xs hover:bg-yellow-500 transition shadow-[0_0_15px_rgba(245,158,11,0.4)]"
                    >
                      🛰️ 실종경보(CBS) 문자 발령 전송 승인
                    </button>
                  ) : (
                    <button 
                      onClick={handleDeactivateAlert}
                      className="w-full py-2.5 bg-green-600 text-white font-black rounded text-xs hover:bg-green-700 transition animate-pulse"
                    >
                      🎉 실종자 무사 발견 완료 (경보 즉시 해제 및 공개정보 삭제)
                    </button>
                  )}
                </div>
              </div>

              {/* 5. 의사결정 수색/수사 기법 제안 매트릭스 */}
              <div className="glass-panel rounded-xl p-5 border-t-4 border-teal-500">
                <h2 className="text-base font-bold text-police-teal mb-3 flex items-center gap-2">
                  <span>⚖️</span> 5. 20년차 베테랑의 현장 수색·수사 대안 분석 매트릭스
                </h2>

                <div className="space-y-3 text-xs">
                  {/* 대안 1 */}
                  <div 
                    onClick={() => {
                      setSelectedTactic("Plan A: 목격지 최종 반경 112 긴급 순찰 배치 및 거점 검문");
                      setTacticJustification("목격 제보의 신뢰도가 80% 이상이며 지리적 Feasibility가 확실히 입증됨. 도보 이동 속도 내에 머물고 있을 확률이 극도로 높으므로 인근 파출소 및 순찰조를 즉시 긴급 목격 좌표로 집결시킴.");
                    }}
                    className={`p-2.5 rounded border cursor-pointer transition ${selectedTactic.startsWith("Plan A") ? 'bg-police-blue border-police-neon text-white' : 'bg-slate-800/40 border-slate-700/60 text-slate-300 hover:bg-slate-800'}`}
                  >
                    <div className="flex justify-between font-bold">
                      <span>대안 A: 목격지 긴급 순찰차 급파 (거점 수색)</span>
                      <span className="text-police-accent font-bold">추천도: 최고 (즉각 대응)</span>
                    </div>
                    <p className="text-[10px] text-slate-400 mt-1">장점: 5분 이내 현장 수색 개시 및 조기 발견 확률 극대화 / 단점: 경찰 가용 순찰력 소모.</p>
                  </div>

                  {/* 대안 2 */}
                  <div 
                    onClick={() => {
                      setSelectedTactic("Plan B: 지하철 및 대중교통망 CCTV 확보 공문 발송 및 역무원 협조요청");
                      setTacticJustification("목격지가 강남역 지하상가 인근이며, 이동 속력 분석 결과 지하철 이동 가능성이 식별됨. 역무실과의 핫라인을 개설하여 개찰구 CCTV 동선을 추적하는 대안.");
                    }}
                    className={`p-2.5 rounded border cursor-pointer transition ${selectedTactic.startsWith("Plan B") ? 'bg-police-blue border-police-neon text-white' : 'bg-slate-800/40 border-slate-700/60 text-slate-300 hover:bg-slate-800'}`}
                  >
                    <div className="flex justify-between font-bold">
                      <span>대안 B: 대중교통 거점 CCTV 확보 (이동 동선 차단)</span>
                      <span className="text-teal-400 font-bold">추천도: 우수 (지하철/버스 이탈 시)</span>
                    </div>
                    <p className="text-[10px] text-slate-400 mt-1">장점: 지하철 등 광역 이탈 경로 확인 및 이동 동선 차단 가능 / 단점: 영장 및 소장 승인에 따른 행정적 절차 시간 소요.</p>
                  </div>
                </div>

                {/* 최종 의사결정 결정서 */}
                {selectedTactic && (
                  <div className="mt-3 bg-slate-900/60 p-3 border border-slate-800 rounded text-xs">
                    <span className="text-police-accent font-bold block mb-1">✍️ 현장 지휘관 수색명령서</span>
                    <div className="font-bold text-white mb-1">{selectedTactic}</div>
                    <textarea 
                      className="w-full p-1.5 rounded glass-input text-xs" 
                      rows="2" 
                      value={tacticJustification} 
                      onChange={(e) => setTacticJustification(e.target.value)}
                      placeholder="대안 선택 사유를 기술하십시오"
                    />
                  </div>
                )}
              </div>

            </section>

          </main>

          {/* --- BOTTOM PROCESSED TIPS LOG --- */}
          <footer className="max-w-7xl mx-auto px-4 mt-6 w-full no-print">
            <div className="glass-panel rounded-xl p-5 border-l-4 border-green-500">
              <h3 className="font-bold text-green-400 flex items-center gap-1.5 text-sm mb-3">
                <span>📄</span> 제보 처리 및 발견 해결 완료대장 (실시간 기록 이력)
              </h3>
              
              <div className="overflow-x-auto">
                <table className="w-full text-[11px] text-slate-300 border-collapse text-left">
                  <thead>
                    <tr className="border-b border-slate-700 bg-slate-900/60 text-slate-400">
                      <th className="p-2">제보 번호</th>
                      <th className="p-2">연동사건 ID</th>
                      <th className="p-2">대상자 성명</th>
                      <th className="p-2">제보자 인적</th>
                      <th className="p-2">목격 위치 상세</th>
                      <th className="p-2">신뢰 등급</th>
                      <th className="p-2 text-green-400">조치 상태 및 결과</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800">
                    {processedTips.length > 0 ? (
                      processedTips.map((log) => (
                        <tr key={log.id} className="hover:bg-slate-800/20">
                          <td className="p-2 font-mono">{log.id}</td>
                          <td className="p-2 font-mono">{log.caseId}</td>
                          <td className="p-2 font-bold text-white">{log.targetName}</td>
                          <td className="p-2 text-slate-400">{log.tipster}</td>
                          <td className="p-2">{log.sightingLoc}</td>
                          <td className="p-2 text-[10px] text-amber-400">{log.credibility}</td>
                          <td className="p-2 font-bold text-green-400">{log.status}</td>
                        </tr>
                      ))
                    ) : (
                      <tr>
                        <td colSpan="7" className="p-8 text-center text-slate-500 text-xs">
                          현재 해결 처리 완료된 시민 제보 및 실종경보 해제 이력이 존재하지 않습니다.
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SightingApp />);
  </script>
</body>
</html>
