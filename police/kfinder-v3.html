  :root{ --gold:#FFB020; }
  html,body{ height:100%; }
  body{
    font-family:'IBM Plex Sans KR',sans-serif;
    background:#0A0F1A; color:#E6EDF7;
    background-image:
      linear-gradient(rgba(76,141,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(76,141,255,0.03) 1px, transparent 1px);
    background-size:44px 44px;
  }
  .font-mono2{ font-family:'IBM Plex Mono',monospace; }
  .font-disp{ font-family:'Black Han Sans','IBM Plex Sans KR',sans-serif; }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:#0A0F1A; }
  ::-webkit-scrollbar-thumb{ background:#2A3B5C; border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover{ background:#4C8DFF; }

  .panel{ background:#111A2B; border:1px solid #1E2C45; border-radius:12px; }
  .panel-h{ transition:border-color .2s, box-shadow .2s; }
  .panel-h:hover{ border-color:#2A3B5C; box-shadow:0 4px 24px rgba(0,0,0,.35); }

  .inp{ background:#0C1424; border:1px solid #1E2C45; color:#E6EDF7; border-radius:8px; transition:all .15s; }
  .inp:focus{ outline:none; border-color:#4C8DFF; box-shadow:0 0 0 3px rgba(76,141,255,.15); }
  .inp::placeholder{ color:#5B6B8C; }

  .btn{ border-radius:8px; font-weight:600; transition:all .15s; cursor:pointer; }
  .btn:active{ transform:translateY(1px); }
  .btn-blue{ background:#4C8DFF; color:#06101F; }
  .btn-blue:hover{ background:#7FB4FF; }
  .btn-ghost{ background:transparent; border:1px solid #2A3B5C; color:#8CA0BF; }
  .btn-ghost:hover{ border-color:#4C8DFF; color:#E6EDF7; }
  .btn-red{ background:rgba(255,77,109,.14); border:1px solid rgba(255,77,109,.4); color:#FF8FA5; }
  .btn-red:hover{ background:rgba(255,77,109,.25); }
  .btn-green{ background:rgba(45,212,167,.14); border:1px solid rgba(45,212,167,.4); color:#6FE7C6; }
  .btn-green:hover{ background:rgba(45,212,167,.25); }
  .btn-amber{ background:rgba(255,176,32,.14); border:1px solid rgba(255,176,32,.45); color:#FFC85C; }
  .btn-amber:hover{ background:rgba(255,176,32,.25); }

  .tag{ display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:600; }

  /* 골든타임 스트립 (시그니처) */
  .goldstrip{
    background:linear-gradient(90deg, rgba(255,176,32,.18), rgba(255,77,109,.14) 70%, rgba(255,77,109,.22));
    border:1px solid rgba(255,176,32,.35);
  }
  @keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
  .pulse-dot{ animation:pulseDot 1.4s ease-in-out infinite; }

  @keyframes beacon{
    0%{ box-shadow:0 0 0 0 rgba(255,77,109,.45);}
    70%{ box-shadow:0 0 0 12px rgba(255,77,109,0);}
    100%{ box-shadow:0 0 0 0 rgba(255,77,109,0);}
  }
  .beacon{ animation:beacon 2s infinite; }

  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .fade-up{ animation:fadeUp .35s ease both; }
  @media (prefers-reduced-motion: reduce){
    .fade-up,.beacon,.pulse-dot{ animation:none !important; }
  }

  .navbtn{ position:relative; }
  .navbtn.active{ background:rgba(76,141,255,.12); color:#E6EDF7; border-color:rgba(76,141,255,.5); }
  .navbtn.active::before{
    content:''; position:absolute; left:-1px; top:8px; bottom:8px; width:3px;
    background:#4C8DFF; border-radius:2px;
  }

  .lawref{ border-left:3px solid #4C8DFF; background:rgba(76,141,255,.07); }
  .mentor{ border-left:3px solid #FFB020; background:rgba(255,176,32,.07); }
  .privacy{ border-left:3px solid #2DD4A7; background:rgba(45,212,167,.07); }

  .gridcell{ transition:all .12s; cursor:pointer; }
  .gridcell:hover{ transform:scale(1.06); z-index:2; }

  table.datatable th{ font-size:10px; color:#5B6B8C; font-weight:600; text-transform:uppercase; letter-spacing:.06em; padding:8px 10px; border-bottom:1px solid #1E2C45; text-align:left; }
  table.datatable td{ font-size:11.5px; padding:9px 10px; border-bottom:1px solid #141F35; }
  table.datatable tr:hover td{ background:rgba(76,141,255,.05); }

  .stepdot{ width:26px; height:26px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; border:1.5px solid #2A3B5C; color:#5B6B8C; background:#0C1424; flex-shrink:0;}
  .stepdot.done{ border-color:#2DD4A7; color:#2DD4A7; }
  .stepdot.now{ border-color:#FFB020; color:#FFB020; box-shadow:0 0 0 4px rgba(255,176,32,.12); }

  .optbtn{ text-align:left; width:100%; border:1px solid #1E2C45; background:#0C1424; border-radius:10px; padding:12px 14px; font-size:12.5px; transition:all .15s; cursor:pointer; color:#C7D3E8;}
  .optbtn:hover{ border-color:#4C8DFF; background:rgba(76,141,255,.08); }
  .optbtn.correct{ border-color:#2DD4A7; background:rgba(45,212,167,.12); color:#9BF0D9; }
  .optbtn.wrong{ border-color:#FF4D6D; background:rgba(255,77,109,.12); color:#FFB3C2; }
  .optbtn:disabled{ cursor:default; }

  .bar-outer{ height:8px; background:#0C1424; border-radius:999px; overflow:hidden; border:1px solid #1E2C45; }
  .bar-inner{ height:100%; border-radius:999px; transition:width .6s ease; }

  @media print{
    body{ background:#fff; color:#000; }
    .no-print{ display:none !important; }
    .panel{ border:1px solid #999; background:#fff; }
  }

</style>

"목적 달성 시 지체 없이 파기하고, 프로파일링시스템 등록은 해제 절차를 진행","담당자 개인 PC에 백업","1년 보관 후 파기"],answer:1,law:"L9_4",why:"법 제9조 제4항(및 제9조의2 제3항 통지 내용): 제공받은 정보는 목적 외 이용이 금지되며 목적 달성 시 '지체 없이' 파기해야 한다. 발견 시 프로파일링시스템 등록 해제(규칙 제8조)도 병행한다. '나중에 쓸지 모르니 보관'이 가장 흔한 위법 관행이다."}]},{id:"S2",title:"시나리오 2 · 치매 어르신 실종(아동등 판단)",level:"중급",minutes:10,brief:"일요일 06:20, 74세 치매 진단 어르신이 새벽에 집을 나가 연락 두절. 배회 전력 2회, 지문 사전등록 완료, 휴대폰 미소지. 가족은 언론 공개를 원치 않는다고 함.",questions:[{cat:"legal",q:"74세 성인인 이 어르신에게 실종아동법을 적용할 수 있는가?",opts:["18세 이상 성인이므로 가출인으로만 처리한다","치매환자는 법 제2조의 '아동등'에 포함되므로 실종아동등으로 처리한다","보호자가 원할 때만 적용한다","장애인 등록이 있어야만 적용한다"],answer:1,law:"L2",why:"법 제2조의 '아동등'에는 ① 실종 당시 18세 미만 아동뿐 아니라 ② 지적·자폐성·정신장애인 ③ '치매환자'가 포함된다. 초임 담당자가 가장 자주 틀리는 판단으로, 가출인(18세 이상 단순 이탈)과 구별해야 한다."},{cat:"initial",q:"치매 배회 실종의 수색 전략으로 가장 적절한 것은?",opts:["원거리 도주 가능성이 커 시외버스터미널부터 수색","과거 거주지·직장, 하천·직진 경로 등 배회 특성을 반영해 근거리부터 동심원 수색","야간이 아니므로 주간 근무조 출근 후 수색 개시","SNS 공개 수배부터 실시"],answer:1,law:"R7",why:"치매 배회는 과거 기억 속 장소로 향하거나 장애물 없는 직진 경로(하천·철길·도로변)를 따르는 경향이 보고된다. 최종 목격지 중심 동심원·경로 수색이 표준이며, 수색은 접수 '즉시' 개시한다."},{cat:"initial",q:"지문 사전등록이 되어 있다. 이 정보의 실무적 활용은?",opts:["사전등록 정보는 예방용이라 실종 후에는 쓸 수 없다","발견·보호 시 신원확인과 신속한 가족 인계에 활용한다(제7조의2)","언론에 지문 이미지를 공개한다","등록 여부와 무관하게 DNA 채취가 우선이다"],answer:1,law:"L7_2",why:"제7조의2 지문등 사전등록 제도의 목적이 바로 '실종 시 신속한 신원확인·복귀'다. 무연고 보호자로 발견될 경우 대조를 통해 즉시 가족을 특정할 수 있다."},{cat:"victim",q:"가족이 '언론·문자 공개는 원치 않는다'고 한다. 실종경보 발령 판단은?",opts:["공익이 우선이므로 동의 없이 발령한다","실종경보 등 공개 수색은 '보호자 동의'가 요건이므로 동의 없이 발령할 수 없고, 비공개 수색 역량을 극대화한다","동의가 없으면 수색 자체를 중단한다","가족 몰래 발령하고 사후 통보한다"],answer:1,law:"L9c",why:"법 제9조의3(공개 수색·수사)과 시행령 제4조의5는 '보호자 동의'를 명시적 요건으로 한다. 동의가 없으면 공개는 불가하되, CCTV·탐문·드론·수색견 등 비공개 수단은 계속 가동한다. 피해자 가족의 자기결정권 존중이 원칙이다."},{cat:"privacy",q:"수색 중 어르신의 과거 병원 진료기록 전체를 받아보자는 의견이 나왔다. 판단은?",opts:["실종 사건이므로 모든 의료기록을 볼 수 있다","위치 확인과 무관한 민감정보(진료 내역 전체)는 요청 범위를 벗어나므로 최소수집 원칙에 따라 제한한다","가족 동의만 있으면 무제한 가능하다","병원이 주면 받아도 된다"],answer:1,law:"L9b",why:"제9조·제9조의2의 요청 범위는 '위치 확인에 필요한' 정보다. 개인정보 보호법상 최소수집 원칙과 결합하면, 발견 목적과 무관한 민감정보 일괄 수집은 허용되지 않는다. 필요 최소한(예: 당일 외래 방문 여부)으로 특정해 요청한다."},{cat:"privacy",q:"18시간 만에 어르신을 발견했다. 프로파일링시스템 등록 자료의 보존은?",opts:["즉시 전부 삭제만이 유일한 방법이다","발견된 치매환자 자료는 규칙상 수배 해제 후 10년 보관이 원칙이나, 사망 또는 보호자의 삭제 요구 시 즉시 삭제한다","영구 보존한다","담당자 판단으로 자유롭게 정한다"],answer:1,law:"R6",why:"업무처리 규칙상 발견된 지적·자폐성·정신장애인 및 치매환자 자료는 해제 후 10년 보관(재실종 대비), 18세 미만 아동·가출인은 5년이다. 다만 대상자 사망이나 보호자 삭제 요구 시 즉시 삭제한다 — 보존과 삭제권 모두를 아는 것이 개인정보 실무다."}]},{id:"S3",title:"시나리오 3 · 약취·유인 의심 실종(수사 전환)",level:"심화",minutes:12,brief:"평일 15:10, 11세 아동이 하교 중 실종. 목격자가 '검은 승합차에 아이가 급히 태워졌고 아이가 울고 있었다'고 진술. 아동은 키즈폰 소지. 보호자는 공개 수배에 동의함.",questions:[{cat:"legal",q:"목격 진술상 약취·유인 등 범죄 관련성이 인정된다. 초동 대응은?",opts:["48시간 기다린 후 수사 전환한다","단순 실종 절차로 수색만 계속한다","접수 당시부터 범죄로 인한 실종으로 인정되므로 '즉시 수사'를 개시한다","보호자 동의를 받은 후 수사한다"],answer:2,law:"R7",why:"유전자검사규칙 제7조 제1항 단서: 접수 당시 약취·유인 등 범죄로 인한 실종으로 인정되면 '즉시 수사'를 시작한다. '48시간 대기' 관행은 법령 어디에도 없는 잘못된 통념이다."},{cat:"legal",q:"아동이 키즈폰을 소지 중이다. 위치 추적의 법적 경로로 옳은 것은?",opts:["실종아동법 제9조 제2항으로 바로 요청한다 — 모든 실종에 적용되므로","제9조 제2항은 '범죄로 인한 경우를 제외'하므로, 범죄 의심 사건은 통신비밀보호법·형사소송법상 절차(긴급 포함)로 위치를 확보한다","범죄 사건은 위치추적이 불가능하다","보호자 동의만 있으면 아무 절차 없이 가능하다"],answer:1,law:"L9_2",why:"제9조 제2항 괄호는 '범죄로 인한 경우를 제외한다'고 명시한다. 즉 실종아동법상 위치정보 요청은 비(非)범죄 실종용 신속 경로이고, 약취·유인 의심 사건은 통비법상 통신사실확인자료 허가(긴급 시 긴급요청 후 사후허가) 등 형사절차로 진행한다. 두 트랙의 구별이 이 법의 핵심 설계다."},{cat:"victim",q:"보호자가 공개 수배에 동의했다. 발령할 경보와 근거는?",opts:["실종경보 — 모든 실종에 동일하게 발령","유괴경보 — 약취·유인 의심 사건에 대해 시행령 제4조의5에 따라 발령","재난문자 — 행안부 소관이므로","경보 제도는 폐지되었다"],answer:1,law:"D4_5",why:"시행령 제4조의5는 실종경보(상습 가출 전력 없는 아동의 실종신고)와 유괴경보(약취·유인 의심)를 구분한다. 본건은 유괴경보 대상이며, 보호자 동의 요건이 충족되었다."},{cat:"privacy",q:"경보 문자·언론 공개에 담을 정보의 범위는?",opts:["가족 주소·연락처까지 상세히 공개해 제보를 유도한다","발견·복귀에 필요한 '최소한'의 정보(인상착의·최종 목격지 등)만 공개한다","아동의 병력·성적 등 배경 정보도 공개한다","수사 상황을 실시간 전부 공개한다"],answer:1,law:"D4_5",why:"시행령 제4조의5 제5항 후단: 발견 및 복귀를 위해 필요한 '최소한의 정보'만 공개하도록 요청해야 한다. 과잉 공개는 아동·가족의 2차 피해와 수사 보안 누설로 이어진다."},{cat:"initial",q:"차량 이동 사건에서 제보 분석의 우선순위 배치로 가장 합리적인 것은?",opts:["접수 순서대로 처리한다","최종 목격 시각·지점과 시공간적으로 정합한 제보(도로망·이동속도상 도달 가능)를 최우선 검증한다","제보자가
