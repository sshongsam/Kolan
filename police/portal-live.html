    class PoliceSoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = false;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        this.enabled = true;
      }

      toggle(state) {
        this.enabled = state;
        if (state) this.init();
      }

      playBeep(freq, type, duration, volume = 0.1) {
        if (!this.enabled || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          
          osc.type = type; // sine, square, sawtooth, triangle
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          
          gain.gain.setValueAtTime(volume, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.warn("Audio Context beep error", e);
        }
      }

      playAlert() {
        this.playBeep(880, 'sine', 0.15, 0.15);
        setTimeout(() => this.playBeep(1200, 'sine', 0.25, 0.15), 100);
      }

      playScanner() {
        let now = this.ctx ? this.ctx.currentTime : 0;
        for (let i = 0; i < 4; i++) {
          setTimeout(() => {
            this.playBeep(600 + (i * 150), 'triangle', 0.08, 0.08);
          }, i * 80);
        }
      }

      playSuccess() {
        this.playBeep(523.25, 'sine', 0.1, 0.15); // C5
        setTimeout(() => this.playBeep(659.25, 'sine', 0.1, 0.15), 80); // E5
        setTimeout(() => this.playBeep(783.99, 'sine', 0.1, 0.15), 160); // G5
        setTimeout(() => this.playBeep(1046.50, 'sine', 0.3, 0.2), 240); // C6
      }

      playErasure() {
        if (!this.enabled || !this.ctx) return;
        try {
          const duration = 2.5;
          const osc = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + duration);

          osc2.type = 'square';
          osc2.frequency.setValueAtTime(150, this.ctx.currentTime);
          osc2.frequency.linearRampToValueAtTime(10, this.ctx.currentTime + duration);
          
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          
          osc.connect(gain);
          osc2.connect(gain);
          gain.connect(this.ctx.destination);
          
          osc.start();
          osc2.start();
          osc.stop(this.ctx.currentTime + duration);
          osc2.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.warn("Audio Context erasure sound error", e);
        }
      }
    }

        duration: 3,
        weather: 3,
        vulnerable: 3,
        history: 3

      // RRN Parsing for Age and Type auto-synchronization
      useEffect(() => {
        if (!rrn) return;
        const cleaned = rrn.replace(/[^0-9]/g, '');
        if (cleaned.length >= 6) {
          const part1 = cleaned.slice(0, 6);
          let birthYearStr = part1.slice(0, 2);
          let birthMonthStr = part1.slice(2, 4);
          let birthDayStr = part1.slice(4, 6);
          let birthYear = parseInt(birthYearStr, 10);
          
          if (cleaned.length > 6) {
            const digit = parseInt(cleaned.charAt(6), 10);
            if (digit === 1 || digit === 2 || digit === 5 || digit === 6) {
              birthYear += 1900;
            } else {
              birthYear += 2000;
            }
          } else {
            birthYear += 2000; // default for mock
          }
          
          const finalBirthStr = `${birthYear}-${birthMonthStr}-${birthDayStr}`;
          setBirthDate(finalBirthStr);
          
          const currentYear = new Date().getFullYear();
          const computedAge = currentYear - birthYear;
          setAge(computedAge);

          if (computedAge < 18) {
            setType("아동 (가목)");
          } else {
            setType("지적장애인 (나목)"); // default fallback
          }
        }
      }, [rrn]);

      // Dynamic calculation of risk level
      const totalRiskScore = useMemo(() => {
        const sum = Object.values(matrixScores).reduce((a, b) => a + b, 0);

        let lineY = 0;
        let direction = 1;

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          // Draw mock visual analyzer nodes
          ctx.strokeStyle = "rgba(0, 242, 254, 0.4)";
          ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

          // Mock face bounding box
          if (lineY > 60) {
            ctx.strokeStyle = "#ff007f";
            ctx.lineWidth = 2;
            ctx.strokeRect(80, 50, 100, 100);
            ctx.fillStyle = "#ff007f";
            ctx.font = "8px monospace";
            ctx.fillText("FACE_MATCH: 94%", 85, 45);
          }

          // Mock shirt bounding box
          if (lineY > 150) {
            ctx.strokeStyle = "#ffd000";
            ctx.lineWidth = 2;
            ctx.strokeRect(60, 160, 140, 100);
            ctx.fillStyle = "#ffd000";
            ctx.font = "8px monospace";
            ctx.fillText("UPPER_COLOR: YELLOW (98%)", 65, 155);
          }

          // Scanner sweeping laser line
          ctx.strokeStyle = "#00f2fe";
          ctx.shadowColor = "#00f2fe";
          ctx.shadowBlur = 10;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(10, lineY);
          ctx.lineTo(canvas.width - 10, lineY);
          ctx.stroke();
          ctx.shadowBlur = 0; // reset

          lineY += direction * 3;
          if (lineY > canvas.height - 20 || lineY < 20) {
            direction *= -1;
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animationFrameId);

    // =========================================================================
    // 3단계 모듈: 전술 격자 수색 및 SAR Math 예측 연산 (SearchModule)
    // =========================================================================
    function SearchModule({ activeCase, updateCase, soundOn }) {
      const [timerCount, setTimerCount] = useState(600); // 10 minutes Code Adam Timer
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const timerRef = useRef(null);

      // Search Resource deployment levels per cell
      // Selected Grid Sector on the 8x8 Grid Map
      const [selectedSector, setSelectedSector] = useState("D4");
      const [assignedResources, setAssignedResources] = useState({
        drone: 0,
        k9: 0,
        police: 0
      });

      // Code Adam Timer Logic
      useEffect(() => {
        if (isTimerRunning) {
          timerRef.current = setInterval(() => {
            setTimerCount(prev => {
              if (prev <= 1) {
                clearInterval(timerRef.current);
                setIsTimerRunning(false);
                if (soundOn) soundEngine.playAlert();
                alert("⏰ [코드아담 10분 수색 임계 시간 초과]\n다중이용시설법 및 경찰 수색 실무 지침 상, 관외 합동 수색 모드로 즉시 격상 전환합니다.");
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isTimerRunning]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      // SAR MATH 연산
      // PoS = PoA * PoD
      // PoA (Probability of Area) - Based on Risk Score and Weather
      const poa = useMemo(() => {
        if (!activeCase) return 0;
        let basePoa = 100 - (activeCase.riskScore * 0.4);
        return Math.max(20, Math.min(95, Math.round(basePoa)));
      }, [activeCase]);

      // PoD (Probability of Detection) - calculated from assigned search resources
      const pod = useMemo(() => {
        let score = (assignedResources.drone * 15) + (assignedResources.k9 * 25) + (assignedResources.police * 10);
        return Math.min(95, Math.max(5, score));
      }, [assignedResources]);

      const pos = useMemo(() => {
        return Math.round((poa * pod) / 100);
      }, [poa, pod]);

      // Sector Selection change
      const handleSelectSector = (sector) => {
        setSelectedSector(sector);
        if (soundOn) soundEngine.playBeep(500, 'sine', 0.05, 0.05);
      };

      const handleDeployResources = () => {
        if (!activeCase) return;
        
        // Add to activeCase searchGrids in real-time
        let updatedGrids = [...(activeCase.searchGrids || [])];
        if (!updatedGrids.includes(selectedSector)) {
          updatedGrids.push(selectedSector);
        }

        const updated = {
          ...activeCase,
          searchGrids: updatedGrids
        };

        updateCase(updated);
        if (soundOn) soundEngine.playSuccess();
        alert(`🗺️ [전술 수색 기동대 투입 배치]\n격자 영역 ${selectedSector}에 배치한 수색 수단(드론 ${assignedResources.drone}대, 탐지견 ${assignedResources.k9}두, 경찰력 ${assignedResources.police}명)을 기반으로 실시간 SAR 과학 성공지수(PoS: ${pos}%)가 연동 계산되었습니다.`);
      };

      // Printable A4 수색작전 계획서 모달
      const [showPrintPlan, setShowPrintPlan] = useState(false);

      return (
        <div className="space-y-4 animate-fadeIn">
          <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">
            
            {/* LEFT: GRID SECTOR SELECTION & SAR MATHEMATICAL ESTIMATES */}
            <div className="cyber-panel p-4 rounded-lg flex flex-col justify-between text-xs space-y-4">
              <div>
                <h3 className="text-xs font-bold text-cyber-green border-b border-cyber-green/20 pb-2">
                  🧭 격자 전술 수색 배치 & SAR Math 과학 연산 (3단계)
                </h3>
                <p className="text-[9px] text-slate-400 mt-1 leading-normal">
                  우측 GIS 지도 상의 임의의 격자(A1~H8)를 타겟팅한 후 수색 자원을 배치하십시오. 격자 내 도포율과 탐지 확률(PoD)을 조합해 종합 수색 성공율(PoS)을 수학적으로 판정합니다.
                </p>
              </div>

              {/* GRID SELECTOR HUD */}
              <div className="grid grid-cols-4 gap-2">
                <div>
                  <label className="block text-slate-500 mb-0.5 text-[9px]">선택 수색 격자</label>
                  <select 
                    value={selectedSector} 
                    onChange={e => handleSelectSector(e.target.value)} 
                    className="cyber-input p-1 rounded font-mono text-cyber-green font-bold w-full"
                  >
                    {Array.from({ length: 8 }).map((_, r) => {
                      const rowChar = String.fromCharCode(65 + r);
                      return Array.from({ length: 8 }).map((_, c) => {
                        const gridId = `${rowChar}${c + 1}`;
                        return <option key={gridId} value={gridId}>{gridId} 구역</option>;
                      });
                    })}
                  </select>
                </div>
                <div>
                  <label className="block text-slate-500 mb-0.5 text-[9px]">수색 드론대수</label>
                  <input 
                    type="number" min="0" max="5" 
                    className="cyber-input p-1 rounded font-mono w-full" 
                    value={assignedResources.drone} 
                    onChange={e => setAssignedResources(prev => ({ ...prev, drone: parseInt(e.target.value) || 0 }))} 
                  />
                </div>
                <div>
                  <label className="block text-slate-500 mb-0.5 text-[9px]">K9 탐지견두수</label>
                  <input 
                    type="number" min="0" max="5" 
                    className="cyber-input p-1 rounded font-mono w-full" 
                    value={assignedResources.k9} 
                    onChange={e => setAssignedResources(prev => ({ ...prev, k9: parseInt(e.target.value) || 0 }))} 
                  />
                </div>
                <div>
                  <label className="block text-slate-500 mb-0.5 text-[9px]">도보 경찰 기동인원</label>
                  <input 
                    type="number" min="0" max="100" 
                    className="cyber-input p-1 rounded font-mono w-full" 
                    value={assignedResources.police} 
                    onChange={e => setAssignedResources(prev => ({ ...prev, police: parseInt(e.target.value) || 0 }))} 
                  />
                </div>

        setSignData(prev => !prev);

      // DNA Electrophoresis separation simulation (Canvas animation)
      useEffect(() => {
        if (!isDnaMatching) return;
        const canvas = dnaCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let frameId;
        let bandOffset = 0;

        const drawGel = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          // Draw Gel Grid Base
          ctx.fillStyle = "#0c1020";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          // Draw DNA lane titles
          ctx.fillStyle = "rgba(0, 242, 254, 0.6)";
          ctx.font = "8px monospace";
          ctx.fillText("LANE 1: CHILD DNA", 10, 15);
          ctx.fillText("LANE 2: GUARDIAN DNA", 110, 15);

          // Moving bands animation logic
          ctx.shadowBlur = 8;
          
          // Child bands
          ctx.fillStyle = "#ff007f";
          ctx.shadowColor = "#ff007f";
          ctx.fillRect(15, 30 + (bandOffset % 150), 60, 4);
          ctx.fillRect(15, 70 + (bandOffset % 100), 60, 4);
          ctx.fillRect(15, 110 + (bandOffset % 80), 60, 4);

          // Guardian bands traveling to match
          ctx.fillStyle = "#00f2fe";
          ctx.shadowColor = "#00f2fe";
          ctx.fillRect(115, 30 + (bandOffset % 150), 60, 4);
          ctx.fillRect(115, 70 + (bandOffset % 100), 60, 4);
          ctx.fillRect(115, 110 + (bandOffset % 80), 60, 4);
          
          ctx.shadowBlur = 0; // reset

          bandOffset += 1.5;

          frameId = requestAnimationFrame(drawGel);
        };

        drawGel();
        return () => cancelAnimationFrame(frameId);
      }, [isDnaMatching]);

      // DNA Match execute simulation
      const handleRunDnaMatch = () => {
        if (!signData) {
          alert("❌ 법률 제11조 및 개인정보보호법에 의거하여, 보호자의 서명 채취 동의 없이는 국과수 유전자 사전 조회를 진행할 수 없습니다.");
          return;
        }

        setIsDnaMatching(true);
        if (soundOn) soundEngine.playScanner();

        setTimeout(() => {
          setIsDnaMatching(false);
          setDnaResultScore(99.99);

        }, 4000);
      };

      // 大망의 실종아동 발견에 따른 데이터 영구 파기 프로세스 (Wipeout Glitch)

        if (!activeCase) return;
        
        // Start Sound and Fullscreen Glitch Overlay
        if (soundOn) soundEngine.playErasure();
        
        const overlay = document.getElementById("wipeout-canvas-container");
        const canvas = document.getElementById("wipeout-canvas");
        overlay.classList.remove("hidden");

        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Matrix digital disintegrator effect
        const matrixChars = "01011001010101010101010101010101".split("");
        const fontSize = 10;
        const columns = canvas.width / fontSize;
        const drops = Array.from({ length: columns }).fill(1);

        let intervals = setInterval(() => {
          ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          ctx.fillStyle = "#ff007f"; // glitch red
          ctx.font = fontSize + "px monospace";
          
          for (let i = 0; i < drops.length; i++) {
            const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
              drops[i] = 0;
            }
            drops[i]++;
          }
        }, 30);

        // Expunge logic triggers after 3 seconds of dramatic glitch visualization
        setTimeout(() => {
          clearInterval(intervals);
          overlay.classList.add("hidden");

          // Save Audit Destruction Log

            }
            return c;
          });
          setCases(updatedCases);

          alert(`🎉 [영구 파쇄 및 상봉 대관제 완료]\n법률 제13조(유전자정보의 폐기 등)에 준거하여 국과수 유전자 기록 및 통신 위치 대장은 '지체 없이 영구 파기'되었으며, 공정 감사 증적대장으로 안전하게 이관 보존되었습니다.`);
        }, 3000);
      };

      return (
        <div className="space-y-4 animate-fadeIn">
          <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">
            
            {/* LEFT: DNA COMPROMISE VERIFICATION & ELECTROPHORESIS ANIMA */}
            <div className="cyber-panel p-4 rounded-lg flex flex-col justify-between text-xs space-y-4">
              <div>
                <h3 className="text-xs font-bold text-cyber-rose border-b border-cyber-rose/20 pb-2">

                </h3>
                <p className="text-[9px] text-slate-400 mt-1 leading-normal">

                </p>
              </div>

              {/* HAND SIGNATURE PAD */}
              <div className="bg-slate-950 p-2.5 rounded border border-slate-900 space-y-2 text-[10px]">
                <div className="flex justify-between items-center">
                  <strong className="text-cyber-rose">✍️ [별지 제2호 규격] 유전자 채취·조회 서명 동의</strong>
                  <span className="text-[8px] text-slate-600">ELECTRONIC COMPLIANCE PAD</span>
                </div>
                
                <div className="flex gap-2">
                  <input 
                    type="text" 
                    className="cyber-input p-1.5 rounded w-1/3"

                    onChange={e => setSignName(e.target.value)}

                  <button
                    type="button"
                    onClick={handleToggleSign}
                    className={`w-2/3 py-1 rounded font-bold transition-all text-[10px] ${
                      signData 
                        ? 'bg-cyber-green/20 border border-cyber-green text-cyber-green'

              <div className="flex justify-end gap-2">

              <div>
                <h3 className="text-xs font-bold text-cyber-rose border-b border-cyber-rose/20 pb-2 flex justify-between items-center">

                  <div className="w-16 h-16 rounded border border-cyber-rose/40 overflow-hidden bg-slate-900 shadow-[0_0_8px_rgba(255,0,127,0.2)]">
                    <img src={activeCase?.photoUrlAgedUp} className="w-full h-full object-cover" alt="미래" />

              </div>

              {/* LAW 13 secure ERASURE PROCESSOR BUTTON */}
              <div className="bg-red-950/20 border border-red-500/40 p-3 rounded-lg space-y-2">
                <div className="flex items-center gap-1.5">

                <div className="flex justify-between items-end border-b border-black pb-2 mb-6">
                  <span className="text-[9px] text-gray-500 font-bold">[별지 제2호 서식]</span>
                  <span className="text-[9px] text-gray-500 font-bold">실종아동등의 보호 및 지원에 관한 법률 시행규칙</span>
                </div>
                
                <div className="border-4 double border-black p-6 text-center my-6">
                  <h1 className="text-2xl font-extrabold tracking-widest font-serif">유전자 채취 및 대조 동의서</h1>
                </div>

                <table className="w-full border-collapse border border-black text-[11px] mb-6">
                  <tbody>
                    <tr>
                      <td className="border border-black bg-gray-100 p-2.5 font-bold text-center w-28">보호자 성명</td>
                      <td className="border border-black p-2.5">{signName || "김현우"}</td>
                      <td className="border border-black bg-gray-100 p-2.5 font-bold text-center w-28">관계</td>
                      <td className="border border-black p-2.5">부 (Father)</td>
                    </tr>
                    <tr>
                      <td className="border border-black bg-gray-100 p-2.5 font-bold text-center">연락처</td>
                      <td className="border border-black p-2.5" colSpan="3">{activeCase?.guardianContact}</td>
                    </tr>
                    <tr>
                      <td className="border border-black bg-gray-100 p-2.5 font-bold text-center">실종 대상자</td>
                      <td className="border border-black p-2.5" colSpan="3">
                        성명: {activeCase?.name} (주민번호: {activeCase?.rrn || "미등록"})
                      </td>
                    </tr>
                    <tr>
                      <td className="border border-black bg-gray-100 p-2.5 font-bold text-center">동의 및 준수 내용</td>
                      <td className="border border-black p-2.5" colSpan="3">
                        본인은 「실종아동등의 보호 및 지원에 관한 법률」 제11조 및 개인정보보호법 규정에 의거하여, 실종아동의 유전자 정보를 국립과학수사연구원 사전 등록 데이터베이스와 비교하는 것에 명확히 동의하며, 발견 종결 즉시 법률 제13조에 따라 해당 검체 기록을 영구 폐기 및 파기 대장에 기록할 것을 확약 요청합니다.
                      </td>
                    </tr>
                  </tbody>
                </table>

                {/* Simulated Digital Signature visualization */}
                <div className="flex justify-end items-center gap-4 my-8 p-4 border border-dashed border-gray-300">
                  <strong className="text-gray-700">보호자 서명 날인:</strong>
                  {signData ? (
                    <span className="font-serif text-lg italic text-blue-900 border-b border-blue-900 font-extrabold px-6">{signName || "김현우"} (서명필)</span>
                  ) : (
                    <span className="text-gray-400 italic">서명 미날인 상태</span>
                  )}
                </div>

                <div className="text-center my-12 font-bold leading-loose text-xs font-serif">
                  「실종아동등의 보호 및 지원에 관한 법률 시행규칙」 제6조제2항에 따라<br/>
                  위와 같이 개인 검체 정보 동의 및 조회를 적법하게 기명 신청합니다.
                </div>

                <div className="text-right my-8 font-bold text-sm font-serif">
                  {new Date().toLocaleDateString()}
                </div>

                <div className="flex justify-between items-center font-bold text-base my-8 font-serif">
                  <span>경찰청 국립과학수사연구원장 귀하</span>
                  <span className="text-sm">직인생략</span>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // =========================================================================
    // 6. CRYPTOGRAPHIC DATA DESTRUCTION LOGS (파기 증적 확인대장)
    // =========================================================================
    function DestructionLogView({ logs }) {
      return (
        <div className="cyber-panel p-4 rounded-lg text-xs space-y-4 animate-fadeIn">
          <div>
            <h3 className="text-xs font-bold text-cyber-rose border-b border-cyber-rose/20 pb-2">
              📜 [실종아동법 제13조] 개인정보 및 유전자 검체 영구 파기 감사 증적 대장
            </h3>
            <p className="text-[9px] text-slate-400 mt-1 leading-normal">
              본 대장은 실종아동법 시행규칙 및 개인정보보호법 규정에 의거하여 유전자 사전 정보, 스마트 동선 데이터가 적법한 파쇄 소멸(Wipeout) 과정을 거쳤음을 공정하게 보증하는 보안 감사 로그입니다.
            </p>
          </div>

          <div className="overflow-x-auto">
            <table className="w-full text-left text-[10px]">
              <thead>
                <tr className="border-b border-slate-800 text-slate-500 font-bold">
                  <th className="pb-2">증적 ID</th>
                  <th className="pb-2">파기 대상자</th>
                  <th className="pb-2">주민번호</th>
                  <th className="pb-2">수행관서/수사관</th>
                  <th className="pb-2">파기 시간</th>
                  <th className="pb-2">적용 법령 조항</th>
                  <th className="pb-2 text-right">소멸 상태</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-900 text-slate-300">
                {logs.length === 0 ? (
                  <tr>
                    <td colSpan="7" className="py-8 text-center text-slate-500">
                      📂 현재 영구 파기(소멸) 완료된 유전자 검체 및 정보 증적 대장이 비어 있습니다.<br/>
                      (5단계 탭에서 '상봉 및 영구 파기' 개시 시 실시간 기록됩니다)
                    </td>
                  </tr>
                ) : (
                  logs.map(log => (
                    <tr key={log.id} className="hover:bg-slate-950/80">
                      <td className="py-2.5 font-mono text-cyber-rose">{log.id}</td>
                      <td className="py-2.5 font-bold text-white">{log.targetName}</td>
                      <td className="py-2.5 font-mono">{log.targetRrn}</td>
                      <td className="py-2.5">{log.officer}</td>
                      <td className="py-2.5 font-mono">{log.timestamp.replace("T", " ").slice(0, 19)}</td>
                      <td className="py-2.5 text-cyber-cyan">{log.statute}</td>
                      <td className="py-2.5 text-right">
                        <span className="px-2 py-0.5 rounded-full bg-cyber-rose/10 border border-cyber-rose/40 text-cyber-rose text-[8px] font-bold">
                          💥 완전 영구 소멸 (Wiped)
                        </span>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Mount to Virtual DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
