  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- MOCK PRE-REGISTERED DATABASE (지문/안면 사전등록 DB - 법 제7조의2) ---
    const MOCK_PRE_REG_DB = [
      {

        height: 172,
        weight: 68,
        build: "보통",
        faceShape: "둥근형",
        hairStyle: "스포츠형",
        hairColor: "검은색",
        otherFeatures: "중증 지적장애로 의사소통이 어려우나 자기 이름을 반복해서 말함. 걸을 때 다리를 약간 절뚝임.",
        photoUrl: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=300"
      },
      {
        name: "최순임",
        rrn: "450708-2099887", // 치매환자 81세
        birthDate: "1945-07-08",
        gender: "여",
        guardianName: "최성호",
        guardianContact: "010-9999-8888",
        guardianAddress: "경기도 수원시 팔달구 매산로 99, 102동 1104호",
        height: 154,
        weight: 48,
        build: "야윔",
        faceShape: "계란형",
        hairStyle: "흰색 뽀글파마 단발",
        hairColor: "흰색",
        otherFeatures: "중기 치매 환자로 집 주소나 전화번호를 기억하지 못함. 자꾸 고향(경북 안동) 이야기를 많이 함.",
        photoUrl: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&q=80&w=300"
      }
    ];

    function App() {
      // --- APP STATE ---
      const [caseNo, setCaseNo] = useState(`2026-MP-${Math.floor(100000 + Math.random() * 900000)}`);
      const [receiptTime, setReceiptTime] = useState(new Date().toISOString().slice(0, 16));
      
      // 접수자 정보 (실무자)
      const [officerDept, setOfficerDept] = useState("서울강남경찰서 여성청소년과 실종수사팀");
      const [officerRank, setOfficerRank] = useState("경위");
      const [officerName, setOfficerName] = useState("홍성삼");
      const [officerContact, setOfficerContact] = useState("02-567-0112 (내선 340)");

      // 신고자 정보
      const [reporterName, setReporterName] = useState("");
      const [reporterRelation, setReporterRelation] = useState(""); // 부, 모, 조부모, 요양복지사 등
      const [reporterContact, setReporterContact] = useState("");
      const [reporterAddress, setReporterAddress] = useState("");

      // 실종대상자 정보
      const [targetName, setTargetName] = useState("");
      const [targetGender, setTargetGender] = useState("남");
      const [targetRrn, setTargetRrn] = useState(""); // 주민번호 앞뒤 7자리
      const [targetBirthDate, setTargetBirthDate] = useState("");
      const [targetPhone, setTargetPhone] = useState("");
      const [targetAddress, setTargetAddress] = useState("");
      const [targetType, setTargetType] = useState(""); // 아동, 지적장애인, 치매환자
      
      // 신체 및 외적 특징
      const [targetHeight, setTargetHeight] = useState("");
      const [targetWeight, setTargetWeight] = useState("");
      const [targetBuild, setTargetBuild] = useState("보통");
      const [targetFaceShape, setTargetFaceShape] = useState("둥근형");
      const [targetHairStyle, setTargetHairStyle] = useState("단발");
      const [targetHairColor, setTargetHairColor] = useState("검은색");
      const [clothingUpper, setClothingUpper] = useState("");
      const [clothingLower, setClothingLower] = useState("");
      const [clothingShoes, setClothingShoes] = useState("");
      const [clothingHat, setClothingHat] = useState("");
      const [otherPhysicalFeatures, setOtherPhysicalFeatures] = useState("");
      const [photoFile, setPhotoFile] = useState(null);
      const [photoUrl, setPhotoUrl] = useState("");

      // 실종 상황 정보
      const [missingTime, setMissingTime] = useState(new Date().toISOString().slice(0, 16));
      const [missingLoc, setMissingLoc] = useState("");
      const [missingDetail, setMissingDetail] = useState("");
      const [missingType, setMissingType] = useState("단순미귀가"); // 단순미귀가, 길을 잃음, 무단가출, 시설이탈, 범죄의심(약취유인)

      // 환경 변수 (위험도 계산용)
      const [weatherTemp, setWeatherTemp] = useState(24); // 온도 (섭씨)
      const [weatherRain, setWeatherRain] = useState("맑음"); // 맑음, 비, 눈, 태풍
      const [locHazard, setLocHazard] = useState("일반주택가"); // 일반주택가, 번화가, 산악지대, 하천/바다인근, 철길/대로인접
      const [elapsedTime, setElapsedTime] = useState(1); // 실종 경과 시간 (시간 단위)

      // 과학적 의사결정 및 대안 상태
      const [riskScore, setRiskScore] = useState(0);
      const [riskLevel, setRiskLevel] = useState("Code 3 (저위험)");
      const [searchRadius, setSearchRadius] = useState({ min: 0.1, max: 0.5 }); // km 단위
      const [selectedTactic, setSelectedTactic] = useState(""); // Plan A, B, C 등 선택된 대안
      const [tacticJustification, setTacticJustification] = useState("");
      const [isCriminalProcess, setIsCriminalProcess] = useState(false); // 범죄의심에 따른 형소법 분기 플래그

      // 사전등록 매칭 상태
      const [isScanning, setIsScanning] = useState(false);
      const [scanResult, setScanResult] = useState(null);
      const [showScanModal, setShowScanModal] = useState(false);

      // 종결 및 파기 상태
      const [caseStatus, setCaseStatus] = useState("접수진행"); // 접수진행, 수색중, 발견완료(종결)
      const [showDestructionLog, setShowDestructionLog] = useState(false);
      const [destructionLogs, setDestructionLogs] = useState([]); // 파기대장 데이터 목록

      // 인쇄/출력 모달 상태
      const [showPrintModal, setShowPrintModal] = useState(false);

      // --- EFFECTS & LOGIC ---

      // 주민등록번호 입력을 감지하여 만 나이 계산 및 아동등 유형 자동 판별 (법 제2조 제1호 적용)
      useEffect(() => {
        if (!targetRrn) return;
        
        // 13자리 형식 보정 (예: 1810153123456 -> 181015-3123456)
        let cleaned = targetRrn.replace(/[^0-9]/g, '');
        if (cleaned.length >= 6) {
          cleaned = cleaned.slice(0, 6) + (cleaned.length > 6 ? '-' + cleaned.slice(6, 13) : '');
        }
        
        if (cleaned.length === 14) {
          const rrnPart1 = cleaned.split('-')[0];
          const rrnPart2 = cleaned.split('-')[1];
          
          let year = parseInt(rrnPart1.slice(0, 2), 10);
          const month = parseInt(rrnPart1.slice(2, 4), 10);
          const day = parseInt(rrnPart1.slice(4, 6), 10);
          const genderDigit = parseInt(rrnPart2.charAt(0), 10);

          if (genderDigit === 1 || genderDigit === 2 || genderDigit === 5 || genderDigit === 6) {
            year += 1900;
          } else if (genderDigit === 3 || genderDigit === 4 || genderDigit === 7 || genderDigit === 8) {
            year += 2000;
          } else {
            year += 1800;
          }

          const birthStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          setTargetBirthDate(birthStr);
          
          // 만 나이 계산
          const today = new Date();
          const birthDateObj = new Date(year, month - 1, day);
          let age = today.getFullYear() - birthDateObj.getFullYear();
          const m = today.getMonth() - birthDateObj.getMonth();
          if (m < 0 || (m === 0 && today.getDate() < birthDateObj.getDate())) {
            age--;
          }

          // 법률에 따른 분류
          if (age < 18) {
            setTargetType("아동 (법 제2조 제1호 가목)");
          } else {
            // 성인의 경우 장애 여부나 치매 상태를 수동으로 지정하도록 함
            if (targetType.includes("아동")) {
              setTargetType("장애인 (법 제2조 제1호 나목) 또는 치매환자 (다목) 선택 필요");
            }
          }
        }
      }, [targetRrn]);

      // 과학적 위험성 평가 점수 계산 엔진 (Risk Scoring Engine)
      useEffect(() => {
        let score = 15; // 기본 베이스 점수
        
        // 1. 연령 변수 (8세 미만 극위험)
        if (targetBirthDate) {
          const age = calculateAge(targetBirthDate);
          if (age < 8) score += 30;
          else if (age < 13) score += 15;
          else if (age < 18) score += 5;
        } else if (targetType.includes("아동")) {
          score += 20;
        }

        // 2. 대상 취약성 변수
        if (targetType.includes("장애인")) score += 25;
        if (targetType.includes("치매")) score += 30;

        // 3. 실종 사유 및 범죄 연관성 분기 (법 제9조 제2항 대비)
        if (missingType === "범죄의심(약취유인)") {
          score += 35;
          setIsCriminalProcess(true);
        } else {
          setIsCriminalProcess(false);
          if (missingType === "길을 잃음") score += 15;
          if (missingType === "시설이탈") score += 10;
          if (missingType === "무단가출") score += 5;
        }

        // 4. 환경 요인 변수 (기상 및 지리 지형)
        if (weatherTemp < 0 || weatherTemp > 35) score += 15; // 혹한 또는 폭염
        else if (weatherTemp < 10 || weatherTemp > 30) score += 5;

        if (weatherRain === "비" || weatherRain === "눈") score += 10;
        if (weatherRain === "태풍") score += 20;

        if (locHazard === "산악지대" || locHazard === "하천/바다인근") score += 20;
        if (locHazard === "철길/대로인접") score += 15;

        // 5. 경과 시간 변수
        if (elapsedTime > 24) score += 20;
        else if (elapsedTime > 6) score += 10;
        else if (elapsedTime > 2) score += 5;

        // 최대 점수 100점 캡
        score = Math.min(100, score);
        setRiskScore(score);

        // 위험 등급 판정 및 초동조치 코드 매핑
        if (score >= 80) setRiskLevel("Code 0 (극위험 - 즉각적인 전방위 수색동원)");
        else if (score >= 60) setRiskLevel("Code 1 (고위험 - 형사/여청 여력 집중 투입)");
        else if (score >= 40) setRiskLevel("Code 2 (중위험 - 수색요청 및 경보 발령 검토)");
        else setRiskLevel("Code 3 (저위험 - 단순가출 의심, 지속 모니터링)");

        // 과학적 수색 반경 계산 (보도 이동 속력 및 경과 시간에 기초한 격자 모델)
        // 치매환자/어린이는 시속 1.5km ~ 2.5km, 일반 청소년은 시속 4km 가정
        let speed = 2.0; // km/h
        if (targetType.includes("치매") || (targetBirthDate && calculateAge(targetBirthDate) < 8)) {
          speed = 1.5;
        } else if (missingType === "무단가출") {
          speed = 4.5; // 대중교통 이용 가능성 높음
        }

        const maxDistance = speed * elapsedTime;
        const minDistance = Math.max(0.1, maxDistance * 0.2);
        
        setSearchRadius({
          min: parseFloat(minDistance.toFixed(2)),
          max: parseFloat(maxDistance.toFixed(2))
        });

      }, [targetBirthDate, targetType, missingType, weatherTemp, weatherRain, locHazard, elapsedTime]);

      // 나이 계산 헬퍼
      const calculateAge = (birthDateStr) => {
        if (!birthDateStr) return 0;
        const birth = new Date(birthDateStr);
        const today = new Date();
        let age = today.getFullYear() - birth.getFullYear();
        const m = today.getMonth() - birth.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
        return age;
      };

      // 사진 업로드 시뮬레이션 및 AI 안면 정보 추출 시뮬레이터 (WOW 효과)
      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setPhotoFile(file);
          const reader = new FileReader();
          reader.onload = (event) => {
            setPhotoUrl(event.target.result);
            simulateAiFaceParsing(event.target.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const simulateAiFaceParsing = (dataUrl) => {
        setIsScanning(true);
        setTimeout(() => {
          setIsScanning(false);
          // AI 분석 결과 시뮬레이션
          setTargetHeight("118");
          setTargetWeight("22");
          setTargetBuild("보통");
          setTargetFaceShape("계란형");
          setTargetHairStyle("단발생머리");
          setTargetHairColor("검은색");
          setOtherPhysicalFeatures("둥근 이마, 선한 눈망울, 왼쪽 뺨에 옅은 흉터 흔적 식별.");
          alert("🤖 AI 안면 특징 묘사 분석 완료!\n추출된 외모 신체 정보가 입력 폼에 자동으로 반영되었습니다.");
        }, 2000);
      };

      // 사전등록(지문/안면) 매칭 데이터베이스 검색 실행 (법 제7조의2)
      const handlePreRegLookup = () => {
        if (!targetName && !targetRrn) {
          alert("조회를 위해 대상자의 성명 또는 주민등록번호를 먼저 입력하십시오.");
          return;
        }

        setIsScanning(true);
        setShowScanModal(true);
        setScanResult(null);

        setTimeout(() => {
          // 이름이나 주민번호로 매칭 찾기
          const matched = MOCK_PRE_REG_DB.find(
            item => 
              (targetName && item.name.includes(targetName)) || 
              (targetRrn && item.rrn.replace('-', '').includes(targetRrn.replace('-', '')))
          );

          setIsScanning(false);
          if (matched) {
            setScanResult(matched);
          } else {

                <div className="border-t border-gray-400 pt-3 text-[9px] text-gray-500 leading-normal">
                  * 본 신고접수서 및 사본은 수색 및 수사 목적으로만 사용되며, 실종아동등의 복귀절차가 완료된 즉시 관련 법규에 의거 안전하게 파기됩니다.
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
