<body>

  <!-- React root mount point -->
  <div id="root"></div>

  <!-- Core App Code in Babel JSX -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- PRE-LOADED CASES FOR REFERENCE (1~2단계 연계용 사건 DB) ---
    const MOCK_CASES = [
      {
        id: "2026-MP-098234",
        name: "김민우",
        age: 7,
        gender: "남",
        type: "아동 (가목)",
        missingLoc: "서울 강남역 3번출구 놀이터",
        otherFeatures: "만 7세 아동. 활달하고 뽀로로를 극히 선호함."
      },
      {
        id: "2026-MP-154930",
        name: "이하은",
        age: 11,
        gender: "여",
        type: "아동 (가목)",
        missingLoc: "부산 해운대 해수욕장 입구 광장",
        otherFeatures: "만 11세 아동. 지리 미숙하며 왼손잡이임."
      },
      {
        id: "2026-MP-982134",
        name: "박진우",
        age: 30,
        gender: "남",
        type: "지적장애인 (나목)",
        missingLoc: "인천 구월동 빌라 골목",
        otherFeatures: "중증 지적장애. 자기 이름을 반복함. 다리 약간 절뚝임."
      },
      {
        id: "2026-MP-445832",
        name: "최순임",
        age: 81,
        gender: "여",
        type: "치매환자 (다목)",
        missingLoc: "경기 수원역 동측 광장 버스정류장",
        otherFeatures: "치매 고령층. 고향(안동)으로 가는 버스를 타려 함."
      }
    ];

    // --- MOCK DISTRICT MULTI-USE FACILITIES DATABASE (코드 아담 지도·감독용 DB - 법 제9조의4) ---
    const MOCK_FACILITIES = [
      { id: "FAC-001", name: "스타필드 코엑스몰", type: "대규모점포", manager: "이지훈", contact: "02-6002-1234", trainingStatus: "완료", lastTrainingDate: "2026-03-12", auditStatus: "이행", sizeSqm: 115000 },
      { id: "FAC-002", name: "롯데백화점 강남점", type: "대규모점포", manager: "최진혁", contact: "02-531-2500", trainingStatus: "미완료", lastTrainingDate: "2025-05-18", auditStatus: "이행", sizeSqm: 28000 },
      { id: "FAC-003", name: "메가박스 코엑스", type: "공연장/영화관", manager: "김서연", contact: "1544-0070", trainingStatus: "완료", lastTrainingDate: "2026-04-05", auditStatus: "이행", sizeSqm: 12000 },
      { id: "FAC-004", name: "테마파크 키자니아 서울", type: "테마파크 (개정법)", manager: "박성호", contact: "1544-5110", trainingStatus: "미완료", lastTrainingDate: "2025-02-10", auditStatus: "미이행", sizeSqm: 10500 },
      { id: "FAC-005", name: "서울메트로 강남역사", type: "도시철도 역사", manager: "한상우", contact: "02-6110-222", trainingStatus: "완료", lastTrainingDate: "2026-01-20", auditStatus: "이행", sizeSqm: 8500 }
    ];

    function SearchApp() {
      // --- APP STATE ---
      const [selectedCaseId, setSelectedCaseId] = useState(MOCK_CASES[0].id);
      const [selectedCase, setSelectedCase] = useState(MOCK_CASES[0]);
      const [terrainType, setTerrainType] = useState("임야/야산"); // 임야/야산, 하천/수변, 도심지, 복합쇼핑몰
      
      // 가용 수색 자원
      const [policeUnits, setPoliceUnits] = useState(30); // 기동대 (명)
      const [searchDogs, setSearchDogs] = useState(3); // 수색견 (두)
      const [thermalDrones, setThermalDrones] = useState(2); // 열화상 드론 (대)
      const [volunteers, setVolunteers] = useState(15); // 민간 방범대 (명)

      // 격자 데이터 (8x8 배열)
      const [gridData, setGridData] = useState([]);
      const [selectedCell, setSelectedCell] = useState(null); // { r, c }

      // 시뮬레이터 구동 상태
      const [isSimulating, setIsSimulating] = useState(false);
      const [simulationRadar, setSimulationRadar] = useState(false);
      const [simulationLogs, setSimulationLogs] = useState([]);
      
      // 코드 아담 (다중이용시설) 모듈 상태 (법 제9조의4)
      const [codeAdamActive, setCodeAdamActive] = useState(false);
      const [codeAdamTimer, setCodeAdamTimer] = useState(600); // 10분 (600초)
      const [codeAdamChecklist, setCodeAdamChecklist] = useState({
        step1: false, // 경보방송 송출
        step2: false, // 출입구 감시 배치
        step3: false, // CCTV 집중 모니터링
        step4: false, // 직원 합동 수색 개시
        step5: false, // 경찰 긴급 신고
        step6: false  // 발견 경보 해제
      });
      const [facilitiesList, setFacilitiesList] = useState(MOCK_FACILITIES);

      // 인쇄용 모달 상태
      const [showPrintModal, setShowPrintModal] = useState(false);

      const timerRef = useRef(null);

      // --- INITIALIZE GRID BASED ON TERRAIN AND CASE PROFILE ---
      useEffect(() => {
        const activeCase = MOCK_CASES.find(c => c.id === selectedCaseId);
        setSelectedCase(activeCase);
        generateGrid(terrainType, activeCase);
      }, [selectedCaseId, terrainType]);

      // 격자 생성 함수
      const generateGrid = (terrain, activeCase) => {
        const rows = 8;
        const cols = 8;
        let newGrid = [];

        for (let r = 0; r < rows; r++) {
          let row = [];
          for (let c = 0; c < cols; c++) {
            const coord = `${String.fromCharCode(65 + r)}${c + 1}`; // A1 ~ H8
            let cellTerrain = "평탄지";
            let basePoa = 1.0; // 기본 존재 확률 %

            // 지형에 따른 격자 구성
            if (terrain === "임야/야산") {
              if ((r === 1 && c === 2) || (r === 2 && c === 3) || (r === 0 && c === 3)) {
                cellTerrain = "⛰️ 밀집 산림";
                basePoa = activeCase.name === "최순임" ? 1.5 : 2.5; // 어린이가 산으로 올라가는 PoA 가중치
              } else if (r === 5 || r === 6) {
                cellTerrain = "🍂 급경사지/계곡";
                basePoa = activeCase.name === "최순임" ? 3.0 : 1.5; // 치매 노인이 계곡 아래로 내려앉는 경향
              } else if (r === 3 && c === 3) {
                cellTerrain = "📍 최후 목격지 (LKP)";
                basePoa = 8.0;
              } else {
                cellTerrain = "일반 야산";
                basePoa = 1.2;
              }
            } else if (terrain === "하천/수변공원") {
              // 물줄기 흐름 격자화
              if (c === 4 || (r === 3 && c === 3) || (r === 4 && c === 5)) {
                cellTerrain = "🌊 깊은 하천 채널";
                basePoa = (activeCase.name === "최순임" || activeCase.age < 8) ? 4.5 : 1.2; // 치매/유아는 하천변 존재 위험 극대화
              } else if (c === 5 || c === 3) {
                cellTerrain = "🌾 수변 습지/갈대밭";
                basePoa = 2.0;
              } else if (r === 1 && c === 1) {
                cellTerrain = "📍 최후 목격지 (LKP)";
                basePoa = 6.0;
              } else {
                cellTerrain = "잔디 수변광장";
                basePoa = 1.0;
              }
            } else if (terrain === "도심지") {
              if (r === 2 || c === 5) {
                cellTerrain = "🛣️ 8차선 대로변";
                basePoa = activeCase.age < 8 ? 0.8 : 2.5; // 지적장애/청소년의 대로변 이동 가중치
              } else if (r === 4 && c === 4) {
                cellTerrain = "📍 최후 목격지 (LKP)";
                basePoa = 7.0;
              } else if (r === 0 || r === 7) {
                cellTerrain = "🏬 상가 번화가";
                basePoa = activeCase.name === "김민우" ? 3.0 : 1.5; // 어린이는 장난감 가게/편의점 선호
              } else {
                cellTerrain = "일반 주택가";
                basePoa = 1.0;
              }
            } else if (terrain === "복합쇼핑몰") {
              // 코드 아담 관련 격자화
              if (r === 0 || r === 7 || c === 0 || c === 7) {
                cellTerrain = "🚪 외부 출출입구";
                basePoa = 2.0;
              } else if (r === 3 && c === 3) {
                cellTerrain = "📍 최초 소실 지점";
                basePoa = 10.0;
              } else if (r === 1 || r === 5) {
                cellTerrain = "🛍️ 쇼핑/매장 구역";
                basePoa = 2.5;
              } else {
                cellTerrain = "🏢 공용 로비/식당가";
                basePoa = 1.5;
              }
            }

            row.push({
              coord: coord,
              row: r,
              col: c,
              terrain: cellTerrain,
              poa: basePoa, // 존재 확률
              pod: 0,       // 발견 확률
              pos: 0,       // 수색 성공률 (PoS = PoA * PoD)
              resources: {
                police: 0,
                dogs: 0,
                drones: 0,
                volunteers: 0
              }
            });
          }
          newGrid.push(row);
        }

        // 전체 존재 확률 합산하여 100% 비율 정규화 (과학적 엄밀성)
        normalizePoa(newGrid);
        setGridData(newGrid);
      };

      // POA 정규화
      const normalizePoa = (grid) => {
        let total = 0;
        grid.forEach(row => row.forEach(cell => { total += cell.poa; }));
        grid.forEach(row => row.forEach(cell => {
          cell.poa = parseFloat(((cell.poa / total) * 100).toFixed(2));
        }));
      };

      // 격자별 자원 투입 및 실시간 과학적 PoD/PoS 연산
      const deployResource = (type, amount) => {
        if (!selectedCell) return;
        const { r, c } = selectedCell;

        // 자원 가용량 한계 검증
        if (type === "police" && amount > policeUnits) { alert("가용 경찰 기동대 인원을 초과했습니다."); return; }
        if (type === "dogs" && amount > searchDogs) { alert("가용 수색견 두수를 초과했습니다."); return; }
        if (type === "drones" && amount > thermalDrones) { alert("가용 열화상 드론 대수를 초과했습니다."); return; }
        if (type === "volunteers" && amount > volunteers) { alert("가용 민간 방범대 인원을 초과했습니다."); return; }

        const updatedGrid = [...gridData];
        const cell = updatedGrid[r][c];

        // 기존 배치 반환 후 재배치
        if (type === "police") { setPoliceUnits(prev => prev + cell.resources.police - amount); cell.resources.police = amount; }
        if (type === "dogs") { setSearchDogs(prev => prev + cell.resources.dogs - amount); cell.resources.dogs = amount; }
        if (type === "drones") { setThermalDrones(prev => prev + cell.resources.drones - amount); cell.resources.drones = amount; }
        if (type === "volunteers") { setVolunteers(prev => prev + cell.resources.volunteers - amount); cell.resources.volunteers = amount; }

        // --- 과학적 발견 확률(PoD) 수학 연산식 적용 (지형별 자원 효과 차별화) ---
        // 드론은 산림/계곡에 강점, 수색견은 우거진 갈대밭/수풀에 강점, 기동대는 건물/도심에 강점.
        let pod = 0;
        const pCount = cell.resources.police;
        const dCount = cell.resources.drones;
        const dogCount = cell.resources.dogs;
        const vCount = cell.resources.volunteers;

        if (cell.terrain.includes("산림") || cell.terrain.includes("경사지")) {
          // 산림지대: 드론(개당 40%) > 수색견(마리당 30%) > 경찰(10명당 15%) > 방범대(10명당 5%)
          pod = (dCount * 45) + (dogCount * 35) + (pCount * 1.8) + (vCount * 0.8);
        } else if (cell.terrain.includes("하천") || cell.terrain.includes("습지")) {
          // 하천/수변: 수색견(마리당 45%) > 드론(개당 30%) > 경찰(10명당 20%)
          pod = (dogCount * 50) + (dCount * 30) + (pCount * 2.2) + (vCount * 1.0);
        } else if (cell.terrain.includes("대로변") || cell.terrain.includes("상가") || cell.terrain.includes("출입구")) {
          // 도심/건물: 경찰(10명당 35%) > 방범대(10명당 25%) > 수색견(15%) > 드론(무력화 5%)
          pod = (pCount * 3.5) + (vCount * 2.5) + (dogCount * 15) + (dCount * 5);
        } else {
          // 일반지형
          pod = (pCount * 2.5) + (dogCount * 25) + (dCount * 25) + (vCount * 1.5);
        }

        cell.pod = Math.round(Math.min(95, pod)); // 최대 발견 확률 한계 95% 설정 (불확실성 고려)
        cell.pos = parseFloat(((cell.poa * cell.pod) / 100).toFixed(2)); // PoS = PoA * PoD

        setGridData(updatedGrid);
      };

      // 총합 PoS(수색 성공률) 계산
      const calculateTotalPos = () => {
        let total = 0;
        gridData.forEach(row => row.forEach(cell => { total += cell.pos; }));
        return parseFloat(total.toFixed(2));
      };

      // --- CODE ADAM TIMER & CHECKLIST (실종법 제9조의4 조기발견지침) ---
      useEffect(() => {
        if (codeAdamActive && codeAdamTimer > 0) {
          timerRef.current = setInterval(() => {
            setCodeAdamTimer(prev => {
              if (prev <= 1) {
                clearInterval(timerRef.current);
                triggerCodeAdamPoliceAlert(); // 10분 초과 자동 경찰 긴급 신고 전송
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timerRef.current);
      }, [codeAdamActive, codeAdamTimer]);

      const startCodeAdam = () => {
        setCodeAdamActive(true);
        setCodeAdamTimer(600);
        setCodeAdamChecklist(prev => ({ ...prev, step1: true, step2: true }));
        alert("🚨 [코드 아담 경보 전면 발령]\n1. 시설 전체 실종 경보 방송 송출 개시\n2. 출입문 통제 및 경비 인력 출입구 감시 배치 완료\n3. 10분 내 미발견 시 경찰로 강제 즉시 신고 타이머가 시작됩니다.");
      };

      const triggerCodeAdamPoliceAlert = () => {
        setCodeAdamChecklist(prev => ({ ...prev, step5: true }));
        alert("🚨 [코드 아담 - 10분 골든타임 경과]\n실종아동등의 보호 및 지원에 관한 법률 제9조의4 제2항 제4호에 의거, 다중이용시설 내부 수색 중 10분이 경과하여 관할 경찰서로 실종 사건 정보가 즉시 강제 신고 이송되었습니다.");
      };

      // 다중이용시설 교육·훈련(제3항) 및 조치(제2항) 불이행 과태료 부과 시뮬레이션
      const handleIssueFine = (facility) => {
        let fine = "";
        let clause = "";
        if (facility.auditStatus === "미이행") {
          fine = "500만원";
          clause = "법 제9조의4제2항 위반 (실종신고 접수 시 즉각 경보발령 및 수색, 출입구 감시조치 미이행)";
        } else {
          fine = "200만원";
          clause = "법 제9조의4제3항 위반 (연 1회 교육·훈련 미실시 또는 관할 경찰서 결과 보고 미이행)";
        }

                          <span>4. 전 직원 합동 수색대 구성</span>
                        </div>
                        <div className="flex items-center gap-1">
                          <input type="checkbox" checked={codeAdamChecklist.step5} readOnly />
                          <span className="text-red-400 font-bold">5. 10분 내 미발견 시 경찰 신고 (의무)</span>
                        </div>
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="text-center py-6 text-xs text-slate-500">
                    지형 환경을 <strong>[🛍️ 복합쇼핑몰]</strong>로 변경하시면 법 제9조의4에 따른 코드 아담 수색 통제 및 경보 발령 모듈이 활성화됩니다.
                  </div>
                )}
              </div>

            </section>

          </main>

          {/* --- LIVE SIMULATION LOG WINDOW --- */}
          {simulationLogs.length > 0 && (
            <footer className="max-w-7xl mx-auto px-4 mt-6 w-full no-print">
              <div className="glass-panel rounded-xl p-4 border-l-4 border-police-neon">
                <h3 className="font-bold text-police-accent flex items-center gap-1.5 text-xs mb-2">
                  <span>📡</span> 112 무선 지휘소 실시간 무전 무선 로그 (격자 수색 정밀 추적)
                </h3>
                <div className="bg-slate-950/80 p-3 border border-slate-800 rounded font-mono text-[10px] text-slate-300 space-y-1.5 max-h-[150px] overflow-y-auto">
                  {simulationLogs.map((log, index) => (
                    <div key={index} className="flex gap-2">
                      <span className="text-police-accent font-bold">[{log.time}]</span>
                      <span className={log.text.includes("발견") ? "text-emerald-400 font-bold animate-pulse" : ""}>{log.text}</span>
                    </div>
                  ))}
                </div>
              </div>
            </footer>
          )}

          {/* ========================================================
              다중이용시설 지도·감독 행정장부 패널 (법 제9조의4 제4항)
              ======================================================== */}
          <section className="max-w-7xl mx-auto px-4 mt-6 w-full no-print">
            <div className="glass-panel rounded-xl p-5 border-l-4 border-teal-500">
              <div className="flex justify-between items-center mb-3">
                <h3 className="font-bold text-teal-400 flex items-center gap-1.5 text-sm">
                  <span>📄</span> 관내 다중이용시설 지도·감독 대장 [실종아동법 제9조의4 제4항 및 제19조 근거]
                </h3>
                <span className="text-[10px] text-slate-400">경찰관서의 장 지도·감독 의무 관리대장</span>
              </div>

              <div className="overflow-x-auto text-[11px]">
                <table className="w-full text-slate-300 border-collapse text-left">
                  <thead>
                    <tr className="border-b border-slate-700 bg-slate-900/60 text-slate-400">
                      <th className="p-2">시설 코드</th>
                      <th className="p-2">시설 명칭</th>
                      <th className="p-2">시설 유형</th>
                      <th className="p-2">규모 (면적 ㎡)</th>
                      <th className="p-2">지침 조치 상태 (제2항)</th>
                      <th className="p-2">연 1회 교육·훈련 상태 (제3항)</th>
                      <th className="p-2">최종 훈련일</th>
                      <th className="p-2 text-right">지도·감독 행정처분</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800">
                    {facilitiesList.map((fac) => (
                      <tr key={fac.id} className="hover:bg-slate-800/20">
                        <td className="p-2 font-mono">{fac.id}</td>
                        <td className="p-2 font-bold text-white">{fac.name}</td>
                        <td className="p-2">{fac.type}</td>
                        <td className="p-2 font-mono">{fac.sizeSqm.toLocaleString()} ㎡</td>
                        <td className="p-2">
                          <span className={`px-2 py-0.5 rounded text-[10px] ${fac.auditStatus === "이행" ? 'bg-green-500/20 text-green-400 border border-green-500/40' : 'bg-red-500/20 text-red-400 border border-red-500/40 font-bold'}`}>
                            {fac.auditStatus}
                          </span>
                        </td>
                        <td className="p-2">
                          <span className={`px-2 py-0.5 rounded text-[10px] ${fac.trainingStatus === "완료" ? 'bg-green-500/20 text-green-400' : fac.trainingStatus === "과태료 처분" ? 'bg-red-500/20 text-red-400 border border-red-500/50' : 'bg-amber-500/20 text-amber-400'}`}>
                            {fac.trainingStatus}
                          </span>
                        </td>
                        <td className="p-2 font-mono text-slate-400">{fac.lastTrainingDate}</td>
                        <td className="p-2 text-right">
                          {(fac.auditStatus === "미이행" || fac.trainingStatus === "미완료") ? (
                            <button 
                              onClick={() => handleIssueFine(fac)}
                              className="px-2 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-[10px] font-bold"
                            >
                              과태료 처분 고지
                            </button>
                          ) : (
                            <span className="text-slate-500 text-[10px] font-semibold">감사 적합</span>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          {/* ========================================================
              MODAL: 현장 수색 작전 계획서 인쇄 레이아웃 (Batang font, HWP 완벽 구현)
              ======================================================== */}
          {showPrintModal && (
            <div className="fixed inset-0 bg-black/90 z-50 overflow-y-auto p-4 flex flex-col items-center justify-start no-print">
              <div className="w-full max-w-4xl bg-slate-900 border border-slate-700 rounded-xl p-4 mb-4 flex justify-between items-center">
                <span className="text-sm font-bold text-white flex items-center gap-1.5">
                  🖨️ 실종아동등 현장 수색 작전 계획서 인쇄 미리보기 (인쇄 최적화)
                </span>
                <div className="flex gap-2">
                  <button 
                    onClick={() => window.print()}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-bold"
                  >
                    지금 인쇄하기 (Print)
                  </button>
                  <button 
                    onClick={() => setShowPrintModal(false)}
                    className="px-4 py-2 bg-slate-800 text-slate-300 rounded text-xs hover:bg-slate-700"
                  >
                    미리보기 닫기
                  </button>
                </div>
              </div>

              {/* Printable Document Container (A4 clean sheet styled in HWP format) */}
              <div className="w-full max-w-[210mm] min-h-[297mm] bg-white text-black p-12 shadow-2xl rounded border border-slate-300 text-xs">
                
                {/* Official Rule Identifier */}
                <div className="flex justify-between items-end border-b border-black pb-2 mb-4">
                  <span className="text-[10px] text-gray-600">보존 기간: 영구 (수색 수사 지휘 기록철)</span>
                  <span className="text-[10px] text-gray-600">대한민국 경찰청 여청과 실종수사대</span>
                </div>

                {/* Main Form Title */}
                <div className="border-4 border-black p-4 text-center my-6">
                  <h1 className="text-2xl font-extrabold tracking-widest font-serif">실종아동등 현장 수색 작전 계획서</h1>
                </div>

                {/* Case Info Table */}
                <h3 className="font-bold text-sm mb-1.5 font-serif">1. 대상 사건 및 수색 환경 개요</h3>
                <table className="w-full border-collapse border-2 border-black mb-4 text-xs">
                  <tbody>
                    <tr>
                      <td className="border border-black bg-gray-100 p-2 font-bold w-24 text-center">사건 번호</td>
                      <td className="border border-black p-2 font-mono w-44">{selectedCase.id}</td>
                      <td className="border border-black bg-gray-100 p-2 font-bold w-24 text-center">대상자 성명</td>
                      <td className="border border-black p-2 font-bold">{selectedCase.name} ({selectedCase.gender}, 만 {selectedCase.age}세)</td>
                    </tr>
                    <tr>
                      <td className="border border-black bg-gray-100 p-2 font-bold text-center">대상자 유형</td>
                      <td className="border border-black p-2 w-44">{selectedCase.type}</td>
                      <td className="border border-black bg-gray-100 p-2 font-bold text-center">최초 실종지</td>
                      <td className="border border-black p-2">{selectedCase.missingLoc}</td>
                    </tr>
                    <tr>
                      <td className="border border-black bg-gray-100 p-2 font-bold text-center">수색 지형</td>
                      <td className="border border-black p-2" colSpan="3">
                        <strong>지형타입:</strong> {terrainType} / <strong>수색 구역 범위:</strong> 최후 목격지(LKP) 반경 8x8 전술 격자망
                      </td>
                    </tr>
                  </tbody>
                </table>

                {/* Deployed Resource Summary */}
                <h3 className="font-bold text-sm mb-1.5 font-serif">2. 초동 작전 자원 투입 현황</h3>
                <table className="w-full border-collapse border-2 border-black mb-4 text-xs">
                  <tbody>
                    <tr>
                      <td className="border border-black bg-gray-100 p-2 font-bold w-28 text-center">경찰 기동대 소대</td>
                      <td className="border border-black p-2 w-44">{30 - policeUnits}명 배치 (총 가용: 30명)</td>
                      <td className="border border-black bg-gray-100 p-2 font-bold w-28 text-center">119 구조 수색견</td>
                      <td className="border border-black p-2">{3 - searchDogs}두 배치 (총 가용: 3두)</td>
                    </tr>
                    <tr>
                      <td className="border border-black bg-gray-100 p-2 font-bold text-center">열화상 수색 드론</td>
                      <td className="border border-black p-2 w-44">{2 - thermalDrones}대 배치 (총 가용: 2대)</td>
                      <td className="border border-black bg-gray-100 p-2 font-bold text-center">민간 자율 방범대</td>
                      <td className="border border-black p-2">{15 - volunteers}명 배치 (총 가용: 15명)</td>
                    </tr>
                    <tr>
                      <td className="border border-black bg-gray-100 p-2 font-bold text-center">수색 종합 성공률</td>
                      <td className="border border-black p-2 font-bold text-emerald-600" colSpan="3">
                        누적 Area PoS: {calculateTotalPos()}% (수학적 SAR 구조 예측 모델 적용)
                      </td>
                    </tr>
                  </tbody>
                </table>

                {/* Grid layout representation for the printed page */}
                <h3 className="font-bold text-sm mb-1.5 font-serif">3. 격자별 과학적 자원 배치 도식</h3>
                <div className="border border-black p-4 mb-4 flex flex-col items-center">
                  <div className="grid grid-cols-8 gap-1 w-full max-w-[400px]">
                    {gridData.map((row, r) => 
                      row.map((cell, c) => {
                        const hasResource = cell.resources.police > 0 || cell.resources.drones > 0 || cell.resources.dogs > 0;
                        return (
                          <div 
                            key={`print-${r}-${c}`}
                            className={`border border-black text-center p-1 font-mono text-[9px] aspect-square flex flex-col justify-between ${hasResource ? 'bg-gray-200' : ''}`}
                          >
                            <span className="font-bold block">{cell.coord}</span>
                            <div className="flex justify-center gap-0.5 text-[8px]">
                              {cell.resources.police > 0 && <span>P</span>}
                              {cell.resources.drones > 0 && <span>R</span>}
                              {cell.resources.dogs > 0 && <span>D</span>}
                            </div>
                            <span className="text-[7px] block text-gray-600">{cell.pos}%</span>
                          </div>
                        );
                      })
                    )}
                  </div>
                  <div className="text-[9px] text-gray-500 mt-2">
                    * 범례: P(경찰), R(드론), D(수색견) / 격자별 기재 수치는 해당 격자 수색성공률(PoS)
                  </div>
                </div>

                {/* Commander Instructions */}
                <h3 className="font-bold text-sm mb-1.5 font-serif">4. 현장 현장 지휘관 통제 지시사항</h3>
                <div className="border-2 border-black p-4 leading-relaxed text-[11px] h-32 valign-top mb-6">
                  {selectedTactic ? (
                    <div>
                      <strong>선택 작전 전술:</strong> {selectedTactic}<br/><br/>
                      <strong>지휘관 수색 사유 및 지침:</strong> {tacticJustification}
                    </div>
                  ) : (
                    "지휘관의 격자별 수색 지침 내용 기술서가 작성되지 않았습니다. 현장 무전 지시로 대체 가능."
                  )}
                </div>

                {/* Sign block */}
                <div className="text-center my-10 font-bold leading-loose text-sm font-serif">
                  「실종아동등의 보호 및 지원에 관한 법률」 제9조제1항에 의거하여<br/>
                  실종아동등의 조속한 발견을 위해 위와 같이 초동 격자 수색 작전 계획을 수립 및 하달합니다.
                </div>

                <div className="text-right my-6 font-bold text-sm font-serif">
                  {new Date().getFullYear()}년 {String(new Date().getMonth() + 1).padStart(2, '0')}월 {String(new Date().getDate()).padStart(2, '0')}일
                </div>

                <div className="flex justify-between items-center font-bold text-base my-8 font-serif">
                  <span>수색 현장 지휘 통제관 (직인생략)</span>
                  <span className="text-lg">____________________ (인)</span>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SearchApp />);
  </script>
</body>
</html>
