          }
          return c;

        setTips(prev => [newTip, ...prev]);

    // 2단계 모듈: 실종아동 제보 분석 모듈 (TipModule)

    function TipModule({ cases, tips, onAddTip, onAddDestructionLog, onUpdateCaseStatus }) {
      const [tipId] = useState(`TIP-${Math.floor(100000 + Math.random() * 900000)}`);
      const [sightingLoc, setSightingLoc] = useState("");
      const [sightingLocDetail, setSightingLocDetail] = useState("");
      
      const [sightGender, setSightGender] = useState("미상");
      const [sightAgeGroup, setSightAgeGroup] = useState("미상");
      const [sightUpperColor, setSightUpperColor] = useState("");
      const [sightLowerColor, setSightLowerColor] = useState("");
      const [sightAcc, setSightAcc] = useState("");
      const [sightDetail, setSightDetail] = useState("");

      const [matchedCase, setMatchedCase] = useState(null);
      const [matchScore, setMatchScore] = useState(0);
      const [feasibilityScore, setFeasibilityScore] = useState(0);
      const [credibilityScore, setCredibilityScore] = useState(0);

      // 법 제9조의3 동의 및 CBS 긴급발령
      const [cbsConsent, setCbsConsent] = useState(false);
      const [boardConsent, setBoardConsent] = useState(false);
      const [cbsMessage, setCbsMessage] = useState("");
      const [isCbsSent, setIsCbsSent] = useState(false);

      // AI 비전 분석 자동 묘사 추출 시뮬레이션
      const handleTriggerVisionMock = () => {
        setSightGender("남");
        setSightAgeGroup("어린이");
        setSightUpperColor("노란색 티셔츠");
        setSightLowerColor("청바지");
        setSightAcc("뽀로로 모자");
        setSightDetail("강남역 개찰구 인근에서 뽀로로 노란 모자를 쓴 꼬마가 벤치에 혼자 울고 있는 모습을 확인하여 제보함.");
        alert("🤖 [AI 비전 특징 추출 완료]\n제보 사진 속 의복(노란색 티, 청바지, 뽀로로모자) 특징이 자동으로 연동 분석 기입되었습니다.");
      };

      // 매칭 및 지리 분석 계산기
      useEffect(() => {
        if (!sightUpperColor && !sightLowerColor) return;
        
        let best = null;
        let highest = 0;

        cases.forEach(c => {
          let score = 0;
          if (sightGender !== "미상" && c.gender === sightGender) score += 20;
          
          const age = c.age;
          let ageGroup = "성인";
          if (age < 5) ageGroup = "아동";
          else if (age < 13) ageGroup = "어린이";
          else if (age < 19) ageGroup = "청소년";
          else if (age >= 65) ageGroup = "고령층";

          if (sightAgeGroup !== "미상" && ageGroup === sightAgeGroup) score += 20;
          if (sightUpperColor && c.clothingUpper.includes(sightUpperColor.replace("색", ""))) score += 30;
          if (sightLowerColor && c.clothingLower.includes(sightLowerColor)) score += 20;
          if (sightAcc && c.clothingHat.includes(sightAcc)) score += 10;

          if (score > highest) {
            highest = score;
            best = c;
          }
        });

        setMatchedCase(best);
        setMatchScore(highest);

        // 지리적 실현가능성 (도심 내 이동)
        if (best) {
          let distScore = 95;
          if (sightingLoc.includes("부산") && best.missingLoc.includes("서울")) {
            distScore = 5; // 불가능
          } else if (sightingLoc.includes("수원") && best.missingLoc.includes("서울")) {
            distScore = 55; // 지하철 타고 의심
          }
          setFeasibilityScore(distScore);
          
          // 종합 신뢰도 점수
          const cred = Math.round(highest * 0.6 + distScore * 0.4);
          setCredibilityScore(cred);

          // CBS 문자 자동 생성
          const msg = `[경찰청] 실종경보. ${best.name}(남, 만 7세, 118cm, 노란색티, 청바지)를 5.27 06시경 역삼역 인근에서 목격한 분은 182로 제보 바랍니다.`;
          setCbsMessage(msg);
        }

      }, [sightGender, sightAgeGroup, sightUpperColor, sightLowerColor, sightAcc, sightingLoc, cases]);

      const handleSendCbs = () => {
        if (!cbsConsent) {

        onAddTip({

        alert("📡 [실종경보 긴급 전송 승인]\n이동통신 3사를 통한 CBS 실종경보 긴급재난문자가 타깃 지역에 긴급 팩스 송출되었습니다.");

          {/* Right panel: Sighting analysis & CBS Alerts */}

            {/* 과학적 사건 매칭 피드백 */}

              <h3 className="font-bold text-police-accent mb-3 flex items-center gap-1.5">🔬 3. 과학적 제보 매칭 및 지리 검증</h3>
              {matchedCase ? (

    // =========================================================================
    // 3단계 모듈: 실종아동 수색방법 제안 모듈 (SearchModule)
    // =========================================================================
    function SearchModule({ cases, onUpdateCaseStatus }) {
      const [selectedCaseId, setSelectedCaseId] = useState(cases[0]?.id || "");
      const [terrainType, setTerrainType] = useState("임야/야산");
      
      const [policeUnits, setPoliceUnits] = useState(30);
      const [searchDogs, setSearchDogs] = useState(3);
      const [thermalDrones, setThermalDrones] = useState(2);
      const [volunteers, setVolunteers] = useState(15);

      const [gridData, setGridData] = useState([]);
      const [selectedCell, setSelectedCell] = useState(null);

      const [isSimulating, setIsSimulating] = useState(false);
      const [radarActive, setRadarActive] = useState(false);
      const [logs, setLogs] = useState([]);

      // 코드아담 타이머
      const [codeAdamActive, setCodeAdamActive] = useState(false);
      const [codeAdamTimer, setCodeAdamTimer] = useState(600);
      const timerRef = useRef(null);

      useEffect(() => {
        if (!selectedCaseId) return;
        generateGrid();
      }, [selectedCaseId, terrainType]);

      // 격자 초기화
      const generateGrid = () => {
        const activeCase = cases.find(c => c.id === selectedCaseId);
        if (!activeCase) return;

        let newGrid = [];
        for (let r = 0; r < 8; r++) {
          let row = [];
          for (let c = 0; c < 8; c++) {
            const coord = `${String.fromCharCode(65 + r)}${c + 1}`;
            let cellTerrain = "평탄지";
            let basePoa = 1.0;

            if (terrainType === "임야/야산") {
              if (r === 2 && c === 3) { cellTerrain = "⛰️ 밀집 산림"; basePoa = 3.0; }
              else if (r === 5) { cellTerrain = "🍂 급경사지/계곡"; basePoa = 4.0; }
              else if (r === 3 && c === 3) { cellTerrain = "📍 최후 목격지 (LKP)"; basePoa = 10.0; }
            } else if (terrainType === "하천/수변공원") {
              if (c === 4) { cellTerrain = "🌊 깊은 하천 채널"; basePoa = 5.0; }
              else if (r === 1 && c === 1) { cellTerrain = "📍 최후 목격지 (LKP)"; basePoa = 8.0; }
            } else if (terrainType === "복합쇼핑몰") {
              if (r === 0 || c === 0) { cellTerrain = "🚪 외부 출입구"; basePoa = 2.0; }
              else if (r === 3 && c === 3) { cellTerrain = "📍 최초 소실 지점"; basePoa = 12.0; }
            }

            row.push({
              coord, row: r, col: c, terrain: cellTerrain, poa: basePoa, pod: 0, pos: 0,
              resources: { police: 0, dogs: 0, drones: 0, volunteers: 0 }
            });
          }
          newGrid.push(row);
        }
        // 정규화
        let total = 0;
        newGrid.forEach(row => row.forEach(cell => { total += cell.poa; }));
        newGrid.forEach(row => row.forEach(cell => {
          cell.poa = parseFloat(((cell.poa / total) * 100).toFixed(1));
        }));

        setGridData(newGrid);
      };

      // 자원 배치
      const deployResource = (type, amount) => {
        if (!selectedCell) return;
        const { r, c } = selectedCell;

        const updated = [...gridData];
        const cell = updated[r][c];

        if (type === "police") { setPoliceUnits(prev => prev + cell.resources.police - amount); cell.resources.police = amount; }
        if (type === "dogs") { setSearchDogs(prev => prev + cell.resources.dogs - amount); cell.resources.dogs = amount; }
        if (type === "drones") { setThermalDrones(prev => prev + cell.resources.drones - amount); cell.resources.drones = amount; }
        if (type === "volunteers") { setVolunteers(prev => prev + cell.resources.volunteers - amount); cell.resources.volunteers = amount; }

        // PoD 연산
        let pod = 0;
        if (cell.terrain.includes("산림") || cell.terrain.includes("경사지")) {
          pod = (cell.resources.drones * 45) + (cell.resources.dogs * 35) + (cell.resources.police * 1.8);
        } else if (cell.terrain.includes("하천") || cell.terrain.includes("채널")) {
          pod = (cell.resources.dogs * 50) + (cell.resources.drones * 30) + (cell.resources.police * 2.2);
        } else {
          pod = (cell.resources.police * 3.5) + (cell.resources.volunteers * 2.5);
        }

        cell.pod = Math.round(Math.min(95, pod));
        cell.pos = parseFloat(((cell.poa * cell.pod) / 100).toFixed(1));
        setGridData(updated);
      };

      const calculateTotalPos = () => {
        let total = 0;
        gridData.forEach(row => row.forEach(cell => { total += cell.pos; }));
        return parseFloat(total.toFixed(1));
      };

      // 코드 아담 타이머
      useEffect(() => {
        if (codeAdamActive && codeAdamTimer > 0) {
          timerRef.current = setInterval(() => {
            setCodeAdamTimer(prev => {
              if (prev <= 1) {
                clearInterval(timerRef.current);
                alert("🚨 [코드 아담 - 10분 골든타임 경과] 지침에 의거하여 경찰 즉시 자동 긴급 이송 신고 완료.");
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timerRef.current);
      }, [codeAdamActive, codeAdamTimer]);

      const startCodeAdam = () => {
        setCodeAdamActive(true);
        setCodeAdamTimer(600);
        alert("🚨 [다중이용시설 코드 아담 발령] 전 경비인력 출입구 통제 감시 배치 및 실시간 방송 송출 개시.");
      };

      // 수색 시뮬레이션 개시
      const runSearchSim = () => {
        setIsSimulating(true);
        setRadarActive(true);
        setLogs([]);

        const mockLogs = [
          { time: "00:00", text: "📡 통합상황실 기동수색대 무전 개통 완료." },
          { time: "00:30", text: "🛸 정찰용 드론 2호기 계곡 밀집 지형 정밀 적외선 스캔 개시." },
          { time: "01:15", text: "🐶 [속보] 인명 수색견 갈대밭 수변 C4 격자에서 격렬한 추적 신호 감지!" },
          { time: "02:00", text: "🎉 [무전] C4 격자 수풀 하단에서 실종대상자 안전 구조 완료! 본부 복귀 처리." }
        ];

        let i = 0;
        const interval = setInterval(() => {
          if (i < mockLogs.length) {
            setLogs(prev => [...prev, mockLogs[i]]);
            i++;
          } else {
            clearInterval(interval);
            setIsSimulating(false);
            setRadarActive(false);
            onUpdateCaseStatus(selectedCaseId, "발견완료");
            alert("🎉 [수색 대성공]\n격자 지형 지형과의 완벽한 자원 매칭을 통해 대상을 조기에 발견하였습니다.");
          }
        }, 1500);
      };

      return (
        <div className="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6 w-full text-xs">
          
          {/* Left panel: Context */}
          <div className="lg:col-span-3 space-y-4">
            <div className="glass-panel rounded-xl p-4 border-l-4 border-police-neon">
              <h3 className="font-bold text-police-accent mb-2">👤 수색 사건 연동</h3>
              <select className="w-full p-1.5 rounded glass-input text-xs" value={selectedCaseId} onChange={(e) => setSelectedCaseId(e.target.value)}>
                {cases.map(c => <option key={c.id} value={c.id}>{c.name} (만 {c.age}세)</option>)}
              </select>
            </div>

            <div className="glass-panel rounded-xl p-4 border-l-4 border-amber-500">
              <h3 className="font-bold text-amber-400 mb-2">🌦️ 수색 지형</h3>
              <select className="w-full p-1.5 rounded glass-input text-xs" value={terrainType} onChange={(e) => setTerrainType(e.target.value)}>
                <option value="임야/야산">⛰️ 임야 / 야산</option>
                <option value="하천/수변공원">🌊 하천 / 수변공원</option>
                <option value="복합쇼핑몰">🛍️ 복합쇼핑몰 (코드 아담)</option>
              </select>
            </div>

            <div className="glass-panel rounded-xl p-4 border-l-4 border-teal-500">
              <h3 className="font-bold text-teal-400 mb-2">🚒 수색 잔여 자원</h3>
              <div className="space-y-1 font-mono text-[11px] text-slate-300">
                <div className="flex justify-between"><span>👮 기동대 인원</span><strong>{policeUnits}명</strong></div>
                <div className="flex justify-between"><span>🐶 구조 수색견</span><strong>{searchDogs}두</strong></div>
                <div className="flex justify-between"><span>🛸 열화상 드론</span><strong>{thermalDrones}대</strong></div>
                <div className="flex justify-between"><span>👥 민간 방범대</span><strong>{volunteers}명</strong></div>
              </div>
            </div>
          </div>

          {/* Middle: Map grid */}
          <div className="lg:col-span-6 flex flex-col gap-4">
            <div className="glass-panel rounded-xl p-4 relative flex-grow flex flex-col">
              <div className="flex justify-between items-center mb-3">
                <h3 className="font-bold text-police-accent">🗺️ 전술 격자 수색 지도 (8x8 Grid Map)</h3>

              </div>

              <div className="relative border border-slate-700/60 rounded-lg p-2 bg-slate-950 flex-grow flex items-center justify-center min-h-[350px]">
                {radarActive && <div className="radar-beam"></div>}
                
                <div className="grid grid-cols-8 gap-1 w-full max-w-[450px]">

                    row.map((cell, c) => {

                      if (cell.terrain.includes("산림")) bg = "bg-emerald-950/60 border-emerald-800";
                      else if (cell.terrain.includes("하천")) bg = "bg-sky-950/70 border-sky-800";
                      else if (cell.terrain.includes("목격지") || cell.terrain.includes("소실")) bg = "bg-red-950 border-red-500";

                      return (
                        <div 
                          key={`${r}-${c}`}
                          onClick={() => setSelectedCell({ r, c })}
                          className={`aspect-square border rounded p-0.5 flex flex-col justify-between text-[8px] cursor-pointer hover:border-police-neon ${bg} ${selectedCell?.r === r && selectedCell?.c === c ? 'ring-2 ring-police-accent border-police-accent' : ''}`}
                        >
                          <div className="flex justify-between font-mono">
                            <span>{cell.coord}</span>
                            <span className="text-slate-400">{cell.poa}%</span>
                          </div>
                          <div className="flex justify-center gap-0.5 text-[8px]">
                            {cell.resources.police > 0 && <span>👮</span>}
                            {cell.resources.drones > 0 && <span>🛸</span>}
                            {cell.resources.dogs > 0 && <span>🐶</span>}
                          </div>
                          <span className="text-right text-[7px] text-emerald-400">{cell.pod > 0 ? `S:${cell.pos}%` : ""}</span>

                      );

              </div>

              {/* Resource deployment selection */}
              {selectedCell && (
                <div className="mt-3 p-3 bg-slate-900 border border-slate-800 rounded-lg text-xs">
                  {(() => {
                    const cell = gridData[selectedCell.r][selectedCell.c];
                    return (
                      <div>
                        <div className="font-bold text-police-accent mb-2">📍 격자구역: {cell.coord} ({cell.terrain})</div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                          <div>
                            <label className="block text-slate-400">경찰 (명)</label>
                            <input type="number" className="w-full p-1 rounded glass-input text-xs" value={cell.resources.police} onChange={(e) => deployResource("police", parseInt(e.target.value) || 0)} />
                          </div>
                          <div>
                            <label className="block text-teal-400">수색견 (두)</label>
                            <input type="number" className="w-full p-1 rounded glass-input text-xs" value={cell.resources.dogs} onChange={(e) => deployResource("dogs", parseInt(e.target.value) || 0)} />
                          </div>
                          <div>
                            <label className="block text-indigo-400">드론 (대)</label>
                            <input type="number" className="w-full p-1 rounded glass-input text-xs" value={cell.resources.drones} onChange={(e) => deployResource("drones", parseInt(e.target.value) || 0)} />
                          </div>
                          <div>
                            <label className="block text-amber-400">방범대 (명)</label>
                            <input type="number" className="w-full p-1 rounded glass-input text-xs" value={cell.resources.volunteers} onChange={(e) => deployResource("volunteers", parseInt(e.target.value) || 0)} />
                          </div>

          <div className="lg:col-span-3 space-y-4">
            <div className="glass-panel rounded-xl p-4 border-t-4 border-police-neon">
              <h3 className="font-bold text-police-accent mb-2">🚀 전술 시뮬레이션 개시</h3>

                onClick={runSearchSim}
                disabled={isSimulating || calculateTotalPos() < 15}

              <div className="mt-3 bg-slate-900 p-2 rounded max-h-[100px] overflow-y-auto font-mono text-[9px] text-slate-400 space-y-1">

                  <div key={index}>[{log.time}] {log.text}</div>
                ))}
              </div>
            </div>

            {/* Code Adam */}
            <div className="glass-panel rounded-xl p-4 border-t-4 border-amber-500">
              <h3 className="font-bold text-amber-400 mb-2">🛍️ 코드 아담 통제실 (법 제9조의4)</h3>
              {terrainType === "복합쇼핑몰" ? (
                <div className="space-y-2">
                  <div className="flex justify-between font-mono text-red-500 font-bold">
                    <span>경찰 자동신고 제한시간</span>

    // =========================================================================
    // 4단계 모듈: 실종아동 수사방법 제안 모듈 (InvestModule)
    // =========================================================================
    function InvestModule({ cases, destructionLogs, onAddDestructionLog, onUpdateCaseStatus }) {
      const [selectedCaseId, setSelectedCaseId] = useState(cases[0]?.id || "");
      const [selectedCase, setSelectedCase] = useState(cases[0]);
      
      const [requestType, setRequestType] = useState("신용카드");
      const [targetAgency, setTargetAgency] = useState("");
      const [requestedDetails, setRequestedDetails] = useState("");

      const [smsText, setSmsText] = useState("");
      const [activeStep, setActiveStep] = useState(0);
      const [logs, setLogs] = useState([]);

      const isCaseClosed = selectedCase?.status === "발견완료";

      useEffect(() => {
        const item = cases.find(c => c.id === selectedCaseId);
        setSelectedCase(item);
      }, [selectedCaseId, cases]);

      useEffect(() => {
        if (!requestType) return;
        let agency = "BC카드 대표이사";
        let detail = "실종자 명의 신용/체크카드 사용일시 및 장소 (※ 결제 금액 및 품목 제외 - 제9조의2 한계 락)";
        if (requestType === "CCTV") {
          agency = "서울교통공사 사장";
          detail = "LKP 인근 강남역 2번 출구 출입구 고정형 CCTV 영상자료";
        } else if (requestType === "교통카드") {
          agency = "티머니 대표이사";
          detail = "교통카드 지하철 승하차 시각 및 역명 사용명세 이력";
        }
        setTargetAgency(agency);
        setRequestedDetails(detail);

        if(selectedCase) {
          const sms = `[경찰서 스마트수사대] 귀하가 신고하신 실종대상자 ${selectedCase.name} 관련, 실종법 제9조의2제3항에 따라 관계기관(${agency.split(" ")[0]})으로부터 수사 생활정보를 수집하였습니다. 본 정보는 아동 발견 즉시 파기될 예정입니다.`;
          setSmsText(sms);
        }
      }, [requestType, selectedCase]);

      // 수사 추적 단계별 진행 시뮬레이션 (SVG 지도용)
      const handleTriggerStep = () => {
        const next = activeStep + 1;
        if (next > 4) return;
        setActiveStep(next);

        let newLog = {};
        if (next === 1) {
          newLog = { step: 1, time: "10:15", title: "교통카드 역 승하차 역 포착", desc: "신분당선 강남역 승차 -> 7호선 강남구청역 하차 기록 식별 완료 (법 제9조의2제1항제2호)." };
        } else if (next === 2) {
          newLog = { step: 2, time: "11:00", title: "신용카드 결제처 포착", desc: "비씨카드 결제 위치: 강남구청역 지하상가 편의점 결제 감지 (금액 미기재 - 법정 락)." };
        } else if (next === 3) {
          newLog = { step: 3, time: "11:30", title: "지하철역 CCTV 판독 완료", desc: "GS25 인근 2번 보도 CCTV 판독: 노란색 옷차림 대상자가 개찰구 밖 쉼터 방향으로 나가는 모습 식별 (법 제9조의2제1항제1호)." };
        } else if (next === 4) {
          newLog = { step: 4, time: "12:15", title: "스마트 수사망 발견 보호 완료", desc: "강남구청역 쉼터 로비 입구 대기실에서 대기중인 실종아동 발견 및 보호 인계." };
        }

        setLogs(prev => [...prev, newLog]);
      };

      const handleCloseCase = () => {
        const confirmClose = confirm("🚨 대상자를 발견 종결하여 임시 확보한 모든 수사 생활정보 데이터를 영구 파기하시겠습니까?");
        if (confirmClose) {
          onUpdateCaseStatus(selectedCaseId, "발견완료");
          setActiveStep(0);
          setLogs([]);

          onAddDestructionLog({
            id: `DEL-${Math.floor(1000 + Math.random() * 9000)}`,
            caseId: selectedCase.id,
            targetName: selectedCase.name,
            destroyedData: "CCTV 임시 수집본, LBS 기지국 통신사실 기록, 신용카드 결제위치 일체",
            destroyedTime: new Date().toLocaleString(),
            reason: "실종아동법 제9조의2제2항 (실종자 발견 해결에 따른 즉시 파기)",
            method: "복원 불가능한 덮어쓰기 파기 및 파쇄 소각",
            status: "영구 폐기(완료)"
          });

          alert("🔒 [법령 준수 처리 완료]\n수집된 모든 민감 정보가 영구 파기 소멸되었으며, 파기대장에 정식 증적 등재되었습니다.");
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6 w-full text-xs">
          
          {/* Left: Input requests */}
          <div className="lg:col-span-4 space-y-4">
            <div className="glass-panel rounded-xl p-4 border-l-4 border-police-neon">
              <h3 className="font-bold text-police-accent mb-2">👤 수사 사건 매핑</h3>
              <select className="w-full p-1.5 rounded glass-input text-xs" value={selectedCaseId} onChange={(e) => setSelectedCaseId(e.target.value)}>
                {cases.map(c => <option key={c.id} value={c.id}>{c.name} ({c.id})</option>)}
              </select>
            </div>

            <div className="glass-panel rounded-xl p-4 border-l-4 border-amber-500">
              <h3 className="font-bold text-amber-400 mb-2">📄 법 제9조의2 정보제공요청서 기안</h3>
              <div className="space-y-3">
                <select className="w-full p-1.5 rounded glass-input text-xs font-bold" value={requestType} onChange={(e) => setRequestType(e.target.value)}>
                  <option value="신용카드">💳 신용/체크카드 사용일시/장소</option>
                  <option value="CCTV">📹 CCTV 영상자료 제공요청</option>
                  <option value="교통카드">🚇 교통카드 승하차 사용명세</option>
                </select>

                <div className="p-2 bg-red-950/40 border border-red-500/40 rounded text-[10px] text-red-300">
                  {requestType === "신용카드" && "🔒 신용카드 사용일시와 사용장소만 요청 가능 (금액 및 품목 요청 차단 락 가동)"}
                  {requestType === "CCTV" && "LBS 좌표 및 전방위 CCTV를 통해 획득한 영상 정보 제공 청구"}
                </div>

                <input type="text" className="w-full p-1.5 rounded glass-input text-xs" value={targetAgency} readOnly />
                <textarea className="w-full p-1.5 rounded glass-input text-[10px]" rows="2" value={requestedDetails} readOnly />
              </div>
            </div>
          </div>

          {/* Middle: SVG route map */}
          <div className="lg:col-span-4 flex flex-col gap-4">
            <div className="glass-panel rounded-xl p-4 flex-grow flex flex-col">
              <h3 className="font-bold text-police-accent mb-3">📡 실시간 스마트 수사 추적 경로망 (전술 지도)</h3>
              
              <div className="border border-slate-700/60 rounded-lg p-2 bg-slate-950 flex-grow flex items-center justify-center min-h-[250px]">
                <svg className="w-full h-full max-h-[300px]" viewBox="0 0 350 300">
                  {/* LKP (강남역 놀이터) */}
                  <circle cx="60" cy="220" r="14" fill="#1e293b" stroke="#ef4444" strokeWidth="2" />
                  <text x="60" y="223" fontSize="9" fill="#ffffff" textAnchor="middle">LKP</text>

                  {/* Subway Node */}
                  {activeStep >= 1 && (
                    <g>
                      <line x1="60" y1="206" x2="140" y2="140" stroke="#6366f1" strokeWidth="2" strokeDasharray="3" />
                      <circle cx="140" cy="140" r="12" fill="#1e293b" stroke="#6366f1" strokeWidth="2" />
                      <text x="140" y="143" fontSize="9" fill="#ffffff" textAnchor="middle">🚇</text>
                    </g>
                  )}

                  {/* Store Node */}
                  {activeStep >= 2 && (
                    <g>
                      <line x1="140" y1="128" x2="220" y2="80" stroke="#6366f1" strokeWidth="2" strokeDasharray="3" />
                      <circle cx="220" cy="80" r="12" fill="#1e293b" stroke="#f59e0b" strokeWidth="2" />
                      <text x="220" y="83" fontSize="9" fill="#ffffff" textAnchor="middle">💳</text>
                    </g>
                  )}

                  {/* CCTV Node */}
                  {activeStep >= 3 && (
                    <g>
                      <line x1="220" y1="68" x2="290" y2="60" stroke="#6366f1" strokeWidth="2" strokeDasharray="3" />
                      <circle cx="290" cy="60" r="12" fill="#1e293b" stroke="#8b5cf6" strokeWidth="2" />
                      <text x="290" y="63" fontSize="9" fill="#ffffff" textAnchor="middle">📹</text>
                    </g>
                  )}

                  {/* Safe Point */}
                  {activeStep >= 4 && (
                    <g className="animate-bounce">
                      <line x1="290" y1="72" x2="240" y2="180" stroke="#10b981" strokeWidth="2.5" />
                      <circle cx="240" cy="180" r="15" fill="#064e3b" stroke="#10b981" strokeWidth="3" />
                      <text x="240" y="184" fontSize="10" fill="#ffffff" textAnchor="middle">🏠</text>
                    </g>
                  )}
                </svg>
              </div>

              <div className="flex gap-2 mt-3">
                <button onClick={handleTriggerStep} disabled={activeStep >= 4 || isCaseClosed} className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded">
                  👣 다음 추적 단서 확보
                </button>
                <button onClick={handleCloseCase} disabled={activeStep < 4 || isCaseClosed} className="w-1/2 py-2 bg-green-600 text-white font-bold rounded">
                  사건 발견 종결
                </button>
              </div>
            </div>
          </div>

          {/* Right: SMS notification & Logs */}
          <div className="lg:col-span-4 space-y-4">
            <div className="glass-panel rounded-xl p-4 border-t-4 border-police-neon">
              <h3 className="font-bold text-police-accent mb-2">📬 3. 보호자 긴급 의무 통지실 (제3항)</h3>
              <p className="text-[10px] text-slate-500 mb-2 leading-relaxed">
                법 제9조의2제3항에 따라 수집 즉시 보호자에게 수집 장소와 파기예정일을 SMS 통지해야 할 법적 의무가 수반됩니다.
              </p>
              <textarea className="w-full bg-slate-950 p-2 border border-slate-800 rounded text-[10px] text-white leading-normal h-20 mb-3" value={smsText} readOnly />
              <button 
                onClick={() => {
                  alert("✉️ [보호자 통지 발송 완료]\n법정 규격에 의한 수집 고지가 보호자 휴대폰으로 전송 완료되었습니다.");
                }} 
                disabled={activeStep === 0}
                className="w-full py-2 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded"
              >
                보호자 의무 고지 SMS 전송
              </button>
            </div>
          </div>

        </div>
      );
    }

    // =========================================================================
    // 5단계 모듈: 실종자 가족 지원 및 유전자 등록 모듈 (FamilyModule)
    // =========================================================================
    function FamilyModule({ cases, destructionLogs, onAddDestructionLog, onUpdateCaseStatus }) {
      const [selectedFamilyId, setSelectedFamilyId] = useState(FAMILY_DB[0].id);
      const [selectedFamily, setSelectedFamily] = useState(FAMILY_DB[0]);

      const [preCheckDone, setPreCheckDone] = useState(false);
      const [preCheckLog, setPreCheckLog] = useState("");
      
      const [consentDna, setConsentDna] = useState(false);
      const [consentDualData, setConsentDualData] = useState(false);
      const [consentResample, setConsentResample] = useState(false);

      const [flyerAge, setFlyerAge] = useState(7);
      const [agePhoto, setAgePhoto] = useState("");

      const [dnaScanning, setDnaScanning] = useState(false);
      const [reunionMatched, setReunionMatched] = useState(false);

      useEffect(() => {
        const item = FAMILY_DB.find(f => f.id === selectedFamilyId);
        setSelectedFamily(item);
        setFlyerAge(item.missingAgeAtLoss);
        setAgePhoto(item.childPhotoUrlAtLoss);
        setPreCheckDone(false);
        setPreCheckLog("");
        setConsentDna(false);
        setConsentDualData(false);
        setConsentResample(false);
        setReunionMatched(false);
      }, [selectedFamilyId]);

      // 나이 변환 이미지 연동 시뮬레이터 (WOW 기능)
      useEffect(() => {
        if (!selectedFamily) return;
        const gap = flyerAge - selectedFamily.missingAgeAtLoss;
        setAgePhoto(gap > 5 ? selectedFamily.childPhotoUrlAgedUp : selectedFamily.childPhotoUrlAtLoss);
      }, [flyerAge, selectedFamily]);

      const handlePreCheck = () => {
        setPreCheckLog("국과수 데이터베이스 조회 중...");
        setTimeout(() => {
          setPreCheckDone(true);
          setPreCheckLog("✅ 사전 등록 내역 없음 확인. 신규 유전자 등록 진행 가능 (법 제11조제3항 충족).");
        }, 1200);
      };

      const handleRunDnaMatch = () => {
        if (!preCheckDone || !consentDna) {
          alert("사전 DB 스캔과 서면 동의 징구가 완료되어야 DNA 매칭 개시가 허용됩니다.");
          return;
        }
        setDnaScanning(true);
        setTimeout(() => {
          setDnaScanning(false);
          setReunionMatched(true);
          alert(`🚨 [국과수 DNA 매칭 성공!]\n신청 가족의 DNA와 아동보호소 무연고 입소자 '김성진'(당시 7세)의 DNA가 99.999% 일치하는 것으로 판명되었습니다!`);
        }, 2500);
      };

      const handleReunionComplete = () => {
        const confirmClear = confirm("🎉 친가족 상봉 완료에 따라 법 제13조제2항제1호에 의거 국과수 보관 유전정보를 즉시 지체 없이 영구 파기하시겠습니까?");
        if (confirmClear) {
          setReunionMatched(false);

          onAddDestructionLog({
            id: `DNA-DEL-${Math.floor(1000 + Math.random() * 9000)}`,
            applicant: selectedFamily.parentName,
            relation: selectedFamily.relation,
            targetName: selectedFamily.missingChildName,
            destroyedType: "검사대상물(타액시료) 및 국과수 DB 유전체 정보 일체",
            destroyedTime: new Date().toLocaleString(),
            reason: "법 제13조제2항제1호 (실종아동등 보호자 확인에 따른 즉시 지체 없는 폐기)",
            method: "NFS 유전체 데이터 완전 하드삭제(Wipe) 및 동의서 소각",
            status: "영구 폐기(완료)"
          });

          alert("🔒 [법령 의무 완료]\n친자 관계 확인에 따라 모든 유전 정보의 지체 없는 즉시 파기가 국과수 연동망을 통해 집행 완료되었습니다.");
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6 w-full text-xs">
          
          {/* Left panel: Dna registration */}
          <div className="lg:col-span-4 space-y-4">
            <div className="glass-panel rounded-xl p-4 border-l-4 border-police-neon">
              <h3 className="font-bold text-police-accent mb-2">👪 1. 장기 실종 가족 대상자</h3>
              <select className="w-full p-1.5 rounded glass-input text-xs" value={selectedFamilyId} onChange={(e) => setSelectedFamilyId(e.target.value)}>
                {FAMILY_DB.map(f => <option key={f.id} value={f.id}>{f.parentName} (찾는 아동: {f.missingChildName})</option>)}
              </select>
            </div>

            <div className="glass-panel rounded-xl p-4 border-l-4 border-amber-500">
              <h3 className="font-bold text-amber-400 mb-2">🧬 2. 유전자 채취 법적 동의</h3>
              <div className="space-y-3">
                <div className="bg-slate-900/60 p-2 border border-slate-800 rounded">
                  <span className="text-[9px] text-slate-500 block mb-1">법 제11조제3항: DB 사전조회 의무</span>
                  <button onClick={handlePreCheck} className="w-full py-1 bg-slate-800 text-white text-[10px] rounded">기 등록 유전자 확인</button>
                  {preCheckLog && <p className="text-[9px] text-teal-400 mt-1 font-mono">{preCheckLog}</p>}
                </div>

                <div className={preCheckDone ? "space-y-2 text-[10px] text-slate-300" : "opacity-30 pointer-events-none space-y-2 text-[10px]"}>
                  <label className="flex items-center gap-1.5">
                    <input type="checkbox" checked={consentDna} onChange={(e) => setConsentDna(e.target.checked)} />
                    <span>유전자 대상물 채취 및 검사동의 (제11조제4항)</span>
                  </label>
                  <label className="flex items-center gap-1.5 border-t border-slate-850 pt-1.5">
                    <input type="checkbox" checked={consentDualData} onChange={(e) => setConsentDualData(e.target.checked)} />
                    <span>국과수-보장원 정보 이원화 관리동의 (제11조제5항)</span>
                  </label>
                </div>
              </div>
            </div>
          </div>

          {/* Middle: AI Flyer */}
          <div className="lg:col-span-5 flex flex-col gap-4">
            <div className="glass-panel rounded-xl p-4 flex-grow flex flex-col">
              <h3 className="font-bold text-police-accent mb-2">🖼️ AI 나이 변환 전단지 제작기 (Age Progression)</h3>
              
              <div className="bg-slate-900/60 p-2.5 border border-slate-800 rounded text-xs mb-3">
                <div className="flex justify-between items-center mb-1 text-slate-400">
                  <span>🕰️ 나이 변환 시뮬레이션 슬라이더</span>
                  <strong className="text-police-pink animate-pulse">만 {flyerAge}세 변환</strong>
                </div>
                <input 
                  type="range" 
                  min={selectedFamily.missingAgeAtLoss}
                  max={selectedFamily.missingAgeAtLoss + 15}
                  className="w-full"
                  value={flyerAge}
                  onChange={(e) => setFlyerAge(parseInt(e.target.value))}
                />
              </div>

              {/* Graphic Flyer */}
              <div className="border border-gray-400 bg-white text-black p-4 rounded-lg flex-grow flex flex-col justify-between max-w-[340px] mx-auto text-[10px]">
                <div className="bg-red-600 text-white font-extrabold text-center py-1 text-xs mb-2">🚨 실종아동을 찾습니다! (국가 182 전파)</div>
                <div className="grid grid-cols-12 gap-3">
                  <div className="col-span-5">
                    <div className="w-full h-36 border border-gray-400 bg-gray-100 flex items-center justify-center overflow-hidden relative">
                      <img src={agePhoto} className="object-cover w-full h-full" alt="전단지용 사진" />
                      {flyerAge > selectedFamily.missingAgeAtLoss && <span className="absolute bottom-0 inset-x-0 bg-police-pink text-white text-[8px] text-center">AI 나이 변환 몽타주</span>}
                    </div>
                  </div>
                  <div className="col-span-7 space-y-1">
                    <div>성명: <strong className="text-black text-xs font-serif">{selectedFamily.missingChildName}</strong></div>
                    <div>성별: <strong>{selectedFamily.id.includes("098") ? "남성" : "여성"}</strong></div>
                    <div>특징: <p className="text-gray-600 text-[8px] leading-snug">{selectedFamily.specialFeatures}</p></div>
                  </div>
                </div>
                <div className="border-t border-dashed border-gray-400 pt-2 mt-2 flex justify-between items-center">
                  <span className="text-[8px] text-gray-500">목격 제보 시 즉시 국번 없이 182</span>
                  <div className="w-8 h-8 bg-gray-200 flex items-center justify-center font-bold">QR</div>
                </div>
              </div>
            </div>
          </div>

          {/* Right: DNA Reunion Matching */}
          <div className="lg:col-span-3 space-y-4">
            <div className="glass-panel rounded-xl p-4 border-t-4 border-police-neon">
              <h3 className="font-bold text-police-accent mb-2">🧬 국과수 DNA 매칭 스캔</h3>
              {dnaScanning ? (
                <div className="text-center py-4 font-mono font-bold animate-pulse">DNA SCANNING...</div>
              ) : (
                <div>
                  {reunionMatched ? (
                    <div className="space-y-3 text-xs">
                      <div className="bg-police-pink/20 border border-police-pink p-2 text-center text-police-pink font-bold rounded animate-pulse">
                        🚨 DNA 일치 발견 (99.99%)!
                      </div>
                      <button onClick={handleReunionComplete} className="w-full py-2 bg-green-600 text-white font-bold rounded">
                        상봉 완료 및 DNA 즉시 영구 파기
                      </button>
                    </div>
                  ) : (
                    <button onClick={handleRunDnaMatch} disabled={!consentDna} className="w-full py-2 bg-police-neon text-police-900 font-black rounded">
                      DNA 매칭 비교 개시
                    </button>
                  )}
                </div>
              )}
            </div>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<UnifiedPortal />);
  </script>
</body>
</html>
