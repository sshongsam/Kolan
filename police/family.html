<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실종자 가족 지원 및 유전자 등록 시스템</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind CSS config for customized police dashboard palette (Teal & Warm Pink theme for Sighting Care) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            police: {
              900: '#0b0f19',
              800: '#111827',
              700: '#1f2937',
              600: '#374151',
              blue: '#1e3a8a',
              neon: '#14b8a6', // Teal glow for family care & support
              accent: '#2dd4bf',
              pink: '#ec4899', // Warm Pink for family hope
              amber: '#f59e0b',
              crimson: '#ef4444'
            }
          }
        }
      }
    }
  </script>
  
  <!-- React & ReactDOM (React 18) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <!-- Babel Compiler for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>
  
  <!-- Google Fonts: Inter & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b0f19;
      color: #e5e7eb;
      overflow-x: hidden;
    }
    
    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #14b8a6;
    }

    /* Glassmorphism utility */
    .glass-panel {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(20, 184, 166, 0.15); /* Teal border */
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    
    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f3f4f6;
      transition: all 0.2s ease-in-out;
    }
    
    .glass-input:focus {
      border-color: #14b8a6;
      box-shadow: 0 0 10px rgba(20, 184, 166, 0.3);
      outline: none;
    }

    .neon-text-glow {
      text-shadow: 0 0 8px rgba(20, 184, 166, 0.6);
    }

    .neon-border-glow:hover {
      box-shadow: 0 0 15px rgba(20, 184, 166, 0.3);
      border-color: rgba(20, 184, 166, 0.4);
    }

    /* DNA Helix Rotating Animation */
    @keyframes rotate-dna {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .dna-spiral {
      transform-origin: 50% 50%;
      animation: rotate-dna 12s linear infinite;
    }

    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        font-family: 'Batang', 'Times New Roman', serif !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        display: block !important;
      }
    }
  </style>
</head>
<body>

  <!-- React root mount point -->
  <div id="root"></div>

  <!-- Core App Code in Babel JSX -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- MOCK SEARCHING FAMILIES & DNA DB ---
    const FAMILY_DB = [
      {
        id: "FAM-098234",
        parentName: "김철수",
        parentRrn: "651015-1123456",
        relation: "부 (Father)",
        missingChildName: "김민우",
        missingAgeAtLoss: 7,
        missingYear: 2016, // 10년 전 분실
        contact: "010-1234-5678",
        address: "서울특별시 강남구 테헤란로 123",
        specialFeatures: "오른쪽 뺨에 희미한 마름모꼴 흉터가 있었음. 활달한 소년.",
        childPhotoUrlAtLoss: "https://images.unsplash.com/photo-1503919545889-aef636e10ad4?auto=format&fit=crop&q=80&w=300",
        childPhotoUrlAgedUp: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&q=80&w=300" // 17세로 변환된 청소년 가상 이미지
      },
      {
        id: "FAM-154930",
        parentName: "박지영",
        parentRrn: "720423-2987654",
        relation: "모 (Mother)",
        missingChildName: "이하은",
        missingAgeAtLoss: 11,
        missingYear: 2021, // 5년 전 분실
        contact: "010-8765-4321",
        address: "부산광역시 해운대구 우동 456",
        specialFeatures: "왼손잡이이며 발음이 다소 부정확했음. 차분한 성격.",
        childPhotoUrlAtLoss: "https://images.unsplash.com/photo-1519824141125-994e37bd7a10?auto=format&fit=crop&q=80&w=300",
        childPhotoUrlAgedUp: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?auto=format&fit=crop&q=80&w=300" // 16세로 변환된 여성 청소년 가상 이미지
      }
    ];

    function FamilySupportApp() {
      // --- STATE MANAGEMENT ---
      const [selectedFamilyId, setSelectedFamilyId] = useState(FAMILY_DB[0].id);
      const [selectedFamily, setSelectedFamily] = useState(FAMILY_DB[0]);

      // 유전자 채취 및 동의 상태 (법 제11조)
      const [preCheckDone, setPreCheckDone] = useState(false); // DB 사전조회 완료 여부 (제3항)
      const [preCheckLog, setPreCheckLog] = useState("");
      
      const [samplingName, setSamplingName] = useState("");
      const [samplingRrn, setSamplingRrn] = useState("");
      const [samplingRelation, setSamplingRelation] = useState("");
      const [samplingContact, setSamplingContact] = useState("");
      
      // 동의 체크 박스 (법적 서식용)
      const [consentDna, setConsentDna] = useState(false); // 타액 채취 동의 (제4항)
      const [consentDualData, setConsentDualData] = useState(false); // 이원화 보관 동의 (제5항)
      const [consentResample, setConsentResample] = useState(false); // 재채취 동의
      
      // 전자서명 패드 시뮬레이터
      const [signature, setSignature] = useState(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const sigCanvasRef = useRef(null);

      // AI 나이 변환 전단지 변수
      const [flyerAge, setFlyerAge] = useState(7); // 슬라이더 제어 (7세부터 22세까지)
      const [ageProgressionPhoto, setAgeProgressionPhoto] = useState("");

      // DNA 매칭 시뮬레이터 상태 (국과수 연계)
      const [dnaScanning, setDnaScanning] = useState(false);
      const [reunionMatched, setReunionMatched] = useState(false);

      // 심리치료 및 법률 연계 신청서 기안 현황
      const [supportReferrals, setSupportReferrals] = useState([]);
      const [supportType, setSupportType] = useState("심리치료"); // 심리치료, 법률지원(실종선고), 자조모임
      const [referralMemo, setReferralMemo] = useState("실종 가족 자조모임 및 트라우마 극복 심리 상담 프로그램 연계 희망.");

      // 파기대장 관리 장부 (법 제13조 - 2대 폐기 사유 준수)
      const [destructionLogs, setDestructionLogs] = useState([]);
      const [showDestructionLog, setShowDestructionLog] = useState(false);

      // 인쇄/출력 모달
      const [showPrintModal, setShowPrintModal] = useState(false);
      const [printModeType, setPrintModeType] = useState("flyer"); // flyer 또는 consent

      // --- LOGIC: 사전조회 의무 이행 (법 제11조 제3항) ---
      const handlePreCheck = () => {
        if (!samplingName && !samplingRrn) {
          alert("조회를 위해 신청자 성명 또는 주민등록번호를 먼저 입력하십시오.");
          return;
        }

        setPreCheckLog("🔍 국과수 및 보장원 유전자 데이터베이스 중복 가입 여부 검증 중...");
        
        setTimeout(() => {
          setPreCheckDone(true);
          setPreCheckLog(`✅ 검증 완료: 기 가입 이력 없음. 신규 채취 등록이 즉시 허용됩니다. (조회 로그 식별 ID: DB-CHECK-${Math.floor(1000 + Math.random() * 9000)})`);
          alert("✅ [사전 조회 의무 완료]\n동일 대상자의 기존 등록 유전정보가 존재하지 않습니다. 적법하게 채취 및 서면동의서 작성을 개시할 수 있습니다.");
        }, 1500);
      };

      // --- 전자서명 패드 시뮬레이터 핸들러 ---
      const startDrawing = (e) => {
        setIsDrawing(true);
        draw(e);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const canvas = sigCanvasRef.current;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#14b8a6'; // Teal color
        
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
      };

      const stopDrawing = () => {
        setIsDrawing(false);
        const canvas = sigCanvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.beginPath();
        setSignature(canvas.toDataURL());
      };

      const clearSignature = () => {
        const canvas = sigCanvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        setSignature(null);
      };

      // --- 사건 변경 시 동기화 ---
      useEffect(() => {
        const fam = FAMILY_DB.find(f => f.id === selectedFamilyId);
        setSelectedFamily(fam);
        setSamplingName(fam.parentName);
        setSamplingRrn(fam.parentRrn);
        setSamplingRelation(fam.relation);
        setSamplingContact(fam.contact);
        setFlyerAge(fam.missingAgeAtLoss);
        setAgeProgressionPhoto(fam.childPhotoUrlAtLoss);
        
        // 상태 초기화
        setPreCheckDone(false);
        setPreCheckLog("");
        setConsentDna(false);
        setConsentDualData(false);
        setConsentResample(false);
        setReunionMatched(false);
        clearSignature();
      }, [selectedFamilyId]);

      // --- AI 나이 변환 슬라이더 동적 연동 (WOW 기능) ---
      useEffect(() => {
        if (!selectedFamily) return;
        const ageGap = flyerAge - selectedFamily.missingAgeAtLoss;
        if (ageGap > 5) {
          setAgeProgressionPhoto(selectedFamily.childPhotoUrlAgedUp);
        } else {
          setAgeProgressionPhoto(selectedFamily.childPhotoUrlAtLoss);
        }
      }, [flyerAge, selectedFamily]);

      // --- 국과수 DNA 데이터베이스 대조 및 친족 상봉 매칭 시뮬레이터 ---
      const handleRunDnaMatch = () => {
        if (!preCheckDone || !consentDna || !signature) {
          alert("사전 조회(제3항) 및 서면동의서 자필서명(제4항) 서명이 완료되어야만 정식 국과수 DNA 매칭 분석을 개시할 수 있습니다.");
          return;
        }

        setDnaScanning(true);
        setReunionMatched(false);

        setTimeout(() => {
          setDnaScanning(false);
          setReunionMatched(true);
          alert(`🚨 [DNA MATCH FOUND - 99.99%]\n\n국립과학수사연구원 유전자 감식 결과, ${selectedFamily.parentName} 님의 채취물과 아동 보호시설 입소자 무연고 무적자 '김성진'(발견 당시 7세)의 DNA 프로파일이 99.999% 일치하는 것으로 판명되었습니다!`);
        }, 3000);
      };

      // --- 극적 상봉 완료에 따른 2024 개정 법 제13조 즉시 폐기 집행 ---
      const handleReunionComplete = () => {
        const confirmClear = confirm(`🎉 [친가족 상봉 완료 및 법정 데이터 즉시 폐기]\n\n상봉 완료에 따라 「실종아동법」 제13조 제2항 제1호(보호자 확인 시)에 의거하여, 국과수 보관 중인 모든 유전정보 및 검사대상물은 복원 불가능하게 즉시 지체 없이 파기되어야 합니다.\n\n즉시 폐기 집행 및 기록 등록을 실행하시겠습니까?`);
        
        if (confirmClear) {
          setReunionMatched(false);
          
          // 파기대장 기록 보관 (2024 개정법 기준 반영)
          const newLog = {
            id: `DNA-DEL-${Math.floor(1000 + Math.random() * 9000)}`,
            applicant: selectedFamily.parentName,
            relation: selectedFamily.relation,
            targetName: selectedCaseName(),
            destroyedType: "검사대상물(타액 시료 - 국과수 제1항 완료폐기) 및 유전정보(DNA 수치 데이터 - 제2항1호)",
            destroyedTime: new Date().toLocaleString(),
            reason: "법 제13조 제2항 제1호 (실종아동등의 보호자가 확인된 경우 - 상봉 완료)",
            method: "NFS 유전 데이터 로우 하드웨어 영구삭제(Wipe) 및 종이 동의서 파쇄 소각",
            status: "영구 폐기(복구불가)"
          };

          setDestructionLogs(prev => [newLog, ...prev]);
          setShowDestructionLog(true);

          alert("🔒 [법령 준수 완료 - 유전자 정보 일괄 파기]\n1. 국과수 보관 타액 물리 시료 폐기 완료\n2. 국과수 중앙 DB 내 유전체 정보 영구 소멸 완료\n3. 법적 파기대장(시행령 제4조의5 제3항 만족)에 정상 등재 완료.");
        }
      };

      // 대상자 이름 가져오기 헬퍼
      const selectedCaseName = () => {
        return selectedFamily ? selectedFamily.missingChildName : "미상";
      };

      // --- 심리/법률 원스톱 지원 신청서 기안 ---
      const handleRegisterReferral = () => {
        if (!referralMemo) return;
        const newReferral = {
          id: `REF-${Math.floor(1000 + Math.random() * 9000)}`,
          type: supportType,
          applicant: selectedFamily.parentName,
          childName: selectedFamily.missingChildName,
          date: new Date().toLocaleDateString(),
          memo: referralMemo,
          status: "아동권리보장원 접수 완료(송신)"
        };

        setSupportReferrals(prev => [newReferral, ...prev]);
        alert(`✅ [원스톱 가족 지원 연계 완료]\n아동권리보장원 및 지자체 피해자지원팀으로 [${supportType}] 연계 협조 공문 송신이 완료되었습니다.`);
      };

      return (
        <div className="min-h-screen flex flex-col relative pb-10">
          <div className="scan-line no-print"></div>

          {/* --- HEADER --- */}
          <header className="glass-panel no-print border-b border-police-neon/30 p-4 sticky top-0 z-40 flex flex-col md:flex-row justify-between items-center gap-4">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 bg-police-neon/20 border border-police-neon rounded-full flex items-center justify-center text-police-accent text-xl font-bold shadow-[0_0_15px_rgba(20,184,166,0.5)]">
                가족
              </div>
              <div>
                <h1 className="text-xl font-black tracking-wider text-white flex items-center gap-2">
                  실종자 가족 지원 및 유전자 매칭 시스템
                  <span className="text-xs bg-police-neon text-police-900 px-2 py-0.5 rounded-full font-black animate-pulse">
                    FAMILY CARE ACTIVE
                  </span>
                </h1>
                <p className="text-xs text-slate-400">
                  국립과학수사연구원 DNA 이원화 매칭 & 실종아동법 제11조~제15조(유전자검사 및 파기) 엄격 적용
                </p>
              </div>
            </div>

            <div className="flex gap-2">
              <button 
                onClick={() => { setPrintModeType("consent"); setShowPrintModal(true); }}
                className="px-4 py-2 bg-slate-800 border border-slate-700 text-slate-300 rounded text-xs font-bold"
              >
                🖨️ [별지 서식] 유전자 채취 동의서 출력
              </button>
              <button 
                onClick={() => { setPrintModeType("flyer"); setShowPrintModal(true); }}
                className="px-4 py-2 bg-police-pink hover:bg-pink-700 text-white rounded text-xs font-bold shadow-[0_0_12px_rgba(236,72,153,0.4)]"
              >
                🖼️ 실종자 벽보 전단지 인쇄
              </button>
            </div>
          </header>

          {/* --- MAIN GRID LAYOUT --- */}
          <main className="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6 w-full flex-grow no-print">
            
            {/* ================= LEFT: DNA 채취 신청 및 동의 패널 (4/12) ================= */}
            <section className="lg:col-span-4 flex flex-col gap-5">
              
              {/* 1. 가족 정보 매핑 */}
              <div className="glass-panel rounded-xl p-4 border-l-4 border-police-neon">
                <h3 className="text-xs font-bold text-police-accent mb-3 flex items-center gap-1.5">
                  <span>👪</span> 1. 찾는 가족(신청자) 대상자 연동
                </h3>
                
                <div className="space-y-2 text-xs">
                  <label className="block text-slate-400 mb-1">장기 실종자 가족 선택</label>
                  <select 
                    className="w-full p-2 rounded glass-input"
                    value={selectedFamilyId}
                    onChange={(e) => setSelectedFamilyId(e.target.value)}
                  >
                    {FAMILY_DB.map(f => (
                      <option key={f.id} value={f.id}>{f.parentName} ({f.relation}) - 찾는 아동: {f.missingChildName}</option>
                    ))}
                  </select>

                  <div className="mt-2 bg-slate-900/60 p-2.5 rounded border border-slate-800 text-[11px] space-y-1">
                    <div>실종아동: <strong className="text-white">{selectedFamily.missingChildName}</strong> (실종 당시 만 {selectedFamily.missingAgeAtLoss}세)</div>
                    <div>실종 발생 연도: <strong>{selectedFamily.missingYear}년 (약 {2026 - selectedFamily.missingYear}년 경과)</strong></div>
                    <div>보호자 인상착의 설명: <p className="text-slate-400 mt-0.5 leading-snug">{selectedFamily.specialFeatures}</p></div>
                  </div>
                </div>
              </div>

              {/* 2. 유전자 채취 법적 서식 작성실 */}
              <div className="glass-panel rounded-xl p-4 border-l-4 border-amber-500">
                <h3 className="text-xs font-bold text-amber-400 mb-3 flex items-center gap-1.5">
                  <span>🧬</span> 2. 유전자 채취 등록 및 법적 동의서
                </h3>

                <div className="space-y-3 text-xs">
                  {/* Step A: 사전 조회 의무 (제3항) */}
                  <div className="border border-slate-800 p-2.5 rounded bg-slate-900/50">

                      </div>
                      <div className="w-16 h-16 border border-gray-450 flex items-center justify-center bg-gray-100 text-xs font-bold text-center">
                        QR코드<br/>제보
                      </div>
                    </div>

                  </div>
                ) : (
                  /* ============= CONSENT PRINT MODE (별지 제2호서식) ============= */
                  <div>
                    <div className="flex justify-between items-end border-b border-black pb-2 mb-4">
                      <span className="text-[10px] text-gray-600">[별지 제2호서식] &lt;개정 2015. 9. 22.&gt;</span>
                      <span className="text-[10px] text-gray-600">실종아동등의 보호 및 지원에 관한 법률 시행규칙</span>
                    </div>

                    <div className="border-4 border-black p-4 text-center my-6">
                      <h1 className="text-2xl font-extrabold tracking-widest font-serif">신상카드 및 유전자검사동의서</h1>
                    </div>

                    <h3 className="font-bold text-sm mb-1.5 font-serif">■ 채취 신청 보호자 인적사항</h3>
                    <table className="w-full border-collapse border-2 border-black mb-4 text-xs">
                      <tbody>
                        <tr>
                          <td className="border border-black bg-gray-100 p-2 font-bold w-28 text-center">성명 (한글)</td>
                          <td className="border border-black p-2 w-44 font-bold">{samplingName}</td>
                          <td className="border border-black bg-gray-100 p-2 font-bold w-28 text-center">신청자와의 관계</td>
                          <td className="border border-black p-2">{samplingRelation}</td>
                        </tr>
                        <tr>
                          <td className="border border-black bg-gray-100 p-2 font-bold text-center">주민등록번호</td>
                          <td className="border border-black p-2 font-mono">{samplingRrn}</td>
                          <td className="border border-black bg-gray-100 p-2 font-bold text-center">연락처</td>
                          <td className="border border-black p-2 font-mono">{samplingContact}</td>
                        </tr>
                        <tr>
                          <td className="border border-black bg-gray-100 p-2 font-bold text-center">주소</td>
                          <td className="border border-black p-2" colSpan="3">{selectedFamily.address}</td>
                        </tr>
                      </tbody>
                    </table>

                    <h3 className="font-bold text-sm mb-1.5 font-serif">■ 찾는 실종아동등 인적 정보</h3>
                    <table className="w-full border-collapse border-2 border-black mb-4 text-xs">
                      <tbody>
                        <tr>
                          <td className="border border-black bg-gray-100 p-2 font-bold w-28 text-center">아동 성명</td>
                          <td className="border border-black p-2 w-44 font-bold">{selectedFamily.missingChildName}</td>
                          <td className="border border-black bg-gray-100 p-2 font-bold w-28 text-center">실종 당시 연령</td>
                          <td className="border border-black p-2">만 {selectedFamily.missingAgeAtLoss}세 (실종연도: {selectedFamily.missingYear}년)</td>
                        </tr>
                        <tr>
                          <td className="border border-black bg-gray-100 p-2 font-bold text-center">주요 특징</td>
                          <td className="border border-black p-2" colSpan="3">{selectedFamily.specialFeatures}</td>
                        </tr>
                      </tbody>
                    </table>

                    <h3 className="font-bold text-sm mb-1.5 font-serif">■ 법적 유전자검사 채취 및 보관 동의사항</h3>
                    <div className="border border-black p-4 leading-loose text-[10px] space-y-2 font-sans mb-6">
                      <div>
                        [ ✔ ] <strong>유전자검사대상물(타액/구강세포) 채취 및 검사동의:</strong> 「실종아동등의 보호 및 지원에 관한 법률」 제11조제4항에 의거하여 구강세포 채취 및 유전자 검사에 기각 없이 동의합니다.
                      </div>
                      <div>
                        [ ✔ ] <strong>정보의 가상 이원화 보관 동의(법 제11조제5항):</strong> 개인정보 누출 방지를 위해 유전 수치는 국립과학수사연구원(검사기관)이 보관하고 신상정보는 아동권리보장원(전문기관)이 분리 보관하는 구조에 동의합니다.
                      </div>
                      <div>
                        [ ✔ ] <strong>재채취 협조 동의(시행령 제7조):</strong> 채취물 상태 부적합 또는 판독 불능으로 인한 국과수의 재채취 요구 시 성실히 협조할 것을 동의합니다.
                      </div>
                    </div>

                    {/* Signature block with generated signature image */}
                    <div className="flex justify-between items-center my-8 font-serif">
                      <div className="font-bold text-sm">
                        신청인 성명: ____________________ (서명)
                      </div>
                      <div className="w-44 h-16 border border-gray-400 flex flex-col items-center justify-center p-1 bg-gray-50 relative">
                        <span className="text-[7px] text-gray-500 absolute top-0.5">전자 서명 이미지</span>
                        {signature ? (
                          <img src={signature} className="w-full h-full object-contain" alt="자필 서명" />
                        ) : (
                          <span className="text-[9px] text-gray-400">서명 미날인</span>
                        )}
                      </div>
                    </div>

                    <div className="text-center my-10 font-bold leading-loose text-sm font-serif">
                      「실종아동등의 보호 및 지원에 관한 법률」 제11조제4항 및 같은 법 시행규칙 제5조에 따라<br/>
                      위와 같이 유전자검사를 신청하며 검사대상물 채취에 적법하게 동의합니다.
                    </div>

                    <div className="text-right my-6 font-bold text-sm font-serif">
                      {new Date().getFullYear()}년 {String(new Date().getMonth() + 1).padStart(2, '0')}월 {String(new Date().getDate()).padStart(2, '0')}일
                    </div>

                    <div className="flex justify-between items-center font-bold text-base my-8 font-serif">
                      <span>관할 경찰관서의 장 / 검사기관의 장 귀하</span>
                      <span className="text-lg">직인생략</span>
                    </div>

                  </div>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FamilySupportApp />);
  </script>
</body>
</html>
