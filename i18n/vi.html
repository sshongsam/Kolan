 yếu lý lịch, phỏng vấn, thực tập thực tế", "summaryKo": "취업준비는 학교생활 중에 조금씩 시작할 수 있습니다. 이 단원은 이력서, 면접, 현장실습, 진로 상담과 관련된 표현을 배웁니다.", "summaryVi": "Chuẩn bị việc làm có thể bắt đầu từng bước trong thời gian học đại học. Bài này học các biểu hiện liên quan đến hồ sơ, phỏng vấn, thực tập và tư vấn nghề nghiệp.", "main": [["저는 취업을 위해 이력서를 준비합니다.", "Tôi chuẩn bị hồ sơ xin việc để đi làm."], ["면접에서는 저의 경험과 강점을 설명합니다.", "Trong phỏng vấn, tôi giải thích kinh nghiệm và điểm mạnh của mình."], ["현장실습을 통해 실제 업무를 배울 수 있습니다.", "Thông qua thực tập thực tế, tôi có thể học công việc thực tế."], ["취업지원 프로그램을 확인합니다.", "Tôi kiểm tra chương trình hỗ trợ việc làm."], ["진로 상담을 통해 미래 계획을 구체화합니다.", "Thông qua tư vấn nghề nghiệp, tôi cụ thể hóa kế hoạch tương lai."]], "vocab": [["취업", "việc làm", "일자리를 얻는 것", "việc có được công việc"], ["이력서", "sơ yếu lý lịch", "학력과 경험을 정리한 문서", "tài liệu tóm tắt học vấn và kinh nghiệm"], ["면접", "phỏng vấn", "직접 만나 질문과 답을 하는 과정", "quá trình gặp trực tiếp để hỏi và trả lời"], ["현장실습", "thực tập thực tế", "실제 현장에서 배우는 활동", "hoạt động học tại nơi làm việc thực tế"], ["강점", "điểm mạnh", "잘하거나 뛰어난 점", "điểm làm tốt hoặc nổi bật"]], "grammar": [["-을/를 위해", "để / vì ...", "목적을 나타냅니다.", "Dùng để chỉ mục đích.", "취업을 위해 준비합니다.", "Tôi chuẩn bị để đi làm."], ["-을/를 통해", "thông qua ...", "방법이나 과정을 나타냅니다.", "Dùng để chỉ phương pháp hoặc quá trình.", "실습을 통해 배웁니다.", "Tôi học thông qua thực tập."]], "expressions": [["이력서를 작성하고 있습니다.", "Em đang viết hồ sơ xin việc."], ["면접을 준비하고 싶습니다.", "Em muốn chuẩn bị phỏng vấn."], ["제 강점은 성실함입니다.", "Điểm mạnh của em là sự chăm chỉ."], ["현장실습에 관심이 있습니다.", "Em quan tâm đến thực tập thực tế."], ["취업 상담을 받고 싶습니다.", "Em muốn được tư vấn việc làm."]], "writingKo": "나의 취업준비 계획을 5문장으로 쓰세요.", "writingVi": "Hãy viết 5 câu về kế hoạch chuẩn bị việc làm của bạn."}, {"id": 10, "titleKo": "졸업준비", "titleVi": "Chuẩn bị tốt nghiệp", "themeKo": "졸업요건, 학점, 포트폴리오, 미래 계획", "themeVi": "Điều kiện tốt nghiệp, tín chỉ, hồ sơ năng lực, kế hoạch tương lai", "summaryKo": "졸업준비는 마지막 학기에만 하는 일이 아닙니다. 필요한 학점, 졸업요건, 포트폴리오, 진로 계획을 미리 확인해야 합니다.", "summaryVi": "Chuẩn bị tốt nghiệp không phải chỉ làm ở học kỳ cuối. Sinh viên cần kiểm tra trước tín chỉ cần thiết, điều kiện tốt nghiệp, hồ sơ năng lực và kế hoạch nghề nghiệp.", "main": [["저는 졸업요건을 미리 확인합니다.", "Tôi kiểm tra trước điều kiện tốt nghiệp."], ["부족한 학점이 있는지 확인합니다.", "Tôi kiểm tra xem có thiếu tín chỉ không."], ["포트폴리오에 수업 결과물과 활동 경험을 정리합니다.", "Tôi sắp xếp sản phẩm học tập và kinh nghiệm hoạt động vào hồ sơ năng lực."], ["졸업 후의 진로를 생각합니다.", "Tôi suy nghĩ về định hướng sau khi tốt nghiệp."], ["대학생활을 돌아보고 다음 목표를 세웁니다.", "Tôi nhìn lại đời sống đại học và đặt mục tiêu tiếp theo."]], "vocab": [["졸업", "tốt nghiệp", "학교의 과정을 모두 마치는 것", "hoàn thành toàn bộ chương trình của trường"], ["졸업요건", "điều kiện tốt nghiệp", "졸업하기 위해 필요한 조건", "điều kiện cần để tốt nghiệp"], ["부족하다", "thiếu", "필요한 만큼 충분하지 않다", "không đủ so với mức cần thiết"], ["포트폴리오", "hồ sơ năng lực", "나의 결과물과 경험을 모은 자료", "tài liệu tập hợp sản phẩm và kinh nghiệm của mình"], ["미래", "tương lai", "앞으로의 시간", "thời gian sắp tới"]], "grammar": [["-는지 확인합니다", "kiểm tra xem ... hay không", "어떤 사실을 확인할 때 사용합니다.", "Dùng khi kiểm tra một sự thật nào đó.", "학점이 부족한지 확인합니다.", "Tôi kiểm tra xem tín chỉ có thiếu không."], ["-고 다음", "... rồi sau đó", "앞의 일을 하고 다음 일을 할 때 사용합니다.", "Dùng khi làm việc trước rồi làm việc tiếp theo.", "대학생활을 돌아보고 다음 목표를 세웁니다.", "Tôi nhìn lại đời sống đại học rồi đặt mục tiêu tiếp theo."]], "expressions": [["졸업요건을 확인하고 싶습니다.", "Em muốn kiểm tra điều kiện tốt nghiệp."], ["부족한 학점이 있습니까?", "Em có thiếu tín chỉ nào không ạ?"], ["포트폴리오를 준비하고 있습니다.", "Em đang chuẩn bị hồ sơ năng lực."], ["졸업 후에 취업하고 싶습니다.", "Sau khi tốt nghiệp, em muốn đi làm."], ["다음 목표를 세우겠습니다.", "Em sẽ đặt mục tiêu tiếp theo."]], "writingKo": "졸업 전 내가 준비해야 할 일을 5문장으로 쓰세요.", "writingVi": "Hãy viết 5 câu về những việc bạn cần chuẩn bị trước khi tốt nghiệp."}], "introExamples": [["안녕하세요. 저는 베트남 하노이에서 온 유학생입니다.", "Xin chào. Tôi là du học sinh đến từ Hà Nội, Việt Nam."], ["저는 가천대학교에서 한국어와 전공 공부를 하고 싶습니다.", "Tôi muốn học tiếng Hàn và chuyên ngành tại Đại học Gachon."], ["저의 관심 분야는 한국 문화와 국제관계입니다.", "Lĩnh vực tôi quan tâm là văn hóa Hàn Quốc và quan hệ quốc tế."], ["한국 대학생활에 잘 적응하기 위해 매일 한국어를 연습합니다.", "Để thích nghi tốt với đời sống đại học ở Hàn Quốc, tôi luyện tiếng Hàn mỗi ngày."], ["앞으로 좋은 친구를 만나고 다양한 경험을 하고 싶습니다.", "Tôi muốn gặp những người bạn tốt và có nhiều trải nghiệm đa dạng."]], "sourceNoteKo": "이 앱은 가천대학교 공식 홈페이지의 큰 메뉴와 대학생활 정보를 참고하여 만든 일반 한국어 학습자료입니다. 실제 입학, 수강, 졸업, 장학, 취업 관련 규정은 반드시 가천대학교 공식 공지와 담당 부서 안내를 확인해야 합니다.", "sourceNoteVi": "Ứng dụng này là tài liệu học tiếng Hàn tổng quát, được xây dựng dựa trên các mục lớn và thông tin đời sống đại học trên trang chính thức của Đại học Gachon. Các quy định thực tế về nhập học, đăng ký môn học, tốt nghiệp, học bổng và việc làm phải được kiểm tra qua thông báo chính thức và bộ phận phụ trách của Đại học Gachon."}</script><script>
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const lessons = DATA.lessons;
const storeKey = 'gachon-campus-korean-vi-progress-v1';
let current = 1;
let progress = JSON.parse(localStorage.getItem(storeKey) || '{}');
function saveProgress(){ localStorage.setItem(storeKey, JSON.stringify(progress)); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function loadVoices(){ try{ speechSynthesis.getVoices(); }catch(e){} }
if ('speechSynthesis' in window){ loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
function chooseVoice(lang){ const vs = speechSynthesis.getVoices(); return vs.find(v=>v.lang===lang) || vs.find(v=>v.lang && v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase())) || null; }
function speakText(text, lang='ko-KR'){
 if(!('speechSynthesis' in window)){ alert('이 브라우저는 음성합성을 지원하지 않습니다.'); return; }
 const clean=String(text||'').trim(); if(!clean) return;
 window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(clean); u.lang=lang;
 const v=chooseVoice(lang); if(v) u.voice=v; u.rate = lang==='ko-KR'?0.88:0.9; u.pitch=1;
 setTimeout(()=>window.speechSynthesis.speak(u), 30);
}
function speakBtn(text, lang, label){ return `<button type="button" class="listen" data-speak-text="${esc(text)}" data-speak-lang="${esc(lang)}">🔊 ${esc(label)}</button>`; }
document.addEventListener('click', e=>{ const b=e.target.closest('[data-speak-text]'); if(b){ e.preventDefault(); e.stopPropagation(); speakText(b.dataset.speakText, b.dataset.speakLang); } });
document.getElementById('koTest').onclick=()=>speakText('안녕하세요. 가천대학교 대학생활 한국어 학습 앱입니다.','ko-KR');
document.getElementById('viTest').onclick=()=>speakText('Xin chào. Đây là ứng dụng học tiếng Hàn đời sống đại học Gachon dành cho du học sinh Việt Nam.','vi-VN');
document.getElementById('dashboardBtn').onclick=()=>renderDashboard();
function lessonScore(id){ const p=progress[id]||{}; if(!p.answers) return 0; const l=lessons.find(x=>x.id===id); const qs=makeQuiz(l); let correct=0; Object.entries(p.answers).forEach(([i,a])=>{ if(qs[Number(i)] && qs[Number(i)].ans===a) correct++; }); return Math.round(correct/qs.length*100); }
function badge(score,tried=true){ if(!tried) return ['🦜 Ready','시작 준비 / Sẵn sàng bắt đầu']; if(score>=90) return ['🏆 Excellent','매우 우수 / Xuất sắc']; if(score>=70) return ['🥇 Strong','성장 단계 / Đang phát triển tốt']; if(score>=50) return ['🥈 Basic','기초 이해 / Hiểu cơ bản']; return ['💪 Challenge','도전 단계 / Giai đoạn thử thách']; }
function renderList(){ document.getElementById('lessonList').innerHTML = lessons.map(l=>`<button class="lessonBtn ${l.id===current?'active':''}" data-id="${l.id}"><b>Bài học ${l.id}</b> · ${esc(l.titleKo)}<br><span class="small">${esc(l.titleVi)} · ${lessonScore(l.id)}점</span></button>`).join(''); document.querySelectorAll('.lessonBtn').forEach(b=>b.onclick=()=>{current=Number(b.dataset.id); renderLesson();}); }
function renderLesson(){ renderList(); const l=lessons.find(x=>x.id===current); const qs=makeQuiz(l); document.getElementById('app').innerHTML = `
<section class="card"><span class="badge">Bài học ${l.id}</span><span class="badge">${esc(l.themeKo)} / ${esc(l.themeVi)}</span><h2>${esc(l.titleKo)} <span class="muted">/ ${esc(l.titleVi)}</span></h2>
<p class="ko">${esc(l.summaryKo)}</p><p class="vi">${esc(l.summaryVi)}</p>${speakBtn(l.summaryKo,'ko-KR','한국어')}${speakBtn(l.summaryVi,'vi-VN','Tiếng Việt')}</section>
<section class="card"><h3>1. 본문 읽기 / Đọc bài khóa</h3>${l.main.map(([ko,vi])=>`<div class="mini"><p class="ko">${esc(ko)}</p><p class="vi">${esc(vi)}</p>${speakBtn(ko,'ko-KR','한국어')}${speakBtn(vi,'vi-VN','Tiếng Việt')}</div>`).join('')}</section>
<section class="card"><h3>2. 단어 / Từ vựng</h3><div class="grid">${l.vocab.map(v=>`<div class="mini"><b>${esc(v[0])}</b> <span class="muted">/ ${esc(v[1])}</span><p class="ko">${esc(v[2])}</p><p class="vi">${esc(v[3])}</p>${speakBtn(v[0],'ko-KR','단어')}${speakBtn(v[1],'vi-VN','Từ')}${speakBtn(v[2],'ko-KR','설명')}${speakBtn(v[3],'vi-VN','Giải thích')}</div>`).join('')}</div></section>
<section class="card"><h3>3. 문법 / Ngữ pháp</h3><div class="grid">${l.grammar.map(g=>`<div class="mini"><b>${esc(g[0])}</b> <span class="muted">/ ${esc(g[1])}</span><p class="ko">${esc(g[2])}</p><p class="vi">${esc(g[3])}</p><p class="ko">예: ${esc(g[4])}</p><p class="vi">Ví dụ: ${esc(g[5])}</p>${speakBtn(g[0]+' '+g[2]+' 예: '+g[4],'ko-KR','한국어')}${speakBtn(g[1]+'. '+g[3]+'. Ví dụ: '+g[5],'vi-VN','Tiếng Việt')}</div>`).join('')}</div></section>
<section class="card"><h3>4. 대학생활 표현 / Cách nói trong đời sống đại học</h3>${l.expressions.map(([ko,vi])=>`<div class="mini"><p class="ko">${esc(ko)}</p><p class="vi">${esc(vi)}</p>${speakBtn(ko,'ko-KR','한국어')}${speakBtn(vi,'vi-VN','Tiếng Việt')}</div>`).join('')}</section>
<section class="card"><h3>5. 작문 연습 / Luyện viết</h3><p class="ko">${esc(l.writingKo)}</p><p class="vi">${esc(l.writingVi)}</p>${speakBtn(l.writingKo,'ko-KR','한국어')}${speakBtn(l.writingVi,'vi-VN','Tiếng Việt')}<h4>자기소개 5문장 예시 / Ví dụ giới thiệu bản thân 5 câu</h4>${DATA.introExamples.map(([ko,vi])=>`<div class="mini"><p class="ko">${esc(ko)}</p><p class="vi">${esc(vi)}</p>${speakBtn(ko,'ko-KR','한국어')}${speakBtn(vi,'vi-VN','Tiếng Việt')}</div>`).join('')}<textarea id="writing" placeholder="여기에 한국어로 써 보세요."></textarea><br><button class="primary" id="saveWriting">작문 저장 / Lưu bài viết</button><span id="writeMsg" class="muted"></span></section>
<section class="card"><h3>6. 퀴즈 / Trắc nghiệm</h3><div class="score">${lessonScore(l.id)}점</div><div class="bar"><div class="fill" style="width:${lessonScore(l.id)}%"></div></div><div id="quizBox">${renderQuiz(qs,l.id)}</div></section>
<section class="card"><h3>자료 안내 / Ghi chú tài liệu</h3><p class="ko">${esc(DATA.sourceNoteKo)}</p><p class="vi">${esc(DATA.sourceNoteVi)}</p>${speakBtn(DATA.sourceNoteKo,'ko-KR','한국어')}${speakBtn(DATA.sourceNoteVi,'vi-VN','Tiếng Việt')}</section>`;
 document.getElementById('saveWriting').onclick=()=>{progress[l.id]=progress[l.id]||{}; progress[l.id].writing=document.getElementById('writing').value; saveProgress(); document.getElementById('writeMsg').textContent=' 저장되었습니다. / Đã lưu.'};
}
function makeQuiz(l){ const q=[]; const v=l.vocab; const ex=l.expressions; const g=l.grammar; const distractorsVi=['수업','지원서','학점','발표','상담','진로','과제','교양'].map((x,i)=>['lớp học','đơn đăng ký','tín chỉ','thuyết trình','tư vấn','định hướng','bài tập','đại cương'][i]);
 q.push({ko:`“${v[0][0]}”의 베트남어 뜻은 무엇입니까?`,vi:`Nghĩa tiếng Việt của “${v[0][0]}” là gì?`,choices:[v[0][1],...distractorsVi.filter(x=>x!==v[0][1]).slice(0,3)],ans:v[0][1],expKo:`“${v[0][0]}”은/는 “${v[0][1]}”라는 뜻입니다.`,expVi:`“${v[0][0]}” có nghĩa là “${v[0][1]}”.`});
 q.push({ko:`“${v[1][0]}”의 쉬운 설명은 무엇입니까?`,vi:`Giải thích dễ hiểu của “${v[1][0]}” là gì?`,choices:[v[1][2],v[2][2],v[3][2],v[4][2]],ans:v[1][2],expKo:`정답은 “${v[1][2]}”입니다.`,expVi:`Đáp án đúng là “${v[1][3]}”.`});
 q.push({ko:`다음 표현의 베트남어는 무엇입니까? “${ex[0][0]}”`,vi:`Bản dịch tiếng Việt của câu sau là gì? “${ex[0][0]}”`,choices:[ex[0][1],ex[1][1],ex[2][1],ex[3][1]],ans:ex[0][1],expKo:`이 표현은 “${ex[0][1]}”라고 번역할 수 있습니다.`,expVi:`Câu này có thể dịch là “${ex[0][1]}”.`});
 q.push({ko:`문법 “${g[0][0]}”은 언제 사용합니까?`,vi:`Ngữ pháp “${g[0][0]}” dùng khi nào?`,choices:[g[0][2],g[1][2],'장소를 말할 때 사용합니다.','숫자를 셀 때 사용합니다.'],ans:g[0][2],expKo:`“${g[0][0]}”은/는 ${g[0][2]}`,expVi:`“${g[0][0]}” ${g[0][3]}`});
 q.push({ko:`다음 예문의 베트남어 번역은 무엇입니까? “${g[0][4]}”`,vi:`Bản dịch tiếng Việt của ví dụ sau là gì? “${g[0][4]}”`,choices:[g[0][5],g[1][5],l.main[0][1],l.main[1][1]],ans:g[0][5],expKo:`정답은 “${g[0][5]}”입니다.`,expVi:`Đáp án đúng là “${g[0][5]}”.`});
 q.push({ko:`이 단원의 주제는 무엇입니까?`,vi:`Chủ đề của bài học này là gì?`,choices:[l.themeKo,'운동 경기','음식 주문','여행 예약'],ans:l.themeKo,expKo:`이 단원의 주제는 “${l.themeKo}”입니다.`,expVi:`Chủ đề của bài học này là “${l.themeVi}”.`});

 return q.map(qq=>({...qq, choices: qq.choices.slice(0,4)})); }
function renderQuiz(qs,id){ const p=progress[id]||{}; const ans=p.answers||{}; return qs.map((q,i)=>{ const selected=ans[i]; return `<div class="mini"><b>Q${i+1}. ${esc(q.ko)}</b><p class="vi">${esc(q.vi)}</p>${speakBtn(q.ko,'ko-KR','문제')}${speakBtn(q.vi,'vi-VN','Câu hỏi')}${q.choices.map(c=>`<button class="choice ${selected? (c===q.ans?'correct':(c===selected?'wrong':'')) : ''}" data-q="${i}" data-a="${esc(c)}">${esc(c)} ${speakBtn(c, /[가-힣]/.test(c)?'ko-KR':'vi-VN','듣기')}</button>`).join('')}${selected?`<div><b>정답 / Đáp án: ${esc(q.ans)}</b>${speakBtn(q.ans,/[가-힣]/.test(q.ans)?'ko-KR':'vi-VN','정답 듣기')}<p class="ko">${esc(q.expKo)}</p><p class="vi">${esc(q.expVi)}</p>${speakBtn(q.expKo,'ko-KR','해설')}${speakBtn(q.expVi,'vi-VN','Giải thích')}</div>`:''}</div>`;}).join(''); }
document.addEventListener('click', e=>{ const c=e.target.closest('.choice'); if(!c) return; const l=lessons.find(x=>x.id===current); progress[l.id]=progress[l.id]||{}; progress[l.id].answers=progress[l.id].answers||{}; progress[l.id].answers[c.dataset.q]=c.dataset.a; saveProgress(); renderLesson(); });
function renderDashboard(){ renderList(); const tried=lessons.filter(l=>progress[l.id]&&progress[l.id].answers).length; const avg=Math.round(lessons.reduce((s,l)=>s+lessonScore(l.id),0)/lessons.length); document.getElementById('app').innerHTML=`<section class="card"><div class="parrot">🦜</div><h2>나의 성취 대시보드 / Bảng thành tích của tôi</h2><p class="ko">전체 10개 단원의 학습 점수를 확인하고, 70점 이상을 목표로 공부해 보세요.</p><p class="vi">Hãy kiểm tra điểm của 10 bài học và học với mục tiêu đạt từ 70 điểm trở lên.</p>${speakBtn('전체 10개 단원의 학습 점수를 확인하고, 70점 이상을 목표로 공부해 보세요.','ko-KR','한국어')}${speakBtn('Hãy kiểm tra điểm của 10 bài học và học với mục tiêu đạt từ 70 điểm trở lên.','vi-VN','Tiếng Việt')}<div class="score">${avg}점</div><p>Số bài học đã làm ${tried}/10</p><div class="bar"><div class="fill" style="width:${avg}%"></div></div></section><section class="card"><h3>학습 배지 레전드 / Chú giải huy hiệu</h3>${[['🦜 Ready','0점: 시작 준비 / 0 điểm: sẵn sàng bắt đầu'],['💪 Challenge','10~40점: 도전 단계 / giai đoạn thử thách'],['🥈 Basic','50~60점: 기초 이해 / hiểu cơ bản'],['🥇 Strong','70~80점: 성장 단계 / phát triển tốt'],['🏆 Excellent','90~100점: 매우 우수 / xuất sắc']].map(x=>`<div class="mini"><b>${x[0]}</b><p>${x[1]}</p>${speakBtn(x[1],'ko-KR','한국어')}${speakBtn(x[1],'vi-VN','Tiếng Việt')}</div>`).join('')}</section><section class="card"><h3>10개 단원 현황 / Tình trạng 10 bài học</h3><div class="dashgrid">${lessons.map(l=>{const score=lessonScore(l.id); const b=badge(score,!!(progress[l.id]&&progress[l.id].answers)); return `<div class="mini"><b>Bài học ${l.id}. ${esc(l.titleKo)}</b><p class="vi">${esc(l.titleVi)}</p><p>Nội dung: ${esc(l.themeVi)}</p><p>Tóm tắt: ${esc(l.summaryVi)}</p><span class="badge">${b[0]}</span><p>${b[1]}</p><div class="score">${score}점</div><div class="bar"><div class="fill" style="width:${score}%"></div></div>${speakBtn('Bài học '+l.id+'. '+l.titleKo+'. '+l.themeKo,'ko-KR','한국어')}${speakBtn('Bài học '+l.id+'. '+l.titleVi+'. '+l.themeVi+'. '+l.summaryVi,'vi-VN','Tiếng Việt')}</div>`}).join('')}</div></section>`; }
