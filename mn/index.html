нхий солонгос хэлний сургалтын материал юм. Элсэлт, хичээл сонголт, төгсөлт, тэтгэлэг, ажил эрхлэлттэй холбоотой бодит дүрэм, хугацааг заавал Гачон их сургуулийн албан ёсны зарлал болон хариуцсан нэгжээс шалгана."}</script><script>
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const lessons = DATA.lessons;
const storeKey = 'gachon-campus-korean-mn-progress-v1';
let current = 1;
let progress = JSON.parse(localStorage.getItem(storeKey) || '{}');
function saveProgress(){ localStorage.setItem(storeKey, JSON.stringify(progress)); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function loadVoices(){ try{ speechSynthesis.getVoices(); }catch(e){} }
if ('speechSynthesis' in window){ loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
function chooseVoice(lang){ const vs = speechSynthesis.getVoices(); return vs.find(v=>v.lang===lang) || vs.find(v=>v.lang && v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase())) || null; }
function speakText(text, lang='ko-KR'){
 if(!('speechSynthesis' in window)){ alert('이 브라우저는 음성합성을 지원하지 않습니다.'); return; }
 const clean=String(text||'').trim(); if(!clean) return;
 window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(clean); u.lang=lang;
 const v=chooseVoice(lang); if(v) u.voice=v; u.rate = lang==='ko-KR'?0.88:0.9; u.pitch=1;
 setTimeout(()=>window.speechSynthesis.speak(u), 30);
}
function speakBtn(text, lang, label){ return `<button type="button" class="listen" data-speak-text="${esc(text)}" data-speak-lang="${esc(lang)}">🔊 ${esc(label)}</button>`; }
document.addEventListener('click', e=>{ const b=e.target.closest('[data-speak-text]'); if(b){ e.preventDefault(); e.stopPropagation(); speakText(b.dataset.speakText, b.dataset.speakLang); } });
document.getElementById('koTest').onclick=()=>speakText('안녕하세요. 가천대학교 대학생활 한국어 학습 앱입니다.','ko-KR');
document.getElementById('mnTest').onclick=()=>speakText('Сайн байна уу. Энэ бол Монгол оюутнуудад зориулсан Гачон их сургуулийн солонгос хэлний апп юм.','mn-MN');
document.getElementById('dashboardBtn').onclick=()=>renderDashboard();
function lessonScore(id){ const p=progress[id]||{}; if(!p.answers) return 0; const l=lessons.find(x=>x.id===id); const qs=makeQuiz(l); let correct=0; Object.entries(p.answers).forEach(([i,a])=>{ if(qs[Number(i)] && qs[Number(i)].ans===a) correct++; }); return Math.round(correct/qs.length*100); }
function badge(score,tried=true){ if(!tried) return ['🦜 Ready','시작 준비 / Эхлэхэд бэлэн']; if(score>=90) return ['🏆 Excellent','매우 우수 / Маш сайн']; if(score>=70) return ['🥇 Strong','성장 단계 / Сайн ахицтай']; if(score>=50) return ['🥈 Basic','기초 이해 / Суурь ойлголттой']; return ['💪 Challenge','도전 단계 / Дасгал хийх шат']; }
function renderList(){ document.getElementById('lessonList').innerHTML = lessons.map(l=>`<button class="lessonBtn ${l.id===current?'active':''}" data-id="${l.id}"><b>Хичээл ${l.id}</b> · ${esc(l.titleKo)}<br><span class="small">${esc(l.titleMn)} · ${lessonScore(l.id)}점</span></button>`).join(''); document.querySelectorAll('.lessonBtn').forEach(b=>b.onclick=()=>{current=Number(b.dataset.id); renderLesson();}); }
function renderLesson(){ renderList(); const l=lessons.find(x=>x.id===current); const qs=makeQuiz(l); document.getElementById('app').innerHTML = `
<section class="card"><span class="badge">Хичээл ${l.id}</span><span class="badge">${esc(l.themeKo)} / ${esc(l.themeMn)}</span><h2>${esc(l.titleKo)} <span class="muted">/ ${esc(l.titleMn)}</span></h2>
<p class="ko">${esc(l.summaryKo)}</p><p class="mn">${esc(l.summaryMn)}</p>${speakBtn(l.summaryKo,'ko-KR','한국어')}${speakBtn(l.summaryMn,'mn-MN','Монгол')}</section>
<section class="card"><h3>1. 본문 읽기 / Үндсэн эхийг унших</h3>${l.main.map(([ko,mn])=>`<div class="mini"><p class="ko">${esc(ko)}</p><p class="mn">${esc(mn)}</p>${speakBtn(ko,'ko-KR','한국어')}${speakBtn(mn,'mn-MN','Монгол')}</div>`).join('')}</section>
<section class="card"><h3>2. 단어 / Үгийн сан</h3><div class="grid">${l.vocab.map(v=>`<div class="mini"><b>${esc(v[0])}</b> <span class="muted">/ ${esc(v[1])}</span><p class="ko">${esc(v[2])}</p><p class="mn">${esc(v[3])}</p>${speakBtn(v[0],'ko-KR','단어')}${speakBtn(v[1],'mn-MN','Үг')}${speakBtn(v[2],'ko-KR','설명')}${speakBtn(v[3],'mn-MN','Тайлбар')}</div>`).join('')}</div></section>
<section class="card"><h3>3. 문법 / Дүрэм</h3><div class="grid">${l.grammar.map(g=>`<div class="mini"><b>${esc(g[0])}</b> <span class="muted">/ ${esc(g[1])}</span><p class="ko">${esc(g[2])}</p><p class="mn">${esc(g[3])}</p><p class="ko">예: ${esc(g[4])}</p><p class="mn">Жишээ: ${esc(g[5])}</p>${speakBtn(g[0]+' '+g[2]+' 예: '+g[4],'ko-KR','한국어')}${speakBtn(g[1]+'. '+g[3]+'. Жишээ: '+g[5],'mn-MN','Монгол')}</div>`).join('')}</div></section>
<section class="card"><h3>4. 대학생활 표현 / Их сургуулийн амьдралын хэллэг</h3>${l.expressions.map(([ko,mn])=>`<div class="mini"><p class="ko">${esc(ko)}</p><p class="mn">${esc(mn)}</p>${speakBtn(ko,'ko-KR','한국어')}${speakBtn(mn,'mn-MN','Монгол')}</div>`).join('')}</section>
<section class="card"><h3>5. 작문 연습 / Бичих дасгал</h3><p class="ko">${esc(l.writingKo)}</p><p class="mn">${esc(l.writingMn)}</p>${speakBtn(l.writingKo,'ko-KR','한국어')}${speakBtn(l.writingMn,'mn-MN','Монгол')}<h4>자기소개 5문장 예시 / Өөрийгөө танилцуулах 5 өгүүлбэрийн жишээ</h4>${DATA.introExamples.map(([ko,mn])=>`<div class="mini"><p class="ko">${esc(ko)}</p><p class="mn">${esc(mn)}</p>${speakBtn(ko,'ko-KR','한국어')}${speakBtn(mn,'mn-MN','Монгол')}</div>`).join('')}<textarea id="writing" placeholder="여기에 한국어로 써 보세요."></textarea><br><button class="primary" id="saveWriting">작문 저장 / Бичвэр хадгалах</button><span id="writeMsg" class="muted"></span></section>
<section class="card"><h3>6. 퀴즈 / Тест</h3><div class="score">${lessonScore(l.id)}점</div><div class="bar"><div class="fill" style="width:${lessonScore(l.id)}%"></div></div><div id="quizBox">${renderQuiz(qs,l.id)}</div></section>
<section class="card"><h3>자료 안내 / Материалын тайлбар</h3><p class="ko">${esc(DATA.sourceNoteKo)}</p><p class="mn">${esc(DATA.sourceNoteMn)}</p>${speakBtn(DATA.sourceNoteKo,'ko-KR','한국어')}${speakBtn(DATA.sourceNoteMn,'mn-MN','Монгол')}</section>`;

}
function makeQuiz(l){ const q=[]; const v=l.vocab; const ex=l.expressions; const g=l.grammar; const distractorsMn=['хичээл','өргөдлийн маягт','кредит','илтгэл','зөвлөгөө','карьер','даалгавар','ерөнхий суурь'];
 q.push({ko:`“${v[0][0]}”의 몽골어 뜻은 무엇입니까?`,mn:`“${v[0][0]}” гэдэг үгийн монгол утга юу вэ?`,choices:[v[0][1],...distractorsMn.filter(x=>x!==v[0][1]).slice(0,3)],ans:v[0][1],expKo:`“${v[0][0]}”은/는 “${v[0][1]}”라는 뜻입니다.`,expMn:`“${v[0][0]}” гэдэг нь “${v[0][1]}” гэсэн утгатай.`});
 q.push({ko:`“${v[1][0]}”의 쉬운 설명은 무엇입니까?`,mn:`“${v[1][0]}” гэдэг үгийн хялбар тайлбар юу вэ?`,choices:[v[1][2],v[2][2],v[3][2],v[4][2]],ans:v[1][2],expKo:`정답은 “${v[1][2]}”입니다.`,expMn:`Зөв хариулт: “${v[1][3]}”.`});
 q.push({ko:`다음 표현의 몽골어는 무엇입니까? “${ex[0][0]}”`,mn:`Дараах өгүүлбэрийн монгол орчуулга юу вэ? “${ex[0][0]}”`,choices:[ex[0][1],ex[1][1],ex[2][1],ex[3][1]],ans:ex[0][1],expKo:`이 표현은 “${ex[0][1]}”라고 번역할 수 있습니다.`,expMn:`Энэ өгүүлбэрийг “${ex[0][1]}” гэж орчуулж болно.`});
 q.push({ko:`문법 “${g[0][0]}”은 언제 사용합니까?`,mn:`“${g[0][0]}” дүрмийг хэзээ хэрэглэдэг вэ?`,choices:[g[0][2],g[1][2],'장소를 말할 때 사용합니다.','숫자를 셀 때 사용합니다.'],ans:g[0][2],expKo:`“${g[0][0]}”은/는 ${g[0][2]}`,expMn:`“${g[0][0]}” нь ${g[0][3]}.`});
 q.push({ko:`다음 예문의 몽골어 번역은 무엇입니까? “${g[0][4]}”`,mn:`Дараах жишээний монгол орчуулга юу вэ? “${g[0][4]}”`,choices:[g[0][5],g[1][5],l.main[0][1],l.main[1][1]],ans:g[0][5],expKo:`정답은 “${g[0][5]}”입니다.`,expMn:`Зөв хариулт: “${g[0][5]}”.`});
 q.push({ko:`이 단원의 주제는 무엇입니까?`,mn:`Энэ хичээлийн сэдэв юу вэ?`,choices:[l.themeKo,'운동 경기','음식 주문','여행 예약'],ans:l.themeKo,expKo:`이 단원의 주제는 “${l.themeKo}”입니다.`,expMn:`Энэ хичээлийн сэдэв бол “${l.themeMn}”.`});
 q.push({ko:`다음 중 이 단원에서 사용할 수 있는 대학생활 표현은 무엇입니까?`,mn:`Дараахаас энэ хичээлд хэрэглэж болох их сургуулийн хэллэг аль нь вэ?`,choices:[ex[2][0],'오늘 날씨가 아주 덥습니다.','저는 사과를 먹었습니다.','강아지가 공원에서 뛰어요.'],ans:ex[2][0],expKo:`“${ex[2][0]}”은/는 이 단원 상황에 맞는 표현입니다.`,expMn:`“${ex[2][1]}” нь энэ хичээлийн нөхцөлд тохирох өгүүлбэр юм.`});
 q.push({ko:`본문에서 배울 수 있는 행동은 무엇입니까?`,mn:`Үндсэн эхээс сурч болох үйлдэл аль нь вэ?`,choices:[l.main[2][0], '비행기를 수리합니다.', '노래방을 예약합니다.', '시장에서 과일을 삽니다.'],ans:l.main[2][0],expKo:`본문에는 “${l.main[2][0]}”라는 내용이 있습니다.`,expMn:`Үндсэн эхэд “${l.main[2][1]}” гэсэн агуулга байна.`});
 q.push({ko:`“${v[4][0]}”의 몽골어 뜻은 무엇입니까?`,mn:`“${v[4][0]}” гэдэг үгийн монгол утга юу вэ?`,choices:[v[4][1],v[3][1],v[2][1],v[1][1]],ans:v[4][1],expKo:`“${v[4][0]}”은/는 “${v[4][1]}”라는 뜻입니다.`,expMn:`“${v[4][0]}” гэдэг нь “${v[4][1]}” гэсэн утгатай.`});
 q.push({ko:`이 단원에서 가장 중요한 학습 태도는 무엇입니까?`,mn:`Энэ хичээлд хамгийн чухал суралцах хандлага юу вэ?`,choices:['확인하고 공손하게 질문하기','아무 것도 묻지 않기','친구와 말하지 않기','수업에 참여하지 않기'],ans:'확인하고 공손하게 질문하기',expKo:`대학생활에서는 필요한 정보를 확인하고 공손하게 질문하는 태도가 중요합니다.`,expMn:`Их сургуулийн амьдралд шаардлагатай мэдээллийг шалгаж, эелдгээр асуух хандлага чухал.`});
 return q.map(qq=>({...qq, choices: qq.choices.slice(0,4)})); }
function renderQuiz(qs,id){ const p=progress[id]||{}; const ans=p.answers||{}; return qs.map((q,i)=>{ const selected=ans[i]; return `<div class="mini"><b>Q${i+1}. ${esc(q.ko)}</b><p class="mn">${esc(q.mn)}</p>${speakBtn(q.ko,'ko-KR','문제')}${speakBtn(q.mn,'mn-MN','Асуулт')}${q.choices.map(c=>`<button class="choice ${selected? (c===q.ans?'correct':(c===selected?'wrong':'')) : ''}" data-q="${i}" data-a="${esc(c)}">${esc(c)} ${speakBtn(c, /[가-힣]/.test(c)?'ko-KR':'mn-MN','듣기')}</button>`).join('')}${selected?`<div><b>정답 / Зөв хариулт: ${esc(q.ans)}</b>${speakBtn(q.ans,/[가-힣]/.test(q.ans)?'ko-KR':'mn-MN','정답 듣기')}<p class="ko">${esc(q.expKo)}</p><p class="mn">${esc(q.expMn)}</p>${speakBtn(q.expKo,'ko-KR','해설')}${speakBtn(q.expMn,'mn-MN','Тайлбар')}</div>`:''}</div>`;}).join(''); }
document.addEventListener('click', e=>{ const c=e.target.closest('.choice'); if(!c) return; const l=lessons.find(x=>x.id===current); progress[l.id]=progress[l.id]||{}; progress[l.id].answers=progress[l.id].answers||{}; progress[l.id].answers[c.dataset.q]=c.dataset.a; saveProgress(); renderLesson(); });
function renderDashboard(){ renderList(); const tried=lessons.filter(l=>progress[l.id]&&progress[l.id].answers).length; const avg=Math.round(lessons.reduce((s,l)=>s+lessonScore(l.id),0)/lessons.length); document.getElementById('app').innerHTML=`<section class="card"><div class="parrot">🦜</div><h2>나의 성취 대시보드 / Миний амжилтын самбар</h2><p class="ko">전체 10개 단원의 학습 점수를 확인하고, 70점 이상을 목표로 공부해 보세요.</p><p class="mn">Нийт 10 хичээлийн оноогоо шалгаж, 70-аас дээш оноо авах зорилго тавин суралцаарай.</p>${speakBtn('전체 10개 단원의 학습 점수를 확인하고, 70점 이상을 목표로 공부해 보세요.','ko-KR','한국어')}${speakBtn('Нийт 10 хичээлийн оноогоо шалгаж, 70-аас дээш оноо авах зорилго тавин суралцаарай.','mn-MN','Монгол')}<div class="score">${avg}점</div><p>Судалсан хичээл ${tried}/10</p><div class="bar"><div class="fill" style="width:${avg}%"></div></div></section><section class="card"><h3>학습 배지 레전드 / Сургалтын тэмдгийн тайлбар</h3>${[['🦜 Ready','0점: 시작 준비 / 0 оноо: эхлэхэд бэлэн'],['💪 Challenge','10~40점: 도전 단계 / 10~40 оноо: дасгал хийх шат'],['🥈 Basic','50~60점: 기초 이해 / 50~60 оноо: суурь ойлголт'],['🥇 Strong','70~80점: 성장 단계 / 70~80 оноо: сайн ахиц'],['🏆 Excellent','90~100점: 매우 우수 / 90~100 оноо: маш сайн']].map(x=>`<div class="mini"><b>${x[0]}</b><p>${x[1]}</p>${speakBtn(x[1],'ko-KR','한국어')}${speakBtn(x[1],'mn-MN','Монгол')}</div>`).join('')}</section><section class="card"><h3>10개 단원 현황 / 10 хичээлийн явц</h3><div class="dashgrid">${lessons.map(l=>{const score=lessonScore(l.id); const b=badge(score,!!(progress[l.id]&&progress[l.id].answers)); return `<div class="mini"><b>Хичээл ${l.id}. ${esc(l.titleKo)}</b><p class="mn">${esc(l.titleMn)}</p><p>Агуулга: ${esc(l.themeMn)}</p><p>Товч: ${esc(l.summaryMn)}</p><span class="badge">${b[0]}</span><p>${b[1]}</p><div class="score">${score}점</div><div class="bar"><div class="fill" style="width:${score}%"></div></div>${speakBtn('Хичээл '+l.id+'. '+l.titleKo+'. '+l.themeKo,'ko-KR','한국어')}${speakBtn('Хичээл '+l.id+'. '+l.titleMn+'. '+l.themeMn+'. '+l.summaryMn,'mn-MN','Монгол')}</div>`}).join('')}</div></section>`; }
renderList(); renderLesson();
</script></body></html>
