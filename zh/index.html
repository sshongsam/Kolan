<script>
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const lessons = DATA.lessons;
let current = 1;
const storeKey = 'gachon-campus-korean-zh-progress-v1';
let progress = JSON.parse(localStorage.getItem(storeKey)||'{}');
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; setTimeout(loadVoices,300); setTimeout(loadVoices,1000); }
function pickVoice(lang){
  loadVoices(); const base = lang.split('-')[0].toLowerCase();
  return voices.find(v=>v.lang.toLowerCase()===lang.toLowerCase()) || voices.find(v=>v.lang.toLowerCase().startsWith(base)) || null;
}
function speakText(text, lang='ko-KR'){
  if(!('speechSynthesis' in window)){ alert('이 브라우저는 음성합성을 지원하지 않습니다.'); return; }
  if(!text) return;
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = lang.startsWith('ko') ? 0.86 : 0.90; u.pitch = 1;
  const voice = pickVoice(lang); if(voice) u.voice = voice;
  setTimeout(()=>speechSynthesis.speak(u), 40);
}
document.addEventListener('click', e=>{
  const btn = e.target.closest('[data-speak]');
  if(btn){ e.stopPropagation(); speakText(btn.getAttribute('data-speak'), btn.getAttribute('data-lang')||'ko-KR'); }
});
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function speakBtn(text, lang, label){ return `<button class="listen" type="button" data-speak="${esc(text)}" data-lang="${lang}">🔊 ${label}</button>`; }
function save(){ localStorage.setItem(storeKey, JSON.stringify(progress)); }
function lessonScore(id){ const p=progress[id]||{}; return p.score || 0; }
function badge(score, tried=false){ if(!tried) return ['🦜 Ready','准备开始学习']; if(score>=90) return ['🏆 Excellent','优秀：可以自信使用校园韩语']; if(score>=70) return ['🥇 Strong','良好：正在稳定提高']; if(score>=50) return ['🥈 Basic','基础：已经理解核心内容']; return ['💪 Challenge','挑战：继续练习']; }
function renderList(){ document.getElementById('lessonList').innerHTML = lessons.map(l=>`<button class="lessonBtn ${l.id===current?'active':''}" data-id="${l.id}"><b>单元 ${l.id}</b> · ${esc(l.titleKo)}<br><span class="small">${esc(l.titleZh)} · ${lessonScore(l.id)}점</span></button>`).join(''); }
document.getElementById('lessonList').addEventListener('click', e=>{ const b=e.target.closest('.lessonBtn'); if(b){ current=Number(b.dataset.id); renderLesson(); } });
document.getElementById('dashboardBtn').onclick=()=>renderDashboard();
document.getElementById('koTest').onclick=()=>speakText('안녕하세요. 가천대학교 한국어 대학생활 학습 앱입니다.','ko-KR');
document.getElementById('zhTest').onclick=()=>speakText('你好。这是为中国留学生准备的嘉泉大学校园韩语学习应用。','zh-CN');
function renderLesson(){
 const l=lessons.find(x=>x.id===current); renderList(); const p=progress[l.id]||{answers:{},score:0};
 document.getElementById('app').innerHTML = `
 <section class="card"><span class="badge">单元 ${l.id}</span><span class="badge">${esc(l.themeKo)} / ${esc(l.themeZh)}</span><h2>${esc(l.titleKo)} <span class="muted">/ ${esc(l.titleZh)}</span></h2>
 <p class="ko">${esc(l.summaryKo)}</p><p class="zh">${esc(l.summaryZh)}</p>${speakBtn(l.summaryKo,'ko-KR','한국어')}${speakBtn(l.summaryZh,'zh-CN','中文')}</section>
 <section class="card"><h3>1. 학습 원문 / 学习课文</h3>${l.main.map(([ko,zh])=>`<div class="mini"><div class="ko">${esc(ko)} ${speakBtn(ko,'ko-KR','한국어')}</div><div class="zh">${esc(zh)} ${speakBtn(zh,'zh-CN','中文')}</div></div>`).join('')}</section>
 <section class="card"><h3>2. 단어 / 词汇</h3><div class="grid">${l.vocab.map(v=>`<div class="mini"><div class="ko">${esc(v[0])} ${speakBtn(v[0],'ko-KR','KOR')}</div><div class="zh"><b>${esc(v[1])}</b> ${speakBtn(v[1],'zh-CN','中文')}</div><p class="ko">${esc(v[2])} ${speakBtn(v[2],'ko-KR','설명')}</p><p class="zh">${esc(v[3])} ${speakBtn(v[3],'zh-CN','说明')}</p></div>`).join('')}</div></section>
 <section class="card"><h3>3. 문법 / 语法</h3>${l.grammar.map(g=>`<div class="mini"><h4>${esc(g[0])} / ${esc(g[1])}</h4><p class="ko">${esc(g[2])} ${speakBtn(g[2],'ko-KR','한국어')}</p><p class="zh">${esc(g[3])} ${speakBtn(g[3],'zh-CN','中文')}</p><div class="ko">예문: ${esc(g[4])} ${speakBtn(g[4],'ko-KR','예문')}</div><div class="zh">例句: ${esc(g[5])} ${speakBtn(g[5],'zh-CN','例句')}</div></div>`).join('')}</section>
 <section class="card"><h3>4. 대학생활 표현 / 校园生活表达</h3><div class="grid">${l.expressions.map(([ko,zh])=>`<div class="mini"><div class="ko">${esc(ko)} ${speakBtn(ko,'ko-KR','KOR')}</div><div class="zh">${esc(zh)} ${speakBtn(zh,'zh-CN','中文')}</div></div>`).join('')}</div></section>
 <section class="card"><h3>5. 작문 연습 / 写作练习</h3><p class="ko">${esc(l.writingKo)} ${speakBtn(l.writingKo,'ko-KR','한국어')}</p><p class="zh">${esc(l.writingZh)} ${speakBtn(l.writingZh,'zh-CN','中文')}</p><h4>자기소개 5문장 예시 / 自我介绍五句示例</h4>${DATA.introExamples.map(([ko,zh])=>`<div class="mini"><div class="ko">${esc(ko)} ${speakBtn(ko,'ko-KR','KOR')}</div><div class="zh">${esc(zh)} ${speakBtn(zh,'zh-CN','中文')}</div></div>`).join('')}<textarea id="writing" placeholder="여기에 한국어 문장을 쓰세요. / 请在这里写韩语句子。">${esc((progress[l.id]||{}).writing||'')}</textarea><br><button class="primary" onclick="saveWriting(${l.id})">저장 / 保存</button> <button class="secondary" onclick="simpleFeedback()">간단 피드백 / 简单反馈</button><div id="feedback"></div></section>
 <section class="card"><h3>6. 퀴즈 / 测验</h3><div class="score">${p.score||0} / 100</div><div class="bar"><div class="fill" style="width:${p.score||0}%"></div></div><div id="quizBox">${renderQuiz(l)}</div></section>
 <section class="card"><h3>출처와 안내 / 来源说明</h3><p class="ko">${esc(DATA.sourceNoteKo)} ${speakBtn(DATA.sourceNoteKo,'ko-KR','한국어')}</p><p class="zh">${esc(DATA.sourceNoteZh)} ${speakBtn(DATA.sourceNoteZh,'zh-CN','中文')}</p></section>`;
}
function isKorean(s){ return /[가-힣]/.test(s); }
function speakLangForChoice(s){ return isKorean(s)?'ko-KR':'zh-CN'; }
function renderQuiz(l){ const p=progress[l.id]||{answers:{}}; return l.quiz.map((q,i)=>{ const chosen=p.answers&&p.answers[i]; const done=chosen!==undefined; return `<div class="mini"><h4>Q${i+1}. ${esc(q.qKo)} ${speakBtn(q.qKo,'ko-KR','Q 한국어')}</h4><p class="zh">${esc(q.qZh)} ${speakBtn(q.qZh,'zh-CN','Q 中文')}</p>${q.sentenceKo?`<p class="ko">${esc(q.sentenceKo)} ${speakBtn(q.sentenceKo,'ko-KR','문장')}</p>`:''}${q.sentenceZh?`<p class="zh">${esc(q.sentenceZh)} ${speakBtn(q.sentenceZh,'zh-CN','句子')}</p>`:''}${q.choices.map((c,ci)=>`<button class="choice ${done && ci===q.ans?'correct':''} ${done && ci===chosen && ci!==q.ans?'wrong':''}" onclick="answerQuiz(${l.id},${i},${ci})">${String.fromCharCode(65+ci)}. ${esc(c)} ${speakBtn(c, speakLangForChoice(c),'듣기')}</button>`).join('')}${done?`<div class="mini"><b>정답 / 答案:</b> ${esc(q.choices[q.ans])} ${speakBtn(q.choices[q.ans], speakLangForChoice(q.choices[q.ans]),'정답')}<p class="ko">해설: ${esc(q.exKo)} ${speakBtn(q.exKo,'ko-KR','해설')}</p><p class="zh">说明: ${esc(q.exZh)} ${speakBtn(q.exZh,'zh-CN','说明')}</p></div>`:''}</div>`; }).join(''); }
function answerQuiz(id, qi, ci){ const l=lessons.find(x=>x.id===id); progress[id]=progress[id]||{answers:{}}; progress[id].answers=progress[id].answers||{}; progress[id].answers[qi]=ci; const correct=Object.entries(progress[id].answers).filter(([idx,ans])=>l.quiz[Number(idx)].ans===ans).length; progress[id].score=correct*10; save(); renderLesson(); }
function saveWriting(id){ progress[id]=progress[id]||{answers:{}}; progress[id].writing=document.getElementById('writing').value; save(); alert('저장했습니다. / 已保存。'); }
function simpleFeedback(){ const t=document.getElementById('writing').value.trim(); const n=t.split(/[.!?。！？\n]+/).filter(Boolean).length; document.getElementById('feedback').innerHTML = `<div class="mini"><b>Feedback / 反馈</b><p>${n>=5?'좋습니다. 5문장 이상 작성했습니다.':'조금 더 써 보세요. 목표는 5문장입니다.'}</p><p>${n>=5?'很好。你已经写了五个以上的句子。':'请再多写一点。目标是五个句子。'}</p></div>`; }
function renderDashboard(){ renderList(); const tried=lessons.filter(l=>(progress[l.id]||{}).answers).length; const avg=Math.round(lessons.reduce((s,l)=>s+lessonScore(l.id),0)/lessons.length); const [bdesc, level]=badge(avg, tried>0); document.getElementById('app').innerHTML = `<section class="card"><div class="parrot">🦜</div><h2>나의 성취 대시보드 / 我的成就仪表板</h2><p class="ko">10개 단원의 학습 점수와 배지를 확인하세요. ${speakBtn('10개 단원의 학습 점수와 배지를 확인하세요.','ko-KR','한국어')}</p><p class="zh">请查看十个单元的学习分数和徽章。 ${speakBtn('请查看十个单元的学习分数和徽章。','zh-CN','中文')}</p><div class="score">${avg} / 100</div><div class="bar"><div class="fill" style="width:${avg}%"></div></div><p><span class="badge">${bdesc}</span> <span class="badge">${level}</span> <span class="badge">已尝试单元: ${tried}/10</span></p></section><section class="card"><h3>학습 배지 레전드 / 学习徽章说明</h3>${[['🦜 Ready','학습을 시작하는 단계입니다.','准备开始学习。'],['💪 Challenge','계속 연습하는 도전 단계입니다.','挑战阶段：继续练习。'],['🥈 Basic','50~60점: 기초를 이해한 단계입니다.','50–60分：理解基础内容。'],['🥇 Strong','70~80점: 안정적으로 성장한 단계입니다.','70–80分：稳定进步。'],['🏆 Excellent','90~100점: 매우 우수한 성취 단계입니다.','90–100分：非常优秀的成就。']].map(x=>`<div class="mini"><b>${x[0]}</b><p class="ko">${x[1]} ${speakBtn(x[1],'ko-KR','한국어')}</p><p class="zh">${x[2]} ${speakBtn(x[2],'zh-CN','中文')}</p></div>`).join('')}</section><section class="card"><h3>전체 단원 / 全部单元</h3><div class="dashgrid">${lessons.map(l=>{ const sc=lessonScore(l.id); const triedUnit=!!(progress[l.id]||{}).answers; const bd=badge(sc,triedUnit); return `<div class="mini"><b>单元 ${l.id} · ${esc(l.titleKo)}</b><p class="zh">${esc(l.titleZh)}</p><p>${bd[0]} · ${bd[1]}</p><div class="score">${sc}</div><div class="bar"><div class="fill" style="width:${sc}%"></div></div><p class="ko">${esc(l.themeKo)} ${speakBtn(l.themeKo,'ko-KR','한국어')}</p><p class="zh">${esc(l.themeZh)} ${speakBtn(l.themeZh,'zh-CN','中文')}</p><button class="secondary" onclick="current=${l.id};renderLesson()">열기 / 打开</button></div>`; }).join('')}</div></section>`; }
renderLesson();
</script>
</body></html>
